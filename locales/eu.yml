    values_intro: <p>Hasieratik, Decidim-ek kontratu sozial bat du, proiektuaren balioak jasotzen dituena. </p><p>Decidim Software Libreko Elkarteko kide guztiek konpromisoa hartzen dute kontratu hau errespetatzeko.</p>
    values_title: Gure balioak
