  team:
    banner:
      link: Discover the community
      subtitle: Here you can meet the institutional supporters and partners that are part of the Decidim universe.
      title: The Decidim community is even bigger
    coordination_committee:
      intro: The Coordination Committee is the governing and representative body of the Decidim Association. In practice, it works as the executive organ that ensures the association runs smoothly and stays aligned with its democratic and participatory mission.
      title: Coordination Committee
    intro: The Technical Office and the Coordination Committee are the key actors that manage and represent the Association.
    members:
      alejandra_gonzalez:
        bio: Alejandra is a philosopher-developer. She has spent 9 years implementing civic technology projects with Mexican governments and organising citizen civic hacking communities. In 2019 she was director of Open Government in the Mexico City government where she first implemented Decidim, and has been part of the community ever since. She is currently director of strategy at Codeando México and part of the coordination committee at Decidim.
        role: Vocal
      andres_lucena:
        bio: Andrés is a software developer and systems administrator specialising in open-source software and technologies for citizen participation. Over the past decade, he has worked on implementing participatory digital infrastructures with local and regional governments and political organisations in Spain.
        role: Chief Technology Officer
      antonio_calleja_lopez:
        bio: Antonio is a PhD in Sociology from the University of Exeter, a DEA in Philosophy from the University of Seville and has a Master's Degree in Political Science from Arizona State University. He is the coordinator of Tecnopolítica.net at the UOC's IN3 and co-founder of Heuristica.barcelona. He studies the multiple connections between technology, politics and society, from the platformisation of social movements, the public sphere, political parties and the state to the socio-technical construction and governance of data and digital infrastructures.
        role: Vocal
      ben_gansky:
        bio: Ben is an artist, researcher, and civic engagement designer based in Minneapolis. He collides technological artifacts + processes, stories, and humor in intermedia performances. His research deals with how people and organizations come to recognize and negotiate the politics of the digital tools they use. His civic engagement projects combine these interests to create experiences and programs for enlivening the intersection of digital politics and participatory democracy.
        role: Vocal
      carla_rocha:
        bio: Carla is a professor and researcher in Computer Science, specializing in Software Engineering. She is currently a member of the Department of Software Engineering at the University of Brasília (UnB). She boasts prolific research in software engineering, ranging from free software and agile methodologies to project-based teaching strategies. She coordinates the Brasil Participativo collaboration project with the Brazilian Federal Government.
        role: Vocal
      carolina_romero:
        bio: Carol is a technologist with over 20 years of experience in digital innovation, open government, and citizen participation. Cofounder of Decidim, she is currently the project’s Product Director.
        role: Product Owner
      david_igon:
        bio: David is a free software developer at PokeCode. He has been a member of the Decidim community since he began working there. He has always been involved in participation, co-operativism and free software.
        role: Treasurer
      elsa_boloix:
        bio: Elsa is in charge of coordinating the communication and the Decidim community. She focuses on designing and implementing communication campaigns, creating engaging content, connecting the community and disseminating all about the Decidim ecosystem, use cases and Metadecidim. With experience in internal and external communication and creative transmedia work, she also coordinates the production and organisation of the Decidim Fest.
        role: Communication & Community
      julieta_pasetti:
        bio: Julieta is a visual communication and UX/UI designer, responsible for proposing designs, contributing creativity, and transforming ideas into dynamic and participatory interfaces, combining aesthetics and usability so that each interaction improves citizen participation.
        role: UX/UI designer
      maite_orellana:
        bio: Maite is responsible for tasks related to administration, finance, human resources, and project and grant management, working closely with the Executive Management. She has previous experience in marketing, financial management and control, and human resources, both in for-profit and non-profit organizations.
        role: Administration and HR
      marta_anducas:
        bio: Marta learned computer engineering at the UPF in Barcelona, participation in the Andean and Amazonian communities of Peru, creativity in her own search, and feminism in the oppression of psychological abuse. In 2019, her paths converged in Platoniq, an organisation where Creativity and Democracy coincide.
        role: President
      nil_homedes_busquets:
        bio: Nil is a political scientist specializing in public policy, democratic participation, and technological sovereignty. He is currently the Director of the Technical Office at the Decidim Association and a member of Decidim's Product Team.
        role: Executive Director
      pauline_bessoles:
        bio: Pauline is an active member of the Decidim Association, where she contributes to the democratic governance of the project and the sustainability of the platform as a digital common. With a background in deploying Decidim in public institutions, she brings both hands-on experience and a strong commitment to participatory democracy. She currently works at XWiki SAS, a long-standing free software company, editor of XWiki and Cryptpad, where she continues to support open and collaborative digital infrastructures.
        role: Vocal
      tom_greenwood:
        bio: Tom is a software developer originating from London, he works within the technical office. With a background in commercials in the artificial intelligence space, he switched careers in 2022 opting to better understand how to build software. After graduating from a Ruby on Rails focused Web Development program at Le Wagon, he’s now involved in maintaining the Decidim application codebase and organising monthly global Developers community meet ups.
        role: Junior Developer
      txema_laullon:
        bio: Txema is a member of the Decidim Association Coordination Committee.
        role: Secretary
      xabier_barandiaran:
        bio: Xabier is a philosopher, engaged in the intersection of social practices, biological and cognitive sciences and technopolitics. He is developing an interdisciplinary approach bringing together insights from philosophy of mind, artificial life, neuroscience and social science, while actively involved in hacktivism, the reproduction of the knowledge commons and participatory democracy.
        role: Vocal
    subtitle: We're a group of people who believe technology built in the open, by the people, can transform how societies participate and make decisions together.
    technical_office:
      intro: The professional team that works for the Decidim Association and handle the daily tasks of the project.
      title: Technical Office
    title: The Team
  testimonials:
    n1:
      org: Hôtel de Ville de Barcelone (2015-2019)
      quote: '"Thanks to Decidim, in Barcelona we have managed to co-produce a strategic city plan together with the citizens. In 2016 we inaugurated the Municipal Action Plan in the form of a participatory process through Decidim Barcelona. Currently, this plan includes almost 7 thousand citizen proposals. One of the advantages of using this platform is that you can monitor at all times the state of implementation of the approved proposals."'
    n2:
      org: Som Energia
      quote: '"With the implementation of Decidim in Som Energia we have generated a kinder space for participation. We released the tool in 2018, hosting the General Assembly of the Cooperative and months later we debated the Image Redesign and collaborative development of the School of Som Energia, among other participatory processes. In a few months, more than 3,500 participant people have registered, 5 participatory processes, 3 assemblies operating and more than 1,300 votes in the last General Assembly vote."'
    n3:
      org: City Council President of Mérida Yucatán, Mexico.
      quote: '"The Decide Mérida digital platform was an opportunity that opened as never before the mechanisms of citizen participation for the elaboration of the Municipal Development Plan of Mérida 2018-2021. We had more than 3,000 citizen interactions including proposals, comments, suggestions and support that achieving the highest consensus possible about what is best for our city. Undoubtedly, the Decide Mérida platform will continue to be our ally in making Mérida an increasingly participative society."'
    n4:
      org: Ville d'Helsinki
      quote: '"What we appreciate is that it’s built with democracy in mind and therefore democracy is a big focus. Democratic principles such as accountability, equality and transparency are in the core of the design."'
    n5:
      org: Gouvernement ouvert de la ville de Mexico
      quote: '"Almost every participatory process that has come to our table, we have been able to solve it using Decidim’s business rules. As a tool, it is a very strong one. However, the part that seems strongest and most important to us is its community, both developers and those who use it for participatory processes. Coexisting with them has made us appreciate the challenges involved in implementing participatory democracy in the real world."'
    n6:
      org: Fondation Mozilla
      quote: '"We suffer under a lack of public space. Its particularly important that we reclaim these public spaces for us. Open platforms such as Decidim do exactly that. Is not only that is open source so other people can fork it, reuse it and build a process. It also has these values that we want to reflect in our society encoded in the way it’s designed."'
    n7:
      org: Directeur de la recherche OpenForum Europe, Union européenne
      quote: '"The process started in October 2019 at the European Commission’s DG Communication and eDemocracy unit at the Joint Research Centre, the European Commission’s science and knowledge service. An analysis of the needs of the Conference and which tools fit those, lead to choosing the open source tool Decidim for its technical maturity, broad community and adaptability."'
    n8:
      org: Pipeline to Power, travaillant pour la Commission d'Engagement civique de la ville de New York
      quote: '"Part of what makes Decidim so powerful is that it adds a level of abstraction to the work separating out  the steps of a process and the activities associated with the process. That’s part of the information architecture, so that not only you are saying what is happening at each step but different parts of Decidim behave differently depending on when you are doing or depending on what step in the process you are in. The fact that that’s customizable really allows Decidim to be moulded to how we are doing our work and not our work to be moulded."'
    title: Testimonials
  thanks:
    message: Merci de nous avoir contacté, nous vous répondrons sous peu.
    title: Merci pour votre e-mail
  trademark:
    examples-1:
      l1: Inclure le logo Decidim sur les pages produits pour dire "nous travaillons avec Decidim" (par exemple, hébergement, services de conseil, développements basés sur Decidim).
      l2: Utilisation de la marque de commerce "Decidim" dans les titres de livres et les articles de recherche.
      l3: Utilisation du logo Decidim dans le pied de page d'une instance (« Propulsé par Decidim »).
      title: Exemples d'utilisation qui n'ont pas besoin de permission
    examples-2:
      l1: Vendre des marchandises (autocollants, t-shirts, tasses, etc).
      l2: Utilisation du logo Decidim sur une couverture du livre.
      l3: L'utilisation du logo Decidim dans l'en-tête dans un site web, impliquant que vous êtes l'organisation Decidim.
      title: Exemples d'utilisation qui ont besoin de permission
    examples-3:
      l1: Nommer votre entreprise ou produit après Decidim, comme "Les Consultants Decidim".
      title: Exemples d'utilisation qui n'obtiendront pas la permission
    goals:
      l1: Nous aimerions faciliter l'utilisation du nom ou du logo Decidim pour des efforts orientés vers la communauté qui aident à diffuser et à améliorer Decidim.
      l2: Nous aimerions clarifier comment les entreprises et les projets liés à Decidim peuvent (ou ne peuvent pas) utiliser le nom et le logo Decidim.
      l3: Nous aimerions rendre la tâche difficile à quiconque d'utiliser le nom et le logo Decidim pour en tirer un profit injuste, tromper ou induire en erreur les personnes qui recherchent des ressources officielles de Decidim.
    p1: '"Decidim" et le logo Decidim sont des marques déposées de Associació de Software Lliure Decidim. Vous ne pouvez pas utiliser ces marques dans un cadre commercial pour affirmer que votre produit ou service est avalisé ou associé à Decidim sans autorisation. Vous pouvez utiliser ces marques pour faire référence à Decidim d''une manière où il est clair que vous faites simplement référence au projet, ne réclamant ni soutien ni association.'
    p2: 'Si vous utilisez le logo Decidim d''une manière ou d''une autre, vous devez ajouter le texte suivant : <i>"Le nom et le logo Decidim sont une marque déposée de l''Association du Logiciel Libre Decidim."</i>'
    p3: 'Nous avons développé cette politique d''utilisation des marques avec les objectifs suivants en tête :'
    p4: Vous pouvez demander la permission en envoyant un courriel à associacio@decidim.org.
    p5: Cette page de politique de marque était basée sur <a href="%{rails_url}">Ruby on Rails</a> et <a href="%{wordpress_url}">la Fondation Wordpress</a>.
    title: Politique de marque commerciale
