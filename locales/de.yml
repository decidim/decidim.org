      subtitle: Hier lernst du die institutionellen Unterstützer:innen und Partner:innen kennen, die Teil des Decidim-Universums sind.
      title: Die Decidim-Community ist noch grösser
    coordination_committee:
      intro: Der Koordinationsausschuss ist das leitende und repräsentative Gremium der Decidim Association. In der Praxis fungiert er als ausführendes Organ, das sicherstellt, dass die Vereinigung reibungslos funktioniert und ihrer demokratischen und partizipativen Mission treu bleibt.
      title: Koordinationsausschuss
    intro: Das Technische Büro und der Koordinationsausschuss sind die zentralen Akteure, die die Association leiten und vertreten.
    members:
      alejandra_gonzalez:
        bio: Alejandra is a philosopher-developer. She has spent 9 years implementing civic technology projects with Mexican governments and organising citizen civic hacking communities. In 2019 she was director of Open Government in the Mexico City government where she first implemented Decidim, and has been part of the community ever since. She is currently director of strategy at Codeando México and part of the coordination committee at Decidim.
        role: Beisitzende
      andres_lucena:
        bio: Andrés is a software developer and systems administrator specialising in open-source software and technologies for citizen participation. Over the past decade, he has worked on implementing participatory digital infrastructures with local and regional governments and political organisations in Spain.
        role: Chief Technology Officer
      antonio_calleja_lopez:
        bio: Antonio is a PhD in Sociology from the University of Exeter, a DEA in Philosophy from the University of Seville and has a Master's Degree in Political Science from Arizona State University. He is the coordinator of Tecnopolítica.net at the UOC's IN3 and co-founder of Heuristica.barcelona. He studies the multiple connections between technology, politics and society, from the platformisation of social movements, the public sphere, political parties and the state to the socio-technical construction and governance of data and digital infrastructures.
        role: Beisitzende
      ben_gansky:
        bio: Ben is an artist, researcher, and civic engagement designer based in Minneapolis. He collides technological artifacts + processes, stories, and humor in intermedia performances. His research deals with how people and organizations come to recognize and negotiate the politics of the digital tools they use. His civic engagement projects combine these interests to create experiences and programs for enlivening the intersection of digital politics and participatory democracy.
        role: Beisitzende
      carla_rocha:
        bio: Carla is a professor and researcher in Computer Science, specializing in Software Engineering. She is currently a member of the Department of Software Engineering at the University of Brasília (UnB). She boasts prolific research in software engineering, ranging from free software and agile methodologies to project-based teaching strategies. She coordinates the Brasil Participativo collaboration project with the Brazilian Federal Government.
        role: Beisitzende
      carolina_romero:
        bio: Carol is a technologist with over 20 years of experience in digital innovation, open government, and citizen participation. Cofounder of Decidim, she is currently the project’s Product Director.
        role: Product Owner
      david_igon:
        bio: David is a free software developer at PokeCode. He has been a member of the Decidim community since he began working there. He has always been involved in participation, co-operativism and free software.
        role: Kassier
      elsa_boloix:
        bio: Elsa ist verantwortlich für die Koordination der Kommunikation und der Decidim-Community. Ihr Fokus liegt auf der Gestaltung und Umsetzung von Kommunikationskampagnen, der Erstellung ansprechender Inhalte, der Vernetzung der Community und der Verbreitung von Informationen über das Decidim-Ökosystem, Anwendungsfälle und Metadecidim. Mit Erfahrung in interner und externer Kommunikation sowie kreativer, transmedialer Arbeit koordiniert sie zudem die Produktion und Organisation des Decidim Fest.
        role: Kommunikation & Community
      julieta_pasetti:
        bio: Julieta is a visual communication and UX/UI designer, responsible for proposing designs, contributing creativity, and transforming ideas into dynamic and participatory interfaces, combining aesthetics and usability so that each interaction improves citizen participation.
        role: UX/UI-Designer
      maite_orellana:
        bio: Maite ist zuständig für Aufgaben in den Bereichen Administration, Finanzen, Personalwesen sowie Projekt- und Fördermittelmanagement und arbeitet dabei eng mit der Geschäftsleitung zusammen. Sie bringt Erfahrung aus den Bereichen Marketing, Finanzmanagement und -kontrolle sowie Personalwesen mit, sowohl in gewinnorientierten als auch in gemeinnützigen Organisationen.
        role: Administration und Personalwesen
      marta_anducas:
        bio: Marta lernte Informatik an der UPF in Barcelona, Beteiligung in den andinen und amazonischen Gemeinschaften Perus, Kreativität auf ihrer eigenen Suche und Feminismus in der Auseinandersetzung mit psychischer Gewalt. 2019 fanden ihre Wege bei Platoniq zusammen, einer Organisation, in der Kreativität und Demokratie aufeinandertreffen.
        role: Präsidentin
      nil_homedes_busquets:
        bio: Nil is a political scientist specializing in public policy, democratic participation, and technological sovereignty. He is currently the Director of the Technical Office at the Decidim Association and a member of Decidim's Product Team.
        role: Geschäftsführer
      pauline_bessoles:
        bio: Pauline is an active member of the Decidim Association, where she contributes to the democratic governance of the project and the sustainability of the platform as a digital common. With a background in deploying Decidim in public institutions, she brings both hands-on experience and a strong commitment to participatory democracy. She currently works at XWiki SAS, a long-standing free software company, editor of XWiki and Cryptpad, where she continues to support open and collaborative digital infrastructures.
        role: Beisitzende
      tom_greenwood:
        bio: Tom is a software developer originating from London, he works within the technical office. With a background in commercials in the artificial intelligence space, he switched careers in 2022 opting to better understand how to build software. After graduating from a Ruby on Rails focused Web Development program at Le Wagon, he’s now involved in maintaining the Decidim application codebase and organising monthly global Developers community meet ups.
        role: Junior Developer
      txema_laullon:
        bio: Txema ist Mitglied des Koordinationsausschusses der Decidim Association.
        role: Sekretär
      xabier_barandiaran:
        bio: Xabier is a philosopher, engaged in the intersection of social practices, biological and cognitive sciences and technopolitics. He is developing an interdisciplinary approach bringing together insights from philosophy of mind, artificial life, neuroscience and social science, while actively involved in hacktivism, the reproduction of the knowledge commons and participatory democracy.
        role: Beisitzende
    subtitle: Wir sind eine Gruppe von Menschen, die daran glauben, dass offen und von den Menschen selbst entwickelte Technologie verändern kann, wie Gesellschaften gemeinsam mitwirken und Entscheidungen treffen.
    technical_office:
      intro: Das professionelle Team, das für die Decidim Association arbeitet und sich um die täglichen Aufgaben des Projekts kümmert.
      title: Technisches Büro
    title: Das Team
  testimonials:
    n1:
      org: Rathaus von Barcelona (2015-2019)
      quote: '«Dank Decidim ist es uns in Barcelona gelungen, gemeinsam mit der Bürgerschaft einen strategischen Stadtplan zu erarbeiten. 2016 haben wir den Municipal Action Plan in Form eines Beteiligungsprozesses über Decidim Barcelona eingeführt. Aktuell umfasst dieser Plan fast 7’000 Bürgervorschläge. Einer der Vorteile dieser Plattform ist, dass man jederzeit den Umsetzungsstand der genehmigten Vorschläge verfolgen kann.»'
    n2:
      org: Som Energia
      quote: '«Mit der Einführung von Decidim bei Som Energia haben wir einen freundlicheren Raum für Beteiligung geschaffen. Wir haben das Tool 2018 lanciert und darüber die Generalversammlung der Genossenschaft durchgeführt; Monate später haben wir dort unter anderem das Redesign des Erscheinungsbilds und die gemeinsame Entwicklung der Schule von Som Energia diskutiert. Innerhalb weniger Monate haben sich mehr als 3’500 Teilnehmende registriert, 5 Beteiligungsprozesse und 3 Versammlungen sind in Betrieb, und bei der letzten Generalversammlung wurden mehr als 1’300 Stimmen abgegeben.»'
    n3:
      org: Stadtratspräsident:in von Mérida, Yucatán, Mexiko.
      quote: '«Die digitale Plattform Decide Mérida war eine Gelegenheit, die die Mechanismen der Bürgerbeteiligung für die Erarbeitung des Munizipalen Entwicklungsplans von Mérida 2018–2021 wie nie zuvor geöffnet hat. Wir verzeichneten mehr als 3’000 Interaktionen der Bürgerschaft, darunter Vorschläge, Kommentare, Anregungen und Unterstützungsbekundungen, mit denen wir den grösstmöglichen Konsens darüber erzielen konnten, was das Beste für unsere Stadt ist. Die Plattform Decide Mérida wird zweifellos weiterhin unser Verbündeter dabei sein, Mérida zu einer zunehmend partizipativen Gesellschaft zu machen.»'
    n4:
      org: Stadt Helsinki
      quote: '«Was wir schätzen, ist, dass es mit Blick auf Demokratie entwickelt wurde und Demokratie deshalb im Zentrum steht. Demokratische Prinzipien wie Rechenschaftspflicht, Gleichheit und Transparenz sind im Kern des Designs verankert.»'
    n5:
      org: Offene Regierung von Mexiko-Stadt
      quote: '«Fast jeden Beteiligungsprozess, der uns vorgelegen hat, konnten wir mithilfe der Geschäftsregeln von Decidim lösen. Als Werkzeug ist es sehr leistungsstark. Was uns jedoch am stärksten und wichtigsten erscheint, ist seine Community – sowohl die Entwickelnden als auch jene, die es für Beteiligungsprozesse nutzen. Der Austausch mit ihnen hat uns gelehrt, die Herausforderungen bei der Umsetzung partizipativer Demokratie in der Praxis zu schätzen.»'
    n6:
      org: Mozilla Foundation
      quote: '«Uns fehlt es an öffentlichem Raum. Es ist besonders wichtig, dass wir uns diese öffentlichen Räume zurückerobern. Offene Plattformen wie Decidim tun genau das. Es geht nicht nur darum, dass es Open Source ist, sodass andere Menschen es forken, weiterverwenden und einen eigenen Prozess aufbauen können. Es trägt auch jene Werte in sich, die wir in unserer Gesellschaft widergespiegelt sehen wollen – eingeschrieben in die Art, wie es gestaltet ist.»'
    n7:
      org: Forschungsdirektor bei OpenForum Europe, Europäische Union
      quote: '«Der Prozess begann im Oktober 2019 bei der Einheit DG Communication und eDemocracy der Europäischen Kommission am Joint Research Centre, dem wissenschaftlichen Dienst der Europäischen Kommission. Eine Analyse der Bedürfnisse der Konferenz und der dafür geeigneten Werkzeuge führte zur Wahl des Open-Source-Tools Decidim aufgrund seiner technischen Reife, seiner breiten Community und seiner Anpassungsfähigkeit.»'
    n8:
      org: Pipeline to Power, tätig für die New Yorker Kommission für zivilgesellschaftliche Beteiligung
      quote: '«Ein Teil dessen, was Decidim so leistungsfähig macht, ist, dass es eine Abstraktionsebene hinzufügt, die die Schritte eines Prozesses von den damit verbundenen Aktivitäten trennt. Das ist Teil der Informationsarchitektur: So legst du nicht nur fest, was in jedem Schritt passiert, sondern unterschiedliche Teile von Decidim verhalten sich je nach Zeitpunkt oder je nach Prozessschritt, in dem du dich befindest, unterschiedlich. Dass sich das anpassen lässt, erlaubt es, Decidim wirklich nach unserer Arbeitsweise zu formen – und nicht unsere Arbeit nach Decidim.»'
    title: Stimmen
  thanks:
    message: Vielen Dank, dass Sie uns kontaktiert haben, wir werden uns umgehend mit Ihnen in Verbindung setzen.
    title: Vielen Dank für Ihre E-Mail
  trademark:
    examples-1:
      l1: 'Das Decidim-Logo auf Produktseiten verwenden, um sichtbar zu machen: „Wir arbeiten mit Decidim“ – zum Beispiel bei Hosting-Angeboten, Beratungsleistungen oder auf Decidim basierenden Entwicklungen.'
      l2: Verwendung der Marke „Decidim“ in Buchtiteln und wissenschaftlichen Artikeln.
      l3: Verwendung des Decidim-Logos im Footer einer Instanz („Powered by Decidim“).
      title: Anwendungsbeispiele, die keine Berechtigung benötigen
    examples-2:
      l1: Verkauf von Waren (Aufkleber, T-Shirts, T-Shirts, Tassen, etc).
      l2: Verwendung des Decidim-Logos auf einem Buchcover.
      l3: Verwendung des Decidim-Logos in einem Header auf einer Website, was bedeutet, dass du die Decidim-Organisation bist.
      title: Anwendungsbeispiele, die Berechtigung benötigen
    examples-3:
      l1: Benennen Sie Ihr Unternehmen oder Ihr Produkt nach Decidim, wie "Die Decidim Berater".
      title: Anwendungsbeispiele, die keine Berechtigung erhalten
    goals:
      l1: Wir möchten es allen möglichst einfach machen, den Namen oder das Logo von Decidim für gemeinschaftsorientierte Initiativen zu nutzen, die zur Verbreitung und Weiterentwicklung von Decidim beitragen.
      l2: Wir möchten klar festhalten, wie Decidim-bezogene Unternehmen und Projekte den Namen und das Logo von Decidim verwenden dürfen – und wo die Grenzen liegen.
      l3: Wir möchten verhindern, dass der Name oder das Logo von Decidim missbräuchlich genutzt wird, um unfaire Vorteile zu erzielen oder Menschen zu täuschen bzw. zu verwirren, die nach offiziellen Decidim-Angeboten suchen.
    p1: '„Decidim“ und das Decidim-Logo sind eingetragene Marken der Associació de Software Lliure Decidim. Diese Marken dürfen nicht in einem kommerziellen Kontext verwendet werden, um ohne ausdrückliche Genehmigung den Eindruck zu erwecken, dass ein Produkt oder eine Dienstleistung von Decidim unterstützt wird oder mit Decidim verbunden ist. Die Marken dürfen jedoch verwendet werden, um auf Decidim zu verweisen, sofern dabei klar ist, dass lediglich das Projekt genannt wird und keine Unterstützung oder offizielle Verbindung behauptet wird.'
    p2: "Wenn du das Decidim-Logo in irgendeiner Form verwendest, musst du folgenden Hinweis hinzufügen:\n<i>„Der Name und das Logo von Decidim sind eingetragene Marken der Associació de Software Lliure Decidim.“</i>"
    p3: 'Wir haben diese Richtlinie zur Markennutzung mit folgenden Zielen entwickelt:'
    p4: Du kannst eine Genehmigung beantragen, indem du eine E-Mail an associacio@decidim.org.
    p5: Diese Seite zur Markennutzungsrichtlinie basiert auf Vorlagen von <a href="%{rails_url}">Ruby on Rails</a> und der <a href="%{wordpress_url}">WordPress Foundation</a>.
    title: Markenschutzrichtlinie
