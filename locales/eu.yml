    history:
      timeline:
        - 
          year: 2011
          above: Guztia M15 mugimenduarekin eta aurreko hacktibisten bateratzearekin, Espainiako aktibismo autonomo eta demokratikoarekin eta ziklo teknopolitikoaren gorakadarekin hasi zen.
        - 
          year: 2016
          below: Bartzelonan, 2016aren hasieran, Consul-en sardexka bat erabili zen, Madrilgo Udalaren plataforma parte-hartzailea, <a href="https://decidim.barcelona" class="underline decoration-1">decidim.barcelona</a>, gunea elikatzeko. Gune hori udaleko parte-hartze prozesuetarako egoitza digital berria da.
        - 
          year: 2017
          above: Udaleko berrikuntza demokratikoko taldeen arteko ikuspegi- eta praktika-desberdintasun teknopolitikoek bi hirien arteko zatiketa ekarri zuten; ondorioz, Decidim 2017. urtearen hasieran jarri zen martxan, software berri gisa, arkitektura modularrago eta ko-garagarriago batekin.
        - 
          year: 2019
          below: 2019an Decidim Software Librearen Elkartea eratu zen eta Bartzelonako Udalarekin hitzarmen bat sinatu zen, Elkarteari kode-oinarriaren mantenua lagaz. Horrek Decidim proiektu publiko-komun bihurtzen du.
        - 
          year: 2025
          above: Orain arte, mundu osoko 450 hiri eta erakundek baino gehiagok parte hartu dute Decidimen. Eta Decidim Elkartea hazten joan da teknologia demokratikoetan eta kode irekiko softwarean nazioarteko lider gisa.
      title: Gure historia, hitz gutxitan
    intro: Gizartea demokratizatzen lagundu nahi dugu teknologia, metodologia, praktika, estandar, ekintza, narrazio eta balioen eraikuntzaren bidez, modu aske, ireki, kolaboratibo eta gogoetatsuan.
    mission:
      subtitle: Gure eginkizuna da <span class="underline decoration-2">gizartea demokratizatzen laguntzea</span>, teknologia, metodologiak, praktikak, estandarrak eta balioak eraikiz, modu libre, ireki, kolaboratibo eta gogoetatsuan.
      title: Xedea
    partners:
      cta: Gure 2025 Jarduera Txostena ere kontsulta dezakezu
      subtitle: Elkarteak berrikuntza demokratikoarekin, ikerketarekin, komun digitalen gobernantzarekin eta FLOSS teknologien garapenarekin lotutako hainbat proiektutan lan egiten du. Beren esparruan liderrak diren erakundeekin lan egiten dugu.
      title: Gure azkenaldiko lana
    recognitions:
      digital_public_good: Ondasun Digital Publikoa
      osor_award: Decidim OSOR sariaren finalista bihurtu zen EBko Zerbitzu Publikoen Kode Irekiko Lorpen Sarietan
      pizzigati_prize: Decidim NTENek sustatutako Interes Publikoko Softwarearen Pizzigati sariarekin saritu zuten
