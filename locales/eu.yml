    explanation: Decidim sustatzeak denbora eta baliabideak eskatzen ditu. Hainbat lan kudeatu behar dira, hala nola ekarpenak berrikustea, triaging kontuak, akatsak konpontzea, dokumentazioa idaztea eta komunitateak partekatzen dituen zalantza orokorrak erantzutea. Decidim Partner bihurtzeko prest dagoen edozein erakundek (enpresak, elkarteak edo kolektiboak) konpromisoa hartzen du Decidim Elkarteari ekarpenak egiteko, Decidim jarduerek sortutako urteko diru-sarreren % 3ko kuota murriztuarekin. Irabazi asmorik gabeko erakundeen kasuan, tasa hori %1,5ekoa da. <a href="%{main_website_url}">Decidim webgune nagusian</a> eta <a href="%{readme_url}">GitHub proiektuaren README orrian</a> ikusgai jarriko dira Decidim Partner guztiak. Gainera, Decidim Elkarteak Decidim Partners gomendatuko du Decidim-ekin zerbitzuak emateari buruzko gure hitzaldi eta elkarrizketa elektronikoetan. Sartu berri diren erakundeei laguntzeko, Decidim Partnersek ez dute ekarpen ekonomikorik egingo beren lehen urtean, Decidim-ekin negozio-plana lehen aldiz gara dezaten. Bitartean, Decidim Partnersi proiektuan laguntzeko beste bide batzuk aurkitzea gomendatzen diogu (hala nola akatsen berri emanez, dokumentazioa, komunitateko jardueretan parte hartzea eta laguntzea, etab.).
