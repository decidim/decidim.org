  privacy-policy:
    section-1:
      paragraph: <p>L'Associació de Software Lliure Decidim ("<a href="%{decidim_url}">Decidim</a>" o "nosaltres") és la titular d'aquest lloc web, disponible a través del domini <a href="https://decidim.org/">https://decidim.org/</a> (d'ara endavant, el "Lloc web"), i actua com a responsable del tractament de les dades personals de totes les persones usuàries del Lloc web ("vostè", la "Persona usuària").</p> <p><a href="%{decidim_url}">Decidim</a> es compromet a protegir la privadesa de totes les persones usuàries del Lloc web, de les persones membres associades i de les persones que formen part de la comunitat <a href="%{decidim_url}">Decidim</a>. Aquesta Política de privacitat explica les nostres pràctiques pel que fa a l'ús de les dades personals recollides a través del Lloc web, inclosa la demostració de la nostra plataforma lliure i de codi obert per a la democràcia participativa, així com el tractament de les dades de les persones vinculades a <a href="%{decidim_url}">Decidim</a> i la gestió de la comunitat <a href="%{decidim_url}">Decidim</a>, tant en aquest Lloc web com en altres plataformes gestionades per <a href="%{decidim_url}">Decidim</a>.</p> <p>Aquesta Política de privacitat forma part dels nostres Textos legals, juntament amb l'<a href="%{legal_notice_url}">Avís legal</a>.</p>
      title: Introducció
    section-2:
      paragraph: '<h3>a. Dades recollides durant la navegació pel Lloc web</h3> <p>Quan utilitzeu el nostre lloc web, <a href="%{decidim_url}">Decidim</a> fa servir els serveis del programari d''anàlisi Plausible. Es tracta d''un programari que, quan fa el seguiment de les dades de les persones usuàries, les manté íntegrament xifrades i de manera segura. La finalitat de Plausible Analytics és analitzar les tendències generals de trànsit del lloc web, i no pas les persones visitants de manera individual. Cada sol·licitud HTTP envia l''adreça IP i l''agent d''usuari al servidor, i és aquesta la informació que s''utilitza per generar un identificador que canvia cada dia a partir de l''adreça IP i l''agent d''usuari de la persona visitant. Per anonimitzar aquestes dades, es fan passar per una funció de resum (hash) amb una sal rotatòria. Això genera una cadena aleatòria de lletres i números que s''utilitza per calcular el nombre de visitants únics del dia. L''adreça IP de les dades en brut i l''agent d''usuari no s''emmagatzemen mai en registres, bases de dades ni enlloc del disc de Plausible Analytics. Les sals més antigues se suprimen cada 24 hores per evitar la possibilitat de vincular la informació de les persones visitants d''un dia amb la del dia següent.   D''aquesta manera, no es recullen dades personals de les persones usuàries mentre navegueu pel nostre lloc web. Per a més informació sobre el tractament de dades que fa Plausible Analytics, podeu visitar el seu lloc web a <a href="https://plausible.io/privacy-focused-web-analytics">https://plausible.io/privacy-focused-web-analytics</a></p> <h3>b. Dades recollides a partir de la nostra demostració</h3> <p>L''accés a la demostració de la plataforma <a href="%{decidim_url}">Decidim</a>, disponible a través del Lloc web en l''URL <a href="https://try.decidim.org/">https://try.decidim.org/</a>, és anònim, ja que es fa mitjançant credencials genèriques perquè les persones usuàries puguin provar i conèixer el funcionament, les característiques i les capacitats de la plataforma <a href="%{decidim_url}">Decidim</a>. <p>Només s''activa una galeta de sessió ("Session_id"), la finalitat de la qual és obtenir o establir l''identificador de sessió de la sessió en curs. Aquesta galeta és estrictament necessària per a la funcionalitat tècnica de detectar la sessió al Lloc web, amb l''objectiu de garantir la connexió mitjançant protocols http i de mantenir disponibles la sessió de la persona usuària i els serveis del lloc web, i queda exclosa de l''exigència de consentiment de la persona usuària d''acord amb el Dictamen 4/2012 sobre l''exempció de l''exigència de consentiment per a les galetes, emès per l''Autoritat Europea de Protecció de Dades.</p> <h3>c. Dades recollides a través de formularis de contacte, correus electrònics o altres mitjans de comunicació</h3> <p>Quan les persones es posen en contacte amb nosaltres mitjançant el formulari de contacte, el correu electrònic o mitjans de comunicació similars, recollim automàticament la informació següent: nom, entitat, adreça de correu electrònic i contingut del missatge de la persona usuària, per poder atendre els vostres comentaris, sol·licituds, suggeriments, etc.</p> <p>Addicionalment, podem tractar aquestes dades per realitzar estudis estadístics mitjançant tècniques de pseudonimització i fins i tot d''anonimització, com l''agregació de dades, per evitar que aquest tractament posterior identifiqui individualment les persones usuàries.</p> <h3>d. Dades recollides de la comunitat <a href="%{decidim_url}">Decidim</a></h3> <p><a href="%{decidim_url}">Decidim</a> utilitza altres plataformes vinculades a aquest Lloc web  per a la gestió de la comunitat <a href="%{decidim_url}">Decidim</a> generada al voltant de la nostra tecnologia, com a punt de trobada de la comunitat <a href="%{decidim_url}">Decidim</a> i on tenen lloc la majoria de les activitats i comunicacions entre les persones usuàries i <a href="%{decidim_url}">Decidim</a>. Aquestes plataformes, com ara <a href="https://meta.decidim.org/">https://meta.decidim.org/</a> o GitHub (<a href="https://github.com/decidim/decidim">https://github.com/decidim/decidim</a>), es regeixen pels seus propis termes d''ús i polítiques de privacitat.</p> <p>No obstant això, <a href="%{decidim_url}">Decidim</a> pot tractar les dades personals de les persones usuàries recollides a partir d''aquestes plataformes per a la gestió dels projectes comunitaris desenvolupats en cadascuna d''elles. En particular, aquestes dades personals poden consistir en dades de connexió a les plataformes, el perfil de la persona usuària a la plataforma i el contingut dels comentaris i observacions que la persona usuària hi pugui aportar periòdicament per als projectes de <a href="%{decidim_url}">Decidim</a>. Tingueu en compte que aquesta informació pot ser pública i, per tant, accessible i visible per a altres persones usuàries.</p> <h3>e. Dades recollides de les nostres persones membres associades</h3> <p>Qualsevol persona o organització que vulgui participar lliurement en la comunitat <a href="%{decidim_url}">Decidim</a>, assistint a debats, col·laborant en l''organització d''esdeveniments, promovent un grup de treball o les jornades de la comunitat, així com contribuint al codi o a la documentació de la nostra plataforma lliure i de codi obert per a la democràcia participativa, a la gestió d''instàncies, etc., pot decidir esdevenir membre de <a href="%{decidim_url}">Decidim</a>, sempre que hagi demostrat un compromís suficient amb la comunitat mitjançant la realització de qualsevol de les activitats esmentades. Per fer-ho, cal emplenar un formulari per presentar la sol·licitud, que serà avaluada pel Comitè de Coordinació de <a href="%{decidim_url}">Decidim</a>.</p> <p>El tractament de les dades personals de les persones membres de <a href="%{decidim_url}">Decidim</a> es duu a terme amb la finalitat de gestionar els projectes i les activitats esmentats en què participa la persona membre associada, la gestió comptable de les quotes d''afiliació i, en general, la governança dels projectes i les activitats de <a href="%{decidim_url}">Decidim</a>, per garantir el compliment dels principis i valors de <a href="%{decidim_url}">Decidim</a>, així com dels deures i drets de les persones associades.</p>'
      title: Dades personals que recollim sobre vosaltres i com les utilitzem
    section-3:
      paragraph: <p>Aquestes són les bases jurídiques del nostre tractament de dades personals:</p> <ul> <li>El tractament de les dades de les persones usuàries i de les persones associades és necessari per executar el contracte, que consisteix en l'acceptació per part de les persones usuàries dels Textos legals del Lloc web, amb la finalitat de proporcionar-los tota la informació sobre <a href="%{decidim_url}">Decidim</a> i la seva tecnologia, els seus projectes i les seves activitats, així com per permetre'ls participar en els projectes i les activitats duts a terme per <a href="%{decidim_url}">Decidim</a>.</li> <li>També podem tractar les vostres dades personals quan ens doneu el vostre consentiment exprés perquè fem publicacions sobre projectes i activitats de <a href="%{decidim_url}">Decidim</a> en què hagueu participat, notes de premsa o altres formes de comunicació i difusió de les activitats de <a href="%{decidim_url}">Decidim</a>, així com per rebre informació concreta de manera periòdica o quan us poseu en contacte amb nosaltres a través del formulari de contacte del lloc web o per correu electrònic. </li> <li>Addicionalment, podem tractar les vostres dades basant-nos en el nostre interès legítim per dur a terme estudis estadístics o altres tècniques de generació de coneixement, aplicant mesures de pseudonimització i, si és possible, d'anonimització, com l'agregació de dades, amb l'objectiu de protegir la privadesa de les persones usuàries, d'acord amb l'art. 89 del RGPD.</li> </ul> <p>En certes circumstàncies, podem tractar les vostres dades conforme a aquesta política per complir una obligació legal o normativa a la qual estem subjectes.</p>
      title: Base jurídica
    section-4:
      paragraph: '<p>Tractem les vostres dades personals de manera confidencial d''acord amb la legislació aplicable. Llevat que s''indiqui el contrari, les vostres dades personals no es cediran a tercers. </p> <p>Més concretament, comunicuem les vostres dades de la manera següent:</p> <ul> <li>Podem donar accés a les vostres dades personals als nostres proveïdors de serveis informàtics, en virtut de contractes de prestació de serveis a favor de <a href="%{decidim_url}">Decidim</a>. Entre d''altres, Netlify, Inc., una entitat estatunidenca que ens presta serveis d''allotjament web. <a href="%{decidim_url}">Decidim</a> ha subscrit amb Netlify un <a href="https://www.netlify.com/v3/static/pdf/netlify-dpa.pdf">acord de tractament de dades</a>, que inclou les clàusules contractuals tipificades aprovades actualment per la Comissió Europea, amb l''objectiu de garantir que les vostres dades personals es tractin amb totes les garanties adequades. Podeu consultar més informació sobre com utilitza Netlify les vostres dades personals aquí: <a href="https://www.netlify.com/gdpr-ccpa">https://www.netlify.com/gdpr-ccpa</a>. </li> <li>Podem posar les dades a disposició de les administracions públiques o de les autoritats per investigar sospites de frau, assetjament o altres infraccions de qualsevol llei, norma, reglament o de les polítiques del lloc web.</li> </ul> <p>Per a més informació sobre els nostres proveïdors de serveis que duen a terme transferències internacionals, contacteu-nos a <a href="mailto:privacy@decidim.org">privacy@decidim.org</a>.</p>'
      title: Comunicació de dades
    section-5:
      paragraph: "<p>Conservem les vostres dades personals només durant el temps que sigui necessari per complir les finalitats per a les quals les hem recollit, fins i tot per complir els requisits legals, comptables o d'informació.</p> <p>Per determinar el període de conservació adequat de les dades personals, tenim en compte el volum, la naturalesa i la sensibilitat de les dades personals, el risc potencial de dany derivat d'un ús o una divulgació no autoritzats de les vostres dades personals, les finalitats per a les quals tractem les vostres dades personals, si podem assolir aquestes finalitats per altres mitjans i els requisits legals aplicables.</p>"
      title: Conservació de les dades
    section-6:
      paragraph: "<p>Apliquem mesures de seguretat i esquemes de protecció de dades personals, tal com exigeix la llei, per mantenir la confidencialitat i la integritat de les vostres dades i protegir-les contra l'accés, la modificació o la destrucció no autoritzats. </p>"
      title: Mesures de seguretat
    section-7:
      paragraph: '<p>En virtut de la legislació de protecció de dades, teniu drets en relació amb les vostres dades personals. Concretament, teniu dret a: </p> <ul> <li><b>Sol·licitar l''accés</b> a les vostres dades personals (el que habitualment es coneix com a "sol·licitud d''accés de la persona interesada"). Això us permet rebre una còpia de les dades personals que conservem sobre vosaltres i comprovar que les estem tractant de manera lícita.</li> <li><b>Sol·licitar la rectificació</b> de les dades personals que conservem sobre vosaltres. Això us permet obtenir la correcció de les dades incompletes o inexactes que conservem sobre vosaltres, si bé pot ser que hàgim de verificar l''exactitud de les dades noves que ens proporcioneu.</li> <li><b>Sol·licitar la supressió</b> de les vostres dades personals. Això us permet demanar-nos que eliminem o suprimim dades personals quan no hi hagi cap motiu fonamentat perquè continuïm tractant-les. També teniu dret a demanar-nos que eliminem o suprimim les vostres dades personals quan hàgiu exercit amb èxit el vostre dret d''oposició al tractament (vegeu més avall), quan haguéssim tractat la vostra informació de manera il·lícita o quan estiguem obligats a suprimir les vostres dades personals per complir la legislació local. Tingueu en compte, però, que pot ser que no sempre puguem atendre la vostra sol·licitud de supressió per raons jurídiques concretes, que us notificarem, si escau, en el moment de fer la sol·licitud.</li> <li><b>Oposar-vos al tractament</b> de les vostres dades personals quan ens basem en un interès legítim (o en el d''un tercer) i hi ha alguna circumstància de la vostra situació concreta que us fa voler oposar-vos-hi per aquest motiu, perquè considereu que afecta els vostres drets i llibertats fonamentals. També teniu dret a oposar-vos quan tractem les vostres dades personals amb finalitats de màrqueting directe. En alguns casos, pot ser que puguem demostrar que disposem de motius legítims imperiosos per tractar la vostra informació que prevalen sobre els vostres drets i llibertats.</li> <li><b>Sol·licitar la limitació del tractament</b> de les vostres dades personals. Això us permet demanar-nos que suspenguem el tractament de les vostres dades personals en els supòsits següents: (a) si voleu que verifiquem l''exactitud de les dades; (b) quan el nostre ús de les dades és il·lícit, però vosaltres no voleu que les suprimim; (c) quan necessiteu que conservem les dades tot i que nosaltres ja no en necessitem, perquè les necessiteu per formular, exercitar o defensar reclamacions legals, o (d) us heu oposat al nostre ús de les vostres dades, però necessitem verificar si disposem de motius legítims imperiosos per utilitzar-les.</li> <li><b>Sol·licitar la transferència</b> de les vostres dades personals a vosaltres mateixos o a un tercer (dret a la portabilitat de les dades). Us proporcionarem a vosaltres, o al tercer que hàgiu triat, les vostres dades personals en un format estructurat, d''ús corrent i llegible per màquina. Tingueu en compte que aquest dret només s''aplica a la informació tractada de manera automatitzada per a la qual vau donar inicialment el vostre consentiment perquè l''utilitzéssim, o quan vam utilitzar la informació per executar un contracte amb vosaltres.</li> <li><b>Retirar el consentiment en qualsevol moment</b> quan ens basem en el consentiment per tractar les vostres dades personals. No obstant això, això no afectarà la licitud de cap tractament realitzat abans que en retireu el consentiment. Si en retireu el consentiment, pot ser que no puguem oferir-vos determinats productes o serveis. Us ho comunicarem si aquest és el cas, en el moment que en retireu el consentiment.</li> </ul> <p>Podeu exercir els drets esmentats posant-vos en contacte amb nosaltres a <a href="mailto:privacy@decidim.org">privacy@decidim.org</a>. <p>També teniu dret a presentar qualsevol reclamació davant l''autoritat competent, en aquest cas l''Agència Espanyola de Protecció de Dades (Agencia Española de Protección de Datos), C/. Jorge Juan, 6, 28001 Madrid, Espanya.'
      title: Els vostres drets
    section-8:
      paragraph: "<p>Ens reservem el dret de modificar els termes d'aquesta Política de privacitat i us ho notificarem mitjançant un avís clar d'aquests canvis, per correu electrònic o al nostre Lloc web, així com en aquesta mateixa Política de privacitat. Si continueu utilitzant els nostres serveis després d'aquesta actualització, es considerarà que accepteu els nous termes. Si no accepteu l'actualització, si us plau, tanqueu el vostre compte o aviséu-nos, i nosaltres tancarem el vostre compte i eliminarem totes les vostres dades personals (excepte les que calgui conservar per finalitats legals), de manera que no podreu continuar utilitzant els nostres serveis. </p> <p>Llevat que una normativa local específica disposi el contrari, aquesta Política de privacitat es regeix per la legislació espanyola.</p> <p><b>Darrera actualització</b>: febrer de 2022.</p>"
      title: General
    title: Política de privacitat
  supporters:
    collaborators: Col·laboradors
    how_to_support:
      back_to_supporters: Tornar als suports
      intro: La responsabilitat principal de l'Associació és el manteniment del codi font, així que totes les organitzacions que fan servir Decidim depenen d'aquesta feina. El codi necessita manteniment, igual que qualsevol altre tipus d'infraestructura física. Si ningú no es fes càrrec d'aquesta tasca, la tecnologia de Decidim quedaria obsoleta i inservible. Per aquest motiu, la feina de l'Associació és d'interès públic, ja que moltes administracions i institucions públiques se'n beneficien directament. Dit això, hi ha diferents maneres de col·laborar amb l'Associació. Estem definint una escala de col·laboració que va de menys a més. L'objectiu és proposar un camí progressiu de col·laboració entre les organitzacions públiques i l'Associació Decidim.
      step1:
        body: L'administració pública pot participar en esdeveniments de la comunitat, com el Decidim Fest, i explicar-hi la seva experiència en l'ús de Decidim. Aquest pas de col·laboració és el fruit més a l'abast de l'escala.
        title: 'Participar en esdeveniments de la comunitat:'
      step2:
        body: L'administració pública pot finançar el desenvolupament d'una funcionalitat concreta que figuri a la fulla de ruta de Decidim i que també sigui una prioritat per a l'administració pública. El govern podria pagar el desenvolupament d'aquesta millora o nova funcionalitat, que després s'integraria al nucli de Decidim. En aquest cas, també caldria pagar a l'Associació les hores dedicades a la coordinació, la definició del producte i la revisió del codi.
        title: 'Finançar una funcionalitat de la fulla de ruta:'
      step3:
        body: El govern i l'Associació poden establir un Memoràndum d'enteniment, amb l'objectiu principal de col·laborar en l'ús i l'extensió de Decidim, i especialment en el seu manteniment i sostenibilitat. Signar un Memoràndum d'enteniment donaria al govern el dret a formar part del Comitè d'Institucions Públiques de Decidim. Podeu veure el Memoràndum signat amb el Brasil.
        title: 'Signar un Memoràndum d''enteniment amb l''Associació:'
      step4:
        body: 'Per exemple, l''Ajuntament de Barcelona i la Generalitat de Catalunya fan anualment una transferència de recursos financers a l''Associació per finançar les activitats fonamentals de l''Associació. Com ara: el manteniment del codi font, la publicació de noves versions de Decidim, els esdeveniments de la comunitat o altres activitats fonamentals relacionades amb la missió principal de l''Associació.'
        title: 'Finançar les activitats fonamentals de l''Associació:'
      title: Com poden col·laborar els governs amb nosaltres?
