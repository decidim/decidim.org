    values_intro: <p>From the beginning, Decidim has a social contract that includes the values of the project.</p><p>All members of the Decidim Free Software Association undertake to respect this contract.</p>
    values_title: Our values
    vision:
      subtitle_1: Els membres de l'Associació Decidim comparteixen la visió d'una societat radicalment democràtica en la qual <span class="underline decoration-2">cada persona pren part entre iguals en la vida compartida.</span>
      subtitle_2: L'Associació <span class="underline decoration-2">encarna la seva visió de societat en la seva pròpia governança:</span> és la comunitat qui decideix la direcció del projecte Decidim i qui en fa una tecnologia de tothom, creada per tothom i per a tothom.
      title: Visió
