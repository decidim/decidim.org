    intro: És un programari lliure i de codi obert, mantingut per una comunitat àmplia i activa. Està dissenyat per ajudar governs, organitzacions i comunitats a implicar la gent en processos de presa de decisions transparents i estructurats.
    section2:
      link: Llegiu més casos pràctics
      subtitle: Descobriu com ciutats, governs i organitzacions ja fan servir Decidim de maneres i en escenaris diferents, amb objectius i històries diverses. Consulteu alguns casos d'èxit inspiradors!
      title: Ja fan servir Decidim
    section3:
      link: Llegiu el cas pràctic
      title: Amb el suport de la tecnologia, la democràcia i l'experiència
    section4:
      button1: Sobre nosaltres
      intro: L'Associació de Software Lliure Decidim és una associació democràtica per a la governança de la comunitat Decidim, encarregada de mantenir el codi font.
      subtitle: Metadecidim és la comunitat que col·labora en el disseny de la plataforma i en el desenvolupament del projecte. Junts dissenyem i creem noves funcionalitats i informem dels errors per a la millora contínua de la plataforma.
      title: Qui hi ha darrere de la plataforma?
    section5:
      intro: 'Amb Decidim podeu:'
      link: Exploreu les funcionalitats
      subtitle: Les funcionalitats flexibles de Decidim estan dissenyades per servir tant col·lectius petits com grans, organitzacions públiques i privades, amb centenars o milers de possibles usuaris, com ara ajuntaments, associacions, universitats, ONG o cooperatives.
      title: Decidim és l'eina adequada per a vosaltres?
    section6:
      intro: Per començar a utilitzar Decidim, cal instal·lar l'aplicació en un servidor. Com que Decidim està construït amb Ruby on Rails, la instal·lació requereix un desenvolupador amb experiència en aquest framework.
      intro2: 'Podeu començar de dues maneres:'
      title: Com començar a utilitzar Decidim
    section7:
      intro: Els vostres desenvolupadors poden instal·lar Decidim seguint els passos del lloc de documentació oficial.
      link: Llegiu la guia d'instal·lació
      title: 'La vostra organització té desenvolupadors:'
    section8:
      intro: Necessitareu una empresa tecnològica per instal·lar, configurar i mantenir Decidim. Us recomanem treballar amb un proveïdor local o triar-ne un de la nostra pàgina d'entitats col·laboradores oficials.
      link: Trobeu una entitat col·laboradora
      title: 'La vostra organització no té desenvolupadors:'
    subtitle: Decidim és una plataforma digital per a la <br/>democràcia participativa i<br/> la governança de comunitats
