    history:
      timeline:
        - 
          year: 2011
          above: Tot va començar amb el moviment del 15M i la convergència entre les primeres hacktivistes, l'activisme autonòmic i democràtic a Espanya i l'apogeu del cicle tecnopolític.
        - 
          year: 2016
          below: A Barcelona, a principis de 2016, es va fer servir una bifurcació del Consul, la plataforma participativa de l'Ajuntament de Madrid, per a impulsar el lloc web <a href="https://decidim.barcelona" class="underline decoration-1">decidim.barcelona</a>, el nou espai digital de processos participatius de l'ajuntament.
        - 
          year: 2017
          above: Les diferències tecnopolítiques, tant en la visió com en la pràctica, entre els equips d'innovació democràtica dels ajuntaments van provocar una escissió entre les dues ciutats. Com a resultat, Decidim es va llançar a principis de 2017 com un programari nou, amb una arquitectura més modular i coprogramable.
        - 
          year: 2019
          below: El 2019 es va constituir l'Associació de Software Lliure Decidim i es va signar un acord amb l'Ajuntament de Barcelona pel qual se li cedia el manteniment de la base de codi. Això fa de Decidim un projecte públic-comunitari.
        - 
          year: 2025
          above: Fins ara, més de 450 ciutats i organitzacions de tot el món han adoptat Decidim. L'Associació Decidim ha seguit creixent com a referent internacional en tecnologies democràtiques i programari de codi obert.
      title: La nostra història
    intro: Volem contribuir a la democratització de la societat mitjançant la construcció de tecnologia, metodologies, pràctiques, estàndards, accions, narratives i valors, d'una manera lliure, oberta, col·laborativa i reflexiva.
    mission:
      subtitle: La nostra missió és <span class="underline decoration-2">contribuir a la democratització de la societat</span> mitjançant la construcció de tecnologia, metodologies, pràctiques, estàndards i valors, d'una manera lliure, oberta, col·laborativa i reflexiva.
      title: Missió
    partners:
      cta: També podeu consultar la nostra Memòria d'activitats de 2025
      subtitle: L'Associació treballa en diferents projectes relacionats amb la innovació democràtica, la recerca, la governança dels béns comuns digitals i el desenvolupament de tecnologies lliures i de codi obert. Ho fem en col·laboració amb organitzacions de referència en el seu àmbit.
      title: El nostre treball recent
    recognitions:
      digital_public_good: Digital Public Good
      osor_award: Decidim va ser finalista del premi OSOR en els EU Public Services Open Source Achievement Awards
      pizzigati_prize: Decidim va rebre el premi Pizzigati al programari d'interès públic, promogut per NTEN
      public_good: Decidim ha estat reconegut com a Bé Públic Digital per Digital Public Goods Alliance
      sharing_reuse: Decidim va guanyar els premis Sharing & Reuse en la categoria de projectes de codi obert més innovadors, atorgats per la UE
      subtitle: L'Associació Decidim ha rebut amb orgull una sèrie de reconeixements per la seva contribució al programari lliure, la democràcia i la participació.
      title: Reconeixements
    subtitle: L'Associació de Software Lliure Decidim és una associació democràtica que s'encarrega de la governança de la comunitat Decidim.
    title: L'Associació
    values:
      v1: Compromís i responsabilitat
      v2: Igualtat d'oportunitats i indicadors de qualitat
