  privacy-policy:
    section-1:
      paragraph: "<p>Decidim software libreko elkartea (\"<a href=\"%{decidim_url}\">Decidim</a>\" edo “gu”) webgune honen jabea da, <a href=\"https://decidim.org/\">https://decidim.org/</a> web-domeinuaren bidez eskuragarri dagoena (aurrerantzean, \"Webgunea\"), eta Webguneko erabiltzaile guztien datu pertsonalen tratamenduaren arduradun gisa jarduten du (“Zuk/zure”, “Erabiltzailea”).</p> \n\n<p><a href=\"%{decidim_url}\">Decidim</a> Webguneko erabiltzaileen, bere kide elkartuen eta <a href=\"%{decidim_url}\">Decidim</a> komunitateko kideen pribatutasuna babesteko konpromisoa hartzen du. Pribatutasun-politika honek Webgunearen bidez bildutako datu pertsonalen erabilerari buruzko gure praktikak azaltzen ditu, gure parte-hartze demokratikorako plataforma libre eta kode irekiko demoaren barne, baita <a href=\"%{decidim_url}\">Decidim</a>-ekin lotutako pertsonen datuen tratamendua eta <a href=\"%{decidim_url}\">Decidim</a> komunitatearen kudeaketa ere, Webgune honetan edo <a href=\"%{decidim_url}\">Decidim</a>-ek kudeatutako beste plataforma batzuetan.</p> \n\n<p>Pribatutasun-politika hau gure Lege Testuen parte da, <a href=\"%{legal_notice_url}\">Lege Oharra</a> barne.</p>"
      title: Sarrera
    section-2:
      paragraph: '<h3>a. Webgunean nabigatzean bildutako datuak</h3> <p>Gure webgunea erabiltzean, <a href="%{decidim_url}">Decidim</a>-ek Plausible analisi-softwarearen zerbitzuak erabiltzen ditu. Parte-hartzaileen datuen jarraipena egitean, datu horiek osorik eta modu seguruan zifratuta gordetzen dituen softwarea da. Plausible Analytics-en helburua zure webguneko trafikoaren joera orokorren jarraipena egitea da, eta ez bisitari indibidualena. HTTP eskaera bakoitzak IP helbidea eta parte-hartzailearen agentea bidaltzen ditu zerbitzarira; beraz, horiek erabiltzen dituzte, bisitariaren IP helbidea eta parte-hartzailearen agentea erabiliz egunero aldatzen den identifikatzaile bat sortzeko. Datu horiek anonimizatzeko, hash funtzio batetik pasatzen dira txandakatzen den salt batekin. Horren bidez, letra eta zenbakien ausazko kate bat sortzen da, eguneko bisitari bakarren kopurua kalkulatzeko erabiltzen dena. Datu gordinen IP helbidea eta parte-hartzailearen agentea ez dira inoiz gordetzen Plausible Analytics-en erregistroetan, datu-baseetan edo diskoaren beste edozein lekutan. Salt zaharrak 24 orduz behin ezabatzen dira, egun bateko bisitarien informazioa hurrengo egunekoarekin lotzeko aukera saihesteko. Horrela, gure webgunean nabigatzean ez da parte-hartzaileen datu pertsonalik biltzen; Plausible Analytics-ek egiten duen datu-tratamenduari buruzko informazio gehiago lortzeko, haren webgunea bisita dezakezu: <a href="https://plausible.io/privacy-focused-web-analytics">https://plausible.io/privacy-focused-web-analytics</a></p> <h3>b. Gure Demoan bildutako datuak</h3> <p>Webgunearen bidez <a href="https://try.decidim.org/">https://try.decidim.org/</a> URLan eskuragarri dagoen <a href="%{decidim_url}">Decidim</a> plataformaren demorarako sarbidea anonimoa da, probak egiteko eta <a href="%{decidim_url}">Decidim</a> plataformaren funtzionamendua, ezaugarriak eta gaitasunak ezagutzeko kredentzial generikoen bidez egiten baita. <p>Saio-cookie bat ("Session_id") baino ez da aktibatzen, eta haren helburua uneko saioaren saio-IDa lortzea edo ezartzea da. Cookie hau ezinbestekoa da Webgunean saioa detektatzeko funtzionamendu teknikorako, http protokoloen bidezko konexioa bermatzeko eta Parte-hartzailearen saioa eta Webguneko zerbitzuak erabilgarri mantentzeko; eta Parte-hartzailearen baimenetik salbuetsita dago, Datuak Babesteko Europako Agintaritzak cookieen baimen-eskakizunetik salbuesteari buruz emandako 4/2012 Irizpenaren arabera.</p> <h3>c. Harremanetarako formularioetatik, mezu elektronikoetatik edo bestelako komunikazio-bideetatik bildutako datuak</h3> <p>Pertsonak Gurekin harremanetan jartzen direnean harremanetarako formularioaren, posta elektronikoaren edo antzeko komunikazio-bideen bidez, automatikoki bilduko dugu honako informazio hau: izena, erakundea, helbide elektronikoa eta Parte-hartzailearen mezuaren edukia, zure iruzkin, eskaera, iradokizun eta abarrei erantzuteko.</p> <p>Gainera, datu horiek azterlan estatistikoetarako trata ditzakegu, pseudonimizazio- eta baita anonimizazio-tekniken bidez ere, hala nola datuen agregazioa, ondorengo tratamendu horrek Parte-hartzaileak banaka identifikatzea eragotziz.</p> <h3>d. <a href="%{decidim_url}">Decidim</a> komunitatetik bildutako datuak</h3> <p><a href="%{decidim_url}">Decidim</a>-ek Webgune honi lotutako beste plataforma batzuk erabiltzen ditu gure teknologiaren inguruan sortutako <a href="%{decidim_url}">Decidim</a> komunitatea kudeatzeko, <a href="%{decidim_url}">Decidim</a> komunitatearen topagune gisa eta parte-hartzaileen eta <a href="%{decidim_url}">Decidim</a>-en arteko jarduera eta komunikazio gehienak gertatzen diren leku gisa. Plataforma horiek, hala nola <a href="https://meta.decidim.org/">https://meta.decidim.org/</a> edo GitHub (<a href="https://github.com/decidim/decidim">https://github.com/decidim/decidim</a>), beren erabilera-baldintzen eta pribatutasun-politiken arabera arautzen dira.</p> <p>Hala ere, <a href="%{decidim_url}">Decidim</a>-ek plataforma horietatik bildutako Parte-hartzailearen datu pertsonalak trata ditzake plataforma horietan garatutako komunitate-proiektuak kudeatzeko; bereziki, datu pertsonal horiek plataforma horietarako konexio-datuak, Parte-hartzaileak plataforman duen profila eta Parte-hartzaileak noizean behin <a href="%{decidim_url}">Decidim</a>-en proiektuetan egiten dituen iruzkinen eta oharren edukia izan daitezke. Kontuan izan informazio hori publikoa izan daitekeela eta, ondorioz, beste Parte-hartzaile batzuek eskuratu eta ikusi ahal izango dutela.</p> <h3>e. Gure kide elkartuengandik bildutako datuak</h3> <p><a href="%{decidim_url}">Decidim</a> komunitatean askatasunez parte hartu nahi duen edozein pertsona edo erakundek, eztabaidetan parte hartuz, ekitaldien antolaketan lagunduz, lantalde bat edo komunitate-jardunaldiak sustatuz, baita gure kode irekiko partaidetza-demokraziako plataforma librearen kodeari edo dokumentazioari ekarpenak eginez, instantziak kudeatuz eta abar, <a href="%{decidim_url}">Decidim</a>-eko kide izatea aukera dezake, baldin eta aurreko jardueretako edozein eginez komunitatearekiko konpromiso nahikoa erakutsi badu. Horretarako, eskaera aurkezteko formulario bat bete behar duzu, eta <a href="%{decidim_url}">Decidim</a>-en Koordinazio Batzordeak ebaluatuko du.</p> <p><a href="%{decidim_url}">Decidim</a>-eko kideen datu pertsonalen tratamendua kide elkartuak parte hartzen duen aipatutako proiektuak eta jarduerak kudeatzeko, bazkidetza-kuoten kontabilitate-kudeaketa egiteko eta, oro har, <a href="%{decidim_url}">Decidim</a>-en proiektuen eta jardueren gobernantza kudeatzeko egiten da, <a href="%{decidim_url}">Decidim</a>-en printzipioak eta balioak, baita kideen betebeharrak eta eskubideak ere, betetzen direla bermatzeko.</p>'
      title: Zuri buruzko datu pertsonalak eta nola erabiltzen ditugun
    section-3:
      paragraph: <p>Datu pertsonalak tratatzeko gure lege-oinarriak honako hauek dira:</p> <ul> <li>Parte-hartzaileen eta kide elkartuen datuen tratamendua beharrezkoa da kontratua betetzeko. Kontratu hori Parte-hartzaileek Webgunearen Lege Testua onartzean datza, <a href="%{decidim_url}">Decidim</a>-i eta haren teknologiari, proiektuei eta jarduerei buruzko informazio guztia emateko, baita <a href="%{decidim_url}">Decidim</a>-ek gauzatutako proiektuetan eta jardueretan parte hartzeko aukera emateko ere.</li> <li>Zure datu pertsonalak ere trata ditzakegu berariazko baimena ematen diguzunean parte hartu duzun <a href="%{decidim_url}">Decidim</a>-en proiektuei eta jarduerei buruzko argitalpenak, prentsa-oharrak edo <a href="%{decidim_url}">Decidim</a>-en jarduerak komunikatzeko eta zabaltzeko bestelako edukiak egiteko, baita aldian-aldian informazio jakin bat jasotzeko eta/edo webguneko harremanetarako formularioaren edo posta elektronikoaren bidez gurekin harremanetan jartzen zarenean ere. </li> <li>Gainera, gure interes legitimoan oinarrituta trata ditzakegu zure datuak azterlan estatistikoak edo ezagutza sortzeko bestelako teknikak gauzatzeko, pseudonimizazio-neurriak eta, ahal denean, anonimizazio-neurriak ezarriz, hala nola datuen agregazioa, Parte-hartzaileen pribatutasuna babesteko, DBEOren 89. artikuluarekin bat etorriz.</li> </ul> <p>Egoera jakin batzuetan, zure datuak politika honen arabera trata ditzakegu, bete behar dugun legezko edo arauzko betebehar bat betetzeko.</p>
      title: Oinarri juridikoa
    section-4:
      paragraph: "<p>Zure datu pertsonalak konfidentzialtasunez tratatzen ditugu indarrean dagoen legeriarekin bat eginez. Kontrakoa adierazi ezean, zure datu pertsonalak ez zaizkie hirugarrenei emango.</p> \n\n<p>Zehazki, zure datuak ondorengo kasuetan ezagutarazten ditugu:</p> \n\n<ul> \n<li>Gure informatika-zerbitzuen hornitzaileei sarbidea eman diezaiekegu zure datu pertsonaletara, <a href=\"%{decidim_url}\">Decidim</a>-en aldeko zerbitzu-emate kontratuen baitan. Besteak beste, Netlify, Inc. AEBetako enpresa batek eskaintzen dizkigu webguneen ostatu-zerbitzuak. <a href=\"%{decidim_url}\">Decidim</a>-ek Netlify-rekin <a href=\"https://www.netlify.com/v3/static/pdf/netlify-dpa.pdf\">Datuen Tratamendurako Akordioa</a> sinatu du, Europar Batzordeak onartutako Kontratu Klausula Estandarrak barne hartuz, zure datu pertsonalak beharrezko berme guztiekin tratatzen direla ziurtatzeko. Netlify-k zure datu pertsonalak nola erabiltzen dituen jakiteko, informazio gehiago hemen aurki dezakezu: <a href=\"https://www.netlify.com/gdpr-ccpa\">https://www.netlify.com/gdpr-ccpa</a>.</li> \n\n<li>Administrazio publikoari edo agintariei zure datuak eman ahal dizkiegu iruzurraren, jazarpenaren edo edozein lege, arau edo webguneko politika-urraketaren inguruko susmoak ikertzeko.</li> \n</ul> \n\n<p>Nazioarteko transferentziak egiten dituzten gure zerbitzu-hornitzaileei buruzko informazio gehiago nahi izanez gero, jar zaitez gurekin harremanetan helbide honetan: <a href=\"mailto:privacy@decidim.org\">privacy@decidim.org</a>.</p>"
      title: Datuak zabaltzea
    section-5:
      paragraph: "<p>Zure datu pertsonalak bildu ditugun helburuak betetzeko beharrezkoa den denboran baino ez ditugu gordetzen, baita legezko, kontabilitateko edo informazio-eskakizunak betetzeko ere.</p> \n\n<p>Datu pertsonalak gordetzeko epe egokia zehazteko, honako hauek kontuan hartzen ditugu: datu pertsonalen kantitatea, izaera eta sentikortasuna; zure datu pertsonalen erabilera edo baimenik gabeko zabalkundeak eragin dezakeen kalte-arriskua; zure datu pertsonalak tratatzeko ditugun helburuak; helburu horiek beste bide batzuen bidez lor ditzakegun ala ez; eta aplikagarriak diren lege-eskakizunak.</p>"
      title: Datuak gordetzea
    section-6:
      paragraph: "<p>Legeak eskatzen dituen segurtasun-neurriak eta datu pertsonalak babesteko planak aplikatzen ditugu zure datuen konfidentzialtasuna eta osotasuna mantentzeko eta baimenik gabeko sarbide, aldaketa edo suntsipenen aurkako babesa izateko.</p>"
      title: Segurtasun-neurriak
    section-7:
      paragraph: "<p>Datuak babesteko legeen arabera, zure datu pertsonalei dagokienez hainbat eskubide dituzu. Zehazki, eskubidea duzu: </p> \n\n<ul> \n<li><b>Sarbidea eskatu</b> zure datu pertsonaletara (\"datu-subjektuaren sarbide-eskaera\" izenez ezaguna). Honek aukera ematen dizu zure inguruan ditugun datu pertsonalen kopia bat jasotzeko eta haiek legezko moduan tratatzen ari garela egiaztatzeko.</li> \n\n<li><b>Zuzentzea eskatu</b> gure esku dauden zure datu pertsonalak. Honek aukera ematen dizu osatu gabe edo oker dauden datuak zuzentzeko, nahiz eta zuk ematen diguzun datu berrien zehaztasuna egiaztatu behar izan dezakegun.</li> \n\n<li><b>Ezabatzea eskatu</b> zure datu pertsonalak. Honek aukera ematen dizu zure datuak ezabatzeko edo kentzeko eskatzeko, baldin eta guk haiek tratatzen jarraitzeko arrazoirik ez badago. Halaber, eskubidea duzu zure datu pertsonalak ezabatzeko edo kentzeko, tratamenduari aurka egiteko eskubidea behar bezala erabili baduzu (behean ikus dezakezu), zure informazioa legez kanpo tratatu badugu edo datu horiek tokiko legeekin bat etorriz ezabatu behar baditugu. Hala ere, kontuan izan kasu jakin batzuetan ezingo dugula ezabatzeko eskaera bete arrazoi juridiko jakin batzuengatik, eta eskaera egiten duzunean horren berri emango dizugu, hala badagokio.</li> \n\n<li><b>Tratamenduaren aurka egitea</b> zure datu pertsonalak tratatzen ari garenean interes legitimo batean (edo hirugarren baten interes legitimo batean) oinarritzen ari bagara, eta zure egoera zehatzak oinarri horretan tratamenduaren aurka egiteko arrazoiak ematen badizkizu, zure oinarrizko eskubideak eta askatasunak urratzen dituela iritzita. Halaber, eskubidea duzu zure datu pertsonalak marketin zuzenerako tratatzen ari garenean horren aurka egiteko. Kasu batzuetan, baliteke zure eskubide eta askatasunak gainditzen dituzten arrazoi legitimoak erakustea tratamendua jarraitzeko.</li> \n\n<li><b>Tratamenduaren murrizketa eskatu</b> zure datu pertsonalei dagokienez. Honek aukera ematen dizu zure datu pertsonalen tratamendua eten dadin eskatzeko egoera hauetan: (a) datuen zehaztasuna egiaztatu nahi baduzu; (b) gure datuen erabilera legez kanpokoa bada, baina ez baduzu ezabatu nahi; (c) datuak behar badituzu, nahiz eta guk gehiago behar ez izan, erreklamazio juridikoak aurkezteko, gauzatzeko edo defendatzeko; edo (d) zure datuen erabileraren aurka egin baduzu, baina guk erabilera justifikatzen duten arrazoi legitimoak ditugun egiaztatu behar badugu.</li> \n\n<li><b>Zure datu pertsonalen transferentzia eskatu</b> zuretzat edo hirugarren batentzat (datu eramangarritasunaren eskubidea). Zure datu pertsonalak formatu egituratu, arrunt eta makina bidez irakurgarri batean emango dizkizugu zuri edo zuk aukeratutako hirugarren bati. Kontuan izan eskubide hau soilik automatizatutako informaziorako aplikatzen dela, zuk erabiltzeko baimena eman zenuenean edo kontratu bat betetzeko informazioa erabili genuenean.</li> \n\n<li><b>Baimena edozein unetan kentzea</b> zure datu pertsonalak tratatzeko baimenean oinarritzen ari bagara. Hala ere, horrek ez du eragingo baimena kendu aurretik burututako tratamenduaren legezkotasunean. Baimena kentzen baduzu, baliteke produktu edo zerbitzu jakin batzuk ezin izatea eskaini. Hori gertatzen bada, horren berri emango dizugu zure baimena kentzen duzunean.</li> \n</ul> \n\n<p>Aipatutako eskubideak erabili ahal izango dituzu gurekin harremanetan jarriz helbide honetan: <a href=\"mailto:privacy@decidim.org\">privacy@decidim.org</a>.</p> \n\n<p>Halaber, eskubidea duzu erreklamazio bat aurkezteko dagokion agintaritza eskudunaren aurrean, kasu honetan Espainiako Datuen Babeserako Agentzian (Agencia Española de Protección de Datos), C/. Jorge Juan, 6, 28001 Madril, Espainia.</p>  ."
      title: Zur eskubideak
    section-8:
      paragraph: "<p>Pribatutasun-politika honen baldintzak aldatzeko eskubidea gordetzen dugu, eta aldaketa horien berri emango dizugu posta elektronikoz edo gure Webgunean jakinarazpen argia eskainiz, baita Pribatutasun-politika honetan ere. Gure zerbitzuak erabiltzen jarraitzen badituzu eguneraketa honen ondoren, baldintza berriak onartzen dituzula ulertuko da. Eguneraketa onartzen ez baduzu, mesedez, itxi zure kontua edo jakinarazi iezaguzu, eta zure kontua itxiko dugu eta zure datu pertsonalak ezabatuko ditugu (legez gorde behar diren datuak izan ezik), eta ezin izango duzu gure zerbitzuak erabiltzen jarraitu.</p> \n\n<p>Tokiko araudi espezifiko batek kontrakoa ezartzen ez badu, Pribatutasun-politika hau Espainiako legeek arautzen dute.</p> \n\n<p><b>Azken eguneraketa</b>: 2022ko otsaila.</p>"
      title: Orokorra
    title: Pribatutasun politika
  supporters:
