  faqs:
    cta: Llegeix tots els FAQs
    questions:
      q01:
        answer: 'Decidim és una plataforma digital de participació ciutadana de codi lliure i obert per a ciutats i organitzacions. Però també Decidim és més que una plataforma digital: és un projecte i una infraestructura oberta que inclou codi, documentació, disseny, formació, un marc legal, interfícies col·laboratives, una comunitat d''usuaris i facilitadores i una visió global.'
        question: Què és Decidim?
      q02:
        answer: Actualment s'utilitza a ciutats i organitzacions d'arreu del món. Qualsevol grup de persones el pot fer servir, tant si és una ONG, una universitat, un sindicat, una cooperativa, una associació de veïnes, etc. Consulta la [llista completa d'instàncies actives](/usedby/).
        question: Qui està utilitzant Decidim actualment?
      q03:
        answer: Configurar processos participatius fàcilment. Vols fer un pla estratègic? O discutir noves normatives? O debatre sobre una plaça nova o un edifici públic per aconseguir el be comú? Gràcies a Decidim podràs configurar espais de participació (iniciatives, assemblees, processos o consultes) i enriquir-los a través dels múltiples components disponibles (trobades presencials, enquestes, propostes, votacions, seguiment de resultats, comentaris i molts més).
        question: Què pot fer un administrador de Decidim?
      q04:
        answer: Decidim fa possible que milers de persones s'organitzin democràticament realitzant propostes, assistint a reunions públiques, creant discussions deliberatives, decidint mitjançant diferents formes de votació i monitoritzant la implementació de les decisions. Participants can also communicate between them through the networked communication Decidim functionalities.
        question: Què pot fer un participant (usuari) de Decidim?
      q05:
        answer: Si, tenim una [demo](/ca/demo).
        question: Vull provar Decidim ja, sense instal·lar-m'ho, per veure com funciona. Teniu una Demo?
      q06:
        answer: Cada mes, aproximadament, alliberem una nova versió. En [aquest enllaç](https://github.com/decidim/decidim/releases) pots consultar l'històric de versions.
        question: Amb quina freqüència hi ha actualitzacions de la plataforma?
      q07:
        answer: Instal·lar Decidim és fàcil però necessites alguns coneixements i requeriments tècnics. Pots consultar el [tutorial d’instal·lació manual oficial](https://docs.decidim.org/en/install/).
        question: Què necessito per instal·lar Decidim?
      q08:
        answer: Pots trobar el roadmap de noves funcionalitats del projecte a [GitHub](https://github.com/decidim/decidim/projects/16).
        question: On puc trobar el roadmap del projecte i les funcionalitats planificades?
      q09:
        answer: Decidim és una plataforma de participació ciutadana feta per persones i per a persones. El seu codi font és obert i pot ser inspeccionat, modificat i millorat per qualsevol. El programari Decidim està cobert per la [llicència AGPL](https://ca.wikipedia.org/wiki/GNU_Affero_General_Public_License). Això vol dir que el pots utilitzar, modificar i redistribuir les seves versions derivades, sempre que respectis la llicència AGPL.
        question: Què significa que Decidim sigui gratuït, lliure i de codi obert?
      q10:
        answer: You can collaborate in multiple ways. One of them is through the [Metadecidim](http://meta.decidim.org) community. If you want to propose new features, [go here](https://meta.decidim.org/processes/roadmap). If you have detected errors and want to notify them, [go to this process](https://meta.decidim.org/processes/bug-report). If you want to actively participate in the Metadecidim community, you can attend Community Meetings. Register as a participant of the community and participate with us. If your thing is the code, [come to Github](https://github.com/decidim/decidim). If you are a researcher, you might be interested in coming to the [LAB Metadecidim Seminars](https://meta.decidim.org/assemblies/eix-lab).
        question: Tinc idees de noves funcionalitats, de millora. Vull conèixer millor el projecte. Què puc fer?
      q11:
        answer: La millor manera d'intentar resoldre àgilment els teus dubtes és a través de la comunitat Metadecidim. Entra ara en el procés [“Fòrum de Suport”](https://meta.decidim.org/processes/supportforum?locale=es) i fixa't si el teu dubte existeix o si ha estat resolt i en cas contrari entra per realitzar consultes. Si no aconsegueixes resoldre el teu assumpte en aquest espai, potser és moment de contactar amb nosaltres a través del [formulari de contacte](http://decidim.org/ca/contact).
        question: Tinc molts dubtes, de tot tipus...on els puc plantejar o resoldre?
      q12:
        answer: A l'apartat de [Documentació](https://decidim.org/ca/docs/) pots consultar l'última versió del nostre manual d'administrador.
        question: Existeix algun manual d'ajuda per començar a configurar-ho?
      q13:
        answer: Així és com anomenem al nostre Codi de Garanties Democràtiques i Col·laboració Democràtica. Tots els membres de la comunitat han de adherir-se al [Contracte Social](http://decidim.org/ca/contract).
        question: Què és el Contracte Social?
      q14:
        answer: 'Hi ha moltes diferències: en les funcionalitats, la flexibilitat, l''arquitectura, la modularitat, etc. Hem [publicat un article](/blog/2019-01-14-consul-comparison/) per intentar respondre a les teves preguntes.'
        question: Quines diferències hi ha amb el projecte Consul / Decide Madrid?
      q15:
        answer: "[Metadecidim](http://meta.decidim.org) is the community of Decidim that collaborates in the design of the platform and the construction of the Decidim project. We meet regularly through the Community Meetings, for issues related to the technological aspects of the platform and the Labs witc are [Research](https://meta.decidim.org/assemblies/eix-lab) oriented meetings. Our annual conference is Decidim Fest. Go to [meta.decidim.org](http://meta.decidim.org) to follow the calls closely and if you want to join the community. We'd love to ;-)"
        question: Què és la comunitat Metadecidim?
      q16:
        answer: Of course you can. People do so through participatory processes, debates, translations, etc. that you might find in Metadecidim. Decidim was born in Barcelona and that is why there is a strong territorial bond with this city, but above all, it's a project for the commons.
        question: Puc participar en la comunitat Metadecidim encara que no resideixi a Barcelona?
      q17:
        answer: A qualsevol que tingui bona fe i una actitud correcta cap a la col·laboració democràtica.
        question: A quin tipus de membres accepteu en la comunitat Metadecidim?
      q18:
        answer: L'Associació de Software Lliure Decidim (The Decidim Free Software Association) és una associació democràtica per la governança de la comunitat Decidim. Es va crear el [16 de febrer de 2019 en una assemblea extraordinària de la comunitat](https://meta.decidim.org/processes/decidim-gov/f/959/meetings/1169), amb l'aprovació dels estatuts de l'organització.
        question: Què és l'Associació Decidim?
      q19:
        answer: A l['assemblea general de l'Associació Decidim](https://meta.decidim.org/assemblies/general-assembly-association) podràs conèixer-nos millor, seguir l'activitat de les trobades i consultar informació rellevant (estatuts, convenis, el reglament intern)
        question: Com puc obtenir més informació sobre l'Associació Decidim?
      q20:
        answer: Ara les persones implicades en el projecte poden ser sòcies. [Aquí t'expliquem en detall com ho has de fer.](https://meta.decidim.org/assemblies/QuieroSerSocia?locale=ca)
        question: Com em puc fer sòcia de l'Associació Decidim?
      q21:
        answer: Yes you can! Decidim is a non profit project and for the moment it depends completely on funding. Please find all details to fund the project at [OpenCollective](https://opencollective.com/decidim)
        question: Vull finançar el projecte. Com ho puc fer?
      q22:
        answer: Sí, tenim plantilles per formalitzar acords de col·laboració. [Posa't en contacte amb nosaltres](/ca/contact).
        question: Volem formalitzar un acord de col·laboració. Existeix alguna plantilla que puguem usar?
      q23:
        answer: Sí, però cal tenir paciència. Hi ha un munt d'institucions que volen usar Decidim en aquests moments i els estem ajudant pas a pas. [Posa't en contacte amb nosaltres](/ca/contact) per a qualsevol pregunta i et respondrem al més aviat possible.
        question: Recolzeu a les institucions?
      q24:
        answer: Decidim i el logo de Decidim estan registrats per l'Associació, no es poden utilitzar com a producte comercial o vendre. Si s'utilitza, s'ha de referenciar el projecte. Pots llegir-ne més en la nostra [Política de Marca](/trademark-policy).
        question: Què és la política de marca de Decidim?
      q25:
        answer: There are different ways to collaborate with the Association. We are defining a ladder of collaboration that goes from less to more. The goal is to propose a progressive path of collaboration between public organizations and the Decidim Association. You can check this out here.
        question: How can governments partner with us?
      q26:
        answer: Decidim counts with a partner network that are official service providers for installing, managing and maintaining the platform for organisations of any type.
        question: What do you need to become an official Decidim service provider?
      q27:
        answer: It’s an international collaboration space to strengthen the governance of Decidim made up solely of those public institutions that have a signed collaboration agreement with the Decidim Association. The Institutions Committee is defined in its founding text as ‘the space that allows institutions to participate in governance and to convey needs and improvement proposals to the Decidim team.
        question: What’s the Decidim Association Public Institutions Committee?
      q28:
        answer: To start using Decidim, you must install the application on a server. Because Decidim is built with Ruby on Rails, the installation requires a developer with experience in this framework. [Check the steps to introduce yourself in the Decidim ecosystem.](/first-steps/)
        question: How can I start?
      q29:
        answer: The documentation site helps any individual or organization to understand Decidim. It’s a step by step guide on how to install, configure and develop Decidim on your own. [Check it out.](/documentation)
        question: What 's the Decidim Documentation?
      q30:
        answer: Thanks to its modular architecture and scalable logic, you can configure a powerful system of democratic participation in all kinds of organizations. Choose the features that best suit your needs and customise your participatory process.
        question: Is Decidim customisable?
      q31:
        answer: For contributing to the governance and product roadmap you should be a member of the Decidim Free Software Association. Even if you are an organisation or want to become an individual member [you can do so here checking the requirements.](https://meta.decidim.org/en/assemblies/the-association/f/1758)
        question: How can I contribute to the governance and codebase of the project?
      q32:
        answer: That's fantastic! You can send us an email with all the information at <a href="mailto:hola@decidim.org">hola@decidim.org</a> or get in touch with us via our social media channels
        question: I have deployed a Decidim instance and want to share it with you.
    subtitle_html: If you can’t find your question answered below, contact us at %{email}
