  legal-notice:
    section-1:
      paragraph: '<p>Sie greifen auf die Website der Associació de Software Lliure Decidim ("Decidim", "Uns" oder "Wir") zu, die über die Webdomain <a href="https://decidim.org">https://decidim.org/</a> (nachfolgend die "Website") erreichbar ist, mit Sitz in Carrer Concepción Arenal 165, Nummer 165, Canòdrom - Ateneu d''Innovació Digital i Democràtica, Barcelona, Postleitzahl 08027, Spanien, und der Identifikationsnummer G67401174.</p><p><b>Sie können uns kontaktieren unter: <a href="mailto:hola@decidim.org">hola@decidim.org</a></b></p> '
      title: Wer wir sind
    section-2:
      paragraph: "<p>Zweck dieser Website ist es, der Öffentlichkeit allgemeine Informationen über Decidim, seine Tätigkeiten und seine Technologie bereitzustellen. Dabei handelt es sich um eine freie Open-Source-Plattform für partizipative Demokratie für Städte und Organisationen sowie um die Betreuung und Koordination der weltweiten Decidim-Community, die sich rund um unsere kollaborative Technologie gebildet hat. Diese ermöglicht die Entwicklung von zivilgesellschaftlichen Projekten mit erhöhter gesellschaftlicher Beteiligung. Sie können die Decidim-Plattform frei über unsere Online-Demo testen.</p> <p>Zweck der Nutzungsbedingungen dieses rechtlichen Hinweises ist es, die zulässige Nutzung dieser Website sowie der darauf bereitgestellten Dienste und/oder Inhalte gemäss dem Gesetz 34/2002 über Dienste der Informationsgesellschaft und des elektronischen Geschäftsverkehrs sowie weiteren anwendbaren gesetzlichen Bestimmungen zu regeln.</p>"
      title: Zweck
    section-3:
      paragraph: '<p>Der Zugang zu dieser Website ist kostenlos. Für das allgemeine Durchsuchen der Informationen und/oder Inhalte dieser Website ist keine Registrierung erforderlich. Im Übrigen verweisen wir auf unsere <a href="%{privacy_policy_url}">Datenschutzerklärung</a>.</p> <p>Mit dem Zugriff auf und der Nutzung der Website akzeptieren Sie die Nutzungsbedingungen dieses rechtlichen Hinweises und verpflichten sich zu einer ordnungsgemässen, sorgfältigen und rechtmässigen Nutzung der Website. Insbesondere verpflichten Sie sich: (i) die Website ausschliesslich zu ihrem vorgesehenen Zweck zu nutzen, nämlich zur Information über unsere Dienstleistungen, und davon abzusehen, die Website oder ihre Inhalte für rechtswidrige Zwecke oder für Zwecke zu verwenden, die gegen die öffentliche Ordnung, die Moral oder die guten Sitten verstossen; (ii) die geistigen und gewerblichen Schutzrechte an der Website und ihren Inhalten sowie sämtliche Decidim zustehenden Rechte zu respektieren; (iii) die Website oder deren Inhalte sowie etwaige Abwandlungen davon weder zu vervielfältigen, zu kopieren, zu bearbeiten, zu verändern, zu verbreiten, öffentlich wiederzugeben noch der Öffentlichkeit zugänglich zu machen; (iv) für sämtliche Schäden oder Verluste zu haften, die Decidim infolge einer direkten oder indirekten missbräuchlichen Nutzung der Website durch Sie, eines Verstosses gegen die Bestimmungen der „Rechtlichen Hinweise“ (zusammengefasst dieser rechtliche Hinweis und die <a href="%{privacy_policy_url}">Datenschutzerklärung</a>) sowie gegen die anwendbare Gesetzgebung entstehen.</p>'
      title: Website-Nutzung
    section-4:
      paragraph: "<p>Sämtliche geistigen Eigentumsrechte an den Inhalten dieser Website, einschliesslich, aber nicht beschränkt auf Bilder, Marken, Logos, Kennzeichen, Klänge und Animationen, Texte, Ton-, Bild- oder audiovisuelle Aufzeichnungen sowie Datenbanken, stehen Decidim oder seinen Lizenzgebern zu und sind durch nationale und internationale Gesetze geschützt. Diese Rechte sind zugunsten von Decidim und/oder seinen Lizenzgebern vorbehalten. Jegliche Vervielfältigung, Kopie, öffentliche Wiedergabe, Verbreitung, Veränderung, Umgestaltung, Löschung, Manipulation oder sonstige Nutzung – einschliesslich der Entnahme und Wiederverwendung –, unabhängig davon, ob zu kommerziellen oder nichtkommerziellen Zwecken, direkt oder indirekt, vorübergehend oder dauerhaft, von der gesamten Website oder von Teilen davon bzw. von deren Inhalten, ist ohne vorherige ausdrückliche schriftliche Genehmigung von Decidim ausdrücklich untersagt. Im Falle einer möglichen Verletzung dieser Rechte behält sich Decidim vor, alle rechtlichen und/oder aussergerichtlichen Massnahmen zu ergreifen, die als angemessen erachtet werden.</p>"
      title: Gewerbliche Schutzrechte und geistiges Eigentum
    section-5:
      paragraph: "<p>Decidim übernimmt keine Verantwortung für Webseiten Dritter, auf die über diese Website zugegriffen werden kann, noch für die Richtigkeit, Genauigkeit oder Aktualität von Informationen auf der Website, die nicht von Decidim selbst erstellt wurden. Gemäss Artikel 17 des Gesetzes 34/2002 verpflichtet sich Decidim jedoch, Inhalte oder Links zu entfernen oder deren Zugriff zu sperren, sobald Kenntnis von deren Rechtswidrigkeit erlangt wird. Gegebenenfalls werden auch Inhalte blockiert, die rechtswidrig sind oder die Rechte Dritter verletzen, entsprechend den Artikeln 11 und 16 des genannten Gesetzes.</p> <p>Weiterhin haftet Decidim nicht für Schäden, die durch Fehler oder Fehlkonfigurationen des vom Nutzer auf seinem Endgerät installierten Browsers entstehen. Ebenso übernimmt Decidim keine Verantwortung für Vorfälle oder technische Störungen, die durch die Internetverbindung des Nutzers verursacht werden.</p> <p>Decidim bemüht sich nach besten Kräften, Aktualisierungen sowie Korrekturen von Fehlern und Mängeln – einschliesslich solcher beim Zugriff auf die Website und/oder deren Inhalte – so rasch wie möglich vorzunehmen, übernimmt jedoch keine Gewähr für das Ausbleiben von Unterbrechungen, Verbindungs- oder Zugriffsfehlern oder für die fortlaufende Aktualisierung der Inhalte.</p> <p>Sie tragen die Verantwortung für Ihren Zugriff auf und Ihre Nutzung der Website. Decidim haftet weder für das Vorhandensein von Viren oder Sicherheitslücken noch für Schäden an Ihren Endgeräten oder an darauf gespeicherten Dateien oder Dokumenten, die durch den Zugriff auf oder die Verbindung mit der Website entstehen. Ebenso haftet Decidim nicht für Schäden, die Dritten durch rechtswidrige Eingriffe entstehen, die ausserhalb des Einflussbereichs von Decidim liegen.</p> <p>Decidim haftet nicht für die Verletzung von Verpflichtungen, die Sie mit dem Zugriff auf diese Website gemäss diesem rechtlichen Hinweis eingehen. Insbesondere übernimmt Decidim keine Haftung für Verl