  partnership-policy:
    back_to_partners: Back to partners
    explanation: Sustaining Decidim takes time and resources. Several tasks need to be handled, such as reviewing contributions, triaging issues, fixing bugs, writing documentation, and answering general doubts shared by the community. Any organization (enterprise, association, or collective) willing to become a Decidim Partner is committed to contribute to the Decidim Association with a reduced fee of 3% of the yearly income generated by Decidim activities. In the case of nonprofit organizations, this fee is 1.5%. Every Decidim Partner will be made publicly visible in the <a href="%{main_website_url}">Decidim main website</a> and the <a href="%{readme_url}">GitHub project README page</a>. In addition, the Decidim Association will recommend Decidim Partners in our talks and email conversations about providing services with Decidim. To support recently incorporated organizations, Decidim Partners will be exempted from contributing economically during their first year to first develop their business plan with Decidim. In the meantime, we recommend that Decidim Partners find other ways to contribute to the project (such as with bug reporting, documentation, participation and support in community activities, etc.).
    how_to:
      steps:
        step1: 'Sende eine E-Mail an associacio [at] decidim [dot] org mit deinen Kontaktdaten und gib im Betreff an: Ich möchte Decidim-Partner:in werden.'
        step2: Wir melden uns bei dir für eine Videokonferenz, um deine Bewerbung gemeinsam zu besprechen und zu prüfen.
        step3: Wird die Bewerbung angenommen, sendet dir das Koordinationskomitee einmal pro Jahr eine eidesstattliche Erklärung, die ausgefüllt und zusammen mit dem Beleg der entsprechenden Banküberweisung zurückgesendet werden muss.
      title: Wie kann ich ein Decidim Partner werden?
    requirements:
      l1: 'Verwaltung von Instanzen: Betreibe und verwalte zum Zeitpunkt der Bewerbung eine oder mehrere aktive Decidim-Instanzen – entweder für den eigenen Gebrauch der Organisation oder für Dritte.'
      l2: 'Beiträge zum Projekt: Trage wesentlich zum Decidim-Projekt bei oder hast bereits in bedeutendem Umfang dazu beigetragen.'
      p1: 'Du musst zustimmen, den <a href="%{social_contract_url}">Social Contract</a> einzuhalten und zu unterzeichnen. Zusätzlich müssen Mitglieder mindestens eine der folgenden Bedingungen erfüllen:'
      p2: Weitere Details findest du in der <a href="%{metadecidim_partners_url}">Metadecidim-Versammlung</a>.
      title: Welche Anforderungen muss mein Unternehmen erfüllen, um Partner zu werden?
    subtitle: Wenn deine Organisation Decidim unterstützen möchte, kannst du ein Decidim Partner werden.
    title: Partnerschaftsrichtlinien
