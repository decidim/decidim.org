      group_1:
        title: Recull Contribucions
      group_2:
        title: Debat i delibera
      group_3:
        title: Pren Decisions
      group_4:
        title: Comunicar els resultats a la teva audiència
    intro: Pots utilitzar el programari de Decidim per a una organització pública o privada, amb centenars o milers de participants, com ajuntaments, institucions públiques, associacions, ONGs, universitats, sindicats, cooperatives o comunitats de veïnes. Amb Decidim pots configurar espais digitals de participació i organitzar les contribucions i debats a partir de múltiples components.
    modules:
      button: Començar
      intro: Creix més enllà dels components bàsics.
      subtitle: La comunitat Decidim ha desenvolupat centenars de mòduls per ampliar la plataforma més enllà dels components bàsics i atendre a les teves necessitats encara més.
      title: Mòduls
    need_help:
      button: Col·laboradores
      subtitle: Dona un cop d'ull a la comunitat de partners, les proveïdores oficials de Decidim que et podran ajudar en el procés d'instal·lació, el domini i el manteniment de la plataforma.
      title: Necessites ajuda amb la instal·lació?
    page:
      feature1:
        label: Processos participatius
        subtitle: Per democratitzar reptes comuns, pas a pas
        text: 'Processos permet crear, activar/desactivar i administrar diferents processos de participació, articular-los en diferents fases en què poden combinar-se tots els components. Exemples de processos participatius son: un procés d’elecció dels membres d’un consell, pressupostació participativa, un procés de planificació estratègica, la redacció col·laborativa d’un reglament o norma, el disseny d’un espai urbà o la producció d’un pla de polítiques públiques.'
        title: Processos participatius
      feature10:
        subtitle: Per analitzar, sintetitzar i construir en comunitat
        text: El component textos participatius permet dividir un document de text en diverses propostes o resultats i, inversament, redactar i visualitzar un text unificat partint d’una col·lecció de propostes o resultats.
        title: Textos col·laboratius
      feature11:
        label: Jornadas
        subtitle: On els grans esdeveniments s’estrenen
        text: Crea una web per un esdeveniment. Unifica el programa amb una sèrie d'opcions predefinides (xerrades, tallers...) i gestiona les assistents.
        title: Jornadas
      feature12:
        subtitle: Perquè l'opinió de la teva comunitat importa
        text: Dissenya i publica enquestes. Mostra i descarrega els resultats.
        title: Enquestes
      feature13:
        subtitle: La igualtat i la justícia de l'atzar
        text: El component sorteig permet escollir un número de propostes (per exemple, candidats a un jurat) amb procediments aleatoris, però reproduïbles, que garanteixen distribucions no esbiaixades i uniformes.
        title: Sorteig
      feature14:
        subtitle: Construyendo la inteligencia colectiva
        text: Permet a les usuàries afegir comentaris, valorar-los a favor, en contra o neutral, votar-los, respondre'ls i rebre notificacions sobre les respostes.
        title: Comentaris
      feature15:
        subtitle: La teva comunitat, informada i al dia
        text: El component pàgines serveix per crear pàgines informatives amb text, imatges i vídeos. El component blog permet la creació de missatges o notícies, i navegar cronològicament per elles.
        title: Pàgines i blogs
      feature16:
        subtitle: Informació personalitzada de continguts d’interès
        text: Decidim permet seguir qualsevol espai o component per rebre actualitzacions cada vegada.
        title: Notificacions
      feature17:
        subtitle: Sencill però potent
        text: Envia un correu a tothom que s'hagi registrat a la plataforma o a aquelles persones que participin en un espai concret.
        title: Butlletí
      feature18:
        subtitle: Per promoure la deliberació comunitària
        text: Fes una pregunta sobre qualsevol tema relacionat amb un procés, rep un comentari, participa en una discussió i tanca el debat amb una conclusió.
        title: Debats
      feature19:
        subtitle: Presa de decisions democràtica i transparent
        text: Afegeix la teva proposta de projecte sobre el districte de la teva ciutat, vota i dona suport a aquells que més t'agraden, cocrea idees de forma col·lectiva i aplica una quantitat específica de diners a cada un d'ells. 
        title: Pressupostos participatius
      feature2:
        label: Òrgans<br/>de participació
        subtitle: El poder de l'autoorganització col·lectiva
        text: Les Assemblees ofereixen la possibilitat de definir òrgans o grups de decisió (consells, grups de treball, comitès, etc.) que es reuneixen periòdicament, detallar-ne la composició, llistant i geolocalitzant les seves trobades i permetent la participació (per exemple; acudint-hi si l’aforament i la naturalesa de l’assemblea ho permet, introduint punts en l’ordre del dia o comentant les propostes i decisions preses per l’òrgan esmentat).
        title: Òrgans<br/>de participació
      feature20:
        subtitle: Processos de votació simples i fàcils
        text: Dissenya eleccions per donar suport a la presa de decisions. Puja el cens o activa un sistema de tokens per votar. Les participants emeten els vots a través d'una cabina de votació segura i, un cop tancada la votació, pots publicar-ne els resultats.
        title: Eleccions
      feature3:
        subtitle: Decideix el teu vot
        text: 'El component votacions ofereix a les organitzacions la possibilitat d’activar diferents sistemes de votació o suport sobre les propostes: vot il·limitat, a un determinat sector, ponderat, basat en costos, etcètera.'
        title: Jornadas
      feature4:
        label: Iniciatives
        subtitle: Configurar l’agenda de tothom, a l'abast de qualsevol
        text: Permet crear iniciatives de manera col·laborativa, definir-ne la trajectòria i l’objectiu, recollir suports, discutir, debatre i difondre la iniciativa i definir punts de trobada per a la recollida de signatures presencial o debats oberts a altres membres de l’organització.
        title: Iniciatives
      feature5:
        subtitle: Les teves idees al detall
        text: El component propostes permet a l’usuari crear una proposta utilitzant un assistent de creació comparar-la amb les existents, publicar-la a la plataforma i incloure informació addicional com geolocalització o adjuntar documents i imatges. Aquest component també permet navegar, filtrar i interactuar amb un conjunt de propostes. A més, amb la proposta-incubadora podeu crear propostes col·laboratives.
        title: Propostes
      feature6:
        subtitle: Decideix el teu vot
        text: 'Ofereix a les organitzacions la possibilitat d''activar diferents sistemes de votació o suport sobre les propostes: il·limitades, limitades a un llindar determinat, ponderades, basada en costos, etc. Amb el suport d''una tecnologia de vot electrònic segura i xifrada.'
        title: Votacions
      feature7:
        subtitle: Cap proposta sense resposta
        text: El component resultats serveix per convertir propostes en resultats i donar respostes oficials a la seva acceptació o rebuig, fusionant diverses propostes.
        title: Resultats
      feature8:
        subtitle: Transparència de principi a fi
        text: Mantingueu les participants informades de l'estat de la implementació. Basant-vos en les propostes, definiu els resultats, creeu i apliqueu informes de progrés de la seva implementació i mostreu el grau en què s'han assolit els resultats.
        title: Rendició de comptes
      feature9:
        subtitle: Per trobar-se i no perdre's res
        text: El component trobades ofereix a les organitzacions i als participants la possibilitat de convocar reunions, definir lloc i hora, registrar i limitar el nombre d’assistents, definir l’estructura i els continguts d’una cita o trobada presencial, així com de publicar-ne les actes i les propostes resultants.
        title: Trobades
    section3:
      text: Gràcies a la seva arquitectura modular i a la seva lògica escalable, podeu configurar un sistema potent de participació democràtica a tot tipus d'organitzacions. Trieu les funcionalitats que millor s'adaptin a les vostres necessitats i personalitzeu el vostre procés participatiu.
      title: Un <span class="text-red-500">sistema personalitzable</span> per a <br/>la participació
    section4:
      link: Proveu la nostra demo en línia
      title: Voleu provar-la i veure com funciona en un entorn real?
    subtitle: La plataforma per a organitzacions i comunitats democràtiques de qualsevol mida i tipus.
    title: Funcionalitats
    type1:
      title: Espais de participació
