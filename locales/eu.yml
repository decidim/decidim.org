    how_to_support:
      back_to_supporters: Atzera babesleetara
      intro: Elkartearen ardura nagusia iturburu-kodearen mantentze-lana da, eta, beraz, Decidim erabiltzen duten erakunde guztiek lan honen mendetasuna dute. Kodeak mantentze-lana behar du, beste edozein azpiegitura fisikok bezalaxe. Inor ez balitz zeregin honetaz arduratuko, Decidim-en teknologia zaharkituta geldituko litzateke eta ezingo litzateke erabili. Hori dela eta, Elkartearen lana interes publikokoa da, administrazio eta erakunde publiko askok zuzeneko onura ateratzen baitute bertatik. Hori esanda, Elkartearekin lankidetzan aritzeko hainbat modu daude. Gutxienetik gehiagora doan lankidetza-mailakatze bat definitzen ari gara. Helburua erakunde publikoen eta Decidim Elkartearen arteko lankidetza-bide progresibo bat proposatzea da.
      step1:
        body: Administrazio publikoak komunitateko ekitaldietan parte har dezake, hala nola Decidim Fest-en. Decidim erabiltzen izandako esperientzia azalduz. Lankidetza-urrats hau mailakatzearen lorpen errazena da.
        title: 'Komunitateko ekitaldietan parte hartu:'
      step2:
        body: Administrazio publikoak Decidim-en bide-orrian dagoen eta administrazio publikoarentzat ere lehentasunezkoa den funtzionalitate zehatz baten garapena finantzatu dezake. Gobernuak hobekuntza edo funtzionalitate berri horren garapena ordain dezake, eta ondoren Decidim-en nukleoan integratuko litzateke. Kasu honetan, Elkarteari ere ordaindu beharko litzaioke koordinazioan, produktuaren definizioan eta kodearen berrikuspenean emandako orduengatik.
        title: 'Ibilbide-orriaren ezaugarri bat finantzatzea:'
      step3:
        body: Gobernuak eta Elkarteak Elkar Ulertzeko Memoranduma jar dezakete martxan, helburu nagusia Decidim erabiltzen eta zabaltzen laguntzea izanik, eta bereziki haren mantenuan eta jasangarritasunean. MoU bat sinatzeak eskubidea emango lioke gobernuari Decidim Erakunde Publikoen Batzordeko kide izateko. Brasilekin sinatutako MoUa ikus dezakezu.
        title: 'Sinatu Lankidetza Memorandoa (MoU) Elkartearekin:'
      step4:
        body: 'Adibide gisa, Bartzelonako Udalak eta Kataluniako Gobernuak urtero finantza-baliabideen transferentzia bat egiten diote Elkarteari, Elkartearen oinarrizko jarduerak finantzatzeko. Hala nola: Iturburu-kodearen mantentze-lanak, Decidim-en bertsio berrien merkaturatzea, komunitate-ekitaldiak edo Elkartearen eginkizun nagusiarekin lotutako beste funtsezko jarduera batzuk.'
        title: 'Finantzaketa Elkartearen oinarrizko jarduerak:'
