server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (from netlify-headers)
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Redirects (from netlify-redirects)
  # /docs/features-and-roadmap -> docs.decidim.org
  rewrite ^/docs/features-and-roadmap$ https://docs.decidim.org/features/en/general-description/ permanent;
  rewrite ^/ca/docs/features-and-roadmap$ https://docs.decidim.org/features/en/general-description/ permanent;
  rewrite ^/es/docs/features-and-roadmap$ https://docs.decidim.org/features/en/general-description/ permanent;

  # /contract -> docs.decidim.org social contract
  rewrite ^/contract$ https://docs.decidim.org/en/understand/social-contract/ permanent;
  rewrite ^/ca/contract$ https://docs.decidim.org/en/understand/social-contract-ca/ permanent;
  rewrite ^/cs/contract$ https://docs.decidim.org/en/understand/social-contract/ permanent;
  rewrite ^/de/contract$ https://docs.decidim.org/en/understand/social-contract/ permanent;
  rewrite ^/es/contract$ https://docs.decidim.org/en/understand/social-contract-es/ permanent;
  rewrite ^/fi/contract$ https://docs.decidim.org/en/understand/social-contract/ permanent;
  rewrite ^/fr/contract$ https://docs.decidim.org/en/understand/social-contract/ permanent;
  rewrite ^/ja/contract$ https://docs.decidim.org/en/understand/social-contract/ permanent;
  rewrite ^/ro/contract$ https://docs.decidim.org/en/understand/social-contract/ permanent;

  # /docs -> docs.decidim.org
  rewrite ^/docs$ https://docs.decidim.org/ permanent;

  # /pdf/association/statutes-en.pdf -> Google Docs
  rewrite ^/pdf/association/statutes-en\.pdf$ https://docs.google.com/document/d/1gdkFD4n2s7TQSo7dwDlawTMfdS7ac3F8BI68bHIVxhM/edit?usp=sharing permanent;

  # /pdf/association/statutes-es.pdf -> statutes-ca.pdf
  rewrite ^/pdf/association/statutes-es\.pdf$ /pdf/association/statutes-ca.pdf permanent;

  # /pdf/Decidim_AdminManual_* -> docs.decidim.org admin
  rewrite ^/pdf/Decidim_AdminManual_(CA|EN|ES)_0\.10\.pdf$ https://docs.decidim.org/en/admin/ permanent;

  # /demo -> try.decidim.org
  rewrite ^/demo$ https://try.decidim.org permanent;

  # /who-uses -> /installations
  rewrite ^/who-uses$ /installations permanent;

  # Legacy locale-prefixed collections -> current permalinks
  rewrite ^/blog/en/(.+?)/?$ /blog/$1 permanent;
  rewrite ^/case-studies/en/(.+?)/?$ /case-studies/$1 permanent;

  # Trailing slashes: canonical URLs are extensionless without a slash.
  rewrite ^(.+)/$ $1 permanent;

  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  location = /404/index.html {
    internal;
  }

  error_page 404 /404/index.html;

  location ~* \.(css|js|svg|png|jpe?g|gif|ico|woff2?|ttf|eot|webp|pdf)$ {
    expires 7d;
    add_header Cache-Control "public";
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
