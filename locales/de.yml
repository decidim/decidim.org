      title: 'Deine Organisation hat eigene Entwickler:innen:'
    section8:
      intro: Du brauchst ein Technologieunternehmen, um Decidim zu installieren, zu konfigurieren und zu warten. Wir empfehlen, mit einem lokalen Anbieter zusammenzuarbeiten oder einen von unserer offiziellen Partnerseite auszuwählen.
      link: Partner finden
      title: 'Deine Organisation hat keine eigenen Entwickler:innen:'
