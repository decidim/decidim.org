  team:
    banner:
      link: Tutustu yhteisöön
      subtitle: Täällä voit tavata institutionaalisia tukijoita ja kumppaneita, jotka ovat osa Decidim-maailmaa.
      title: Decidim-yhteisö on vielä suurempi
    coordination_committee:
      intro: Koordinointikomitea on Decidim-yhdistyksen hallinnollinen ja edustuksellinen elin. Se toimii toimeenpanoelimenä, joka varmistaa yhdistyksen sujuvan toiminnan ja valvoo yhdistyksen demokraattisen ja osallistavan mission toteutumista.
      title: Koordinointikomitea
    intro: Tekninen toimisto ja koordinointikomitea ovat keskeisiä toimijoita, jotka hallinnoivat ja edustavat yhdistystä.
    members:
      alejandra_gonzalez:
        bio: Alejandra is a philosopher-developer. She has spent 9 years implementing civic technology projects with Mexican governments and organising citizen civic hacking communities. In 2019 she was director of Open Government in the Mexico City government where she first implemented Decidim, and has been part of the community ever since. She is currently director of strategy at Codeando México and part of the coordination committee at Decidim.
        role: Äänivaltainen
      andres_lucena:
        bio: Andrés is a software developer and systems administrator specialising in open-source software and technologies for citizen participation. Over the past decade, he has worked on implementing participatory digital infrastructures with local and regional governments and political organisations in Spain.
        role: Teknologiajohtaja
      antonio_calleja_lopez:
        bio: Antonio is a PhD in Sociology from the University of Exeter, a DEA in Philosophy from the University of Seville and has a Master's Degree in Political Science from Arizona State University. He is the coordinator of Tecnopolítica.net at the UOC's IN3 and co-founder of Heuristica.barcelona. He studies the multiple connections between technology, politics and society, from the platformisation of social movements, the public sphere, political parties and the state to the socio-technical construction and governance of data and digital infrastructures.
        role: Äänivaltainen
      ben_gansky:
        bio: Ben is an artist, researcher, and civic engagement designer based in Minneapolis. He collides technological artifacts + processes, stories, and humor in intermedia performances. His research deals with how people and organizations come to recognize and negotiate the politics of the digital tools they use. His civic engagement projects combine these interests to create experiences and programs for enlivening the intersection of digital politics and participatory democracy.
        role: Äänivaltainen
      carla_rocha:
        bio: Carla is a professor and researcher in Computer Science, specializing in Software Engineering. She is currently a member of the Department of Software Engineering at the University of Brasília (UnB). She boasts prolific research in software engineering, ranging from free software and agile methodologies to project-based teaching strategies. She coordinates the Brasil Participativo collaboration project with the Brazilian Federal Government.
        role: Äänivaltainen
      carolina_romero:
        bio: Carol is a technologist with over 20 years of experience in digital innovation, open government, and citizen participation. Cofounder of Decidim, she is currently the project’s Product Director.
        role: Tuoteomistaja
      david_igon:
        bio: David is a free software developer at PokeCode. He has been a member of the Decidim community since he began working there. He has always been involved in participation, co-operativism and free software.
        role: Rahastonhoitaja
      elsa_boloix:
        bio: Elsa on vastuussa viestinnästä ja Decidim-yhteisön koordinoinnista. Hän keskittyy viestintäkampanjoiden suunnitteluun ja toteuttamiseen, kiinnostavan sisällön luomiseen, yhteisön kanssa toimimiseen ja Decidim-ekosysteemin laajentamiseen, käyttötapauksiin ja Metadecidimiin. Hän sisäisen ja ulkoisen viestinnän sekä luovan monikanavaisen työn kokemuksensa myös Decidim Fest -konferenssin koordinointiin ja tuotantoon.
        role: Viestintä ja yhteisö
      julieta_pasetti:
        bio: Julieta is a visual communication and UX/UI designer, responsible for proposing designs, contributing creativity, and transforming ideas into dynamic and participatory interfaces, combining aesthetics and usability so that each interaction improves citizen participation.
        role: Käyttökokemus- ja käyttöliittymäsuunnittelija (UI/UX)
      maite_orellana:
        bio: Maite vastaa yhdistyksen hallinnosta, rahoituksesta, henkilöstöstä, projektinjohtamisesta ja hankerahoituksista työskennellen tiiviisti toimeenpanevan johdon kanssa. Hänellä on kokemusta markkinoinnista, taloushallinnosta, sisäisestä valvonnasta ja henkilöstöhallinnosta sekä voittoa tavoittelemattomissa että voittoa tavoittelemattomissa organisaatioissa.
        role: Hallinto ja henkilöstöhallinto
      marta_anducas:
        bio: Marta opiskeli tietotekniikkaa Barcelonan julkisessa yliopistossa (UPF), Andien ja Amazonian yhteisöjä Perussa, luovuutta itseopiskelun kautta ja feminismiä psykologisen väkivallalla sortamisen tutkimisen kautta. Vuonna 2019, hän löysi Platoniqin, organisaation, jossa luovuus kohtaa demokratian.
        role: Puheenjohtaja
      nil_homedes_busquets:
        bio: Nil is a political scientist specializing in public policy, democratic participation, and technological sovereignty. He is currently the Director of the Technical Office at the Decidim Association and a member of Decidim's Product Team.
        role: Toiminnanjohtaja
      pauline_bessoles:
        bio: Pauline is an active member of the Decidim Association, where she contributes to the democratic governance of the project and the sustainability of the platform as a digital common. With a background in deploying Decidim in public institutions, she brings both hands-on experience and a strong commitment to participatory democracy. She currently works at XWiki SAS, a long-standing free software company, editor of XWiki and Cryptpad, where she continues to support open and collaborative digital infrastructures.
        role: Äänivaltainen
      tom_greenwood:
        bio: Tom is a software developer originating from London, he works within the technical office. With a background in commercials in the artificial intelligence space, he switched careers in 2022 opting to better understand how to build software. After graduating from a Ruby on Rails focused Web Development program at Le Wagon, he’s now involved in maintaining the Decidim application codebase and organising monthly global Developers community meet ups.
        role: Nuorempi kehittäjä
      txema_laullon:
        bio: Txema on Decidim-yhdistyksen koordinaatiokomitean jäsen.
        role: Sihteeri
      xabier_barandiaran:
        bio: Xabier is a philosopher, engaged in the intersection of social practices, biological and cognitive sciences and technopolitics. He is developing an interdisciplinary approach bringing together insights from philosophy of mind, artificial life, neuroscience and social science, while actively involved in hacktivism, the reproduction of the knowledge commons and participatory democracy.
        role: Äänivaltainen
    subtitle: Olemme joukko ihmisiä, jotka uskovat, että ihmisten avoimesti rakentama teknologia voi muuttaa yhteiskuntien osallistamista ja yhteisöllistä päätöksentekoa.
    technical_office:
      intro: Ammattilaisten tiimi, joka työskentelee Decidim-yhdistyksessä ja on vastuussa hankkeen päivittäisistä tehtävistä.
      title: Tekninen toimisto
    title: Tiimi
  testimonials:
    n1:
      org: Barcelonan kaupungintalo (2015-2019)
      quote: '"Decidimin ansiosta olemme luoneet yhdessä kaupunkilaisten kanssa strategisen kaupunkisuunnitelman. Vuonna 2016 otimme käyttöön kunnallisen toimintasuunnitelman osallistumisprosessin avulla Decidim Barcelona -alustalla. Tällä hetkellä kyseinen suunnitelma pitää sisällään muun muassa noin 7 000 ehdotusta kaupunkilaisilta. Yksi alustan tuomia hyötyjä on ehdotusten käsittelyn ja hyväksyttyjen ehdotusten toimeenpanon läpinäkyvä seuranta alustalla."'
    n2:
      org: Som Energia
      quote: '"Som Energia (uusiutuvan energian käyttöä ajava osuuskunta) on luonut Decidimin avulla yhteisöllisen ja ystävällisen tavan osallistumiselle. Julkaisimme alustan vuonna 2018, jolloin alustan avulla pidettiin osuuskunnan yleiskokous ja kuukausia myöhemmin debatoimme osuuskunnan ylläpitämän koulun visuaalisesta uudelleensuunnittelusta ja yhteisöllisestä kehittämisestä muiden osallistumisprosessien lisäksi. Muutaman kuukauden aikana alustalle oli rekisteröitynyt yli 3 500 osallistujaa ja siellä oli viisi osallistumistilaa, kolme ryhmää ja sen kautta saatiin yli 1 300 ääntä yleiskokouksen äänestyksessä."'
    n3:
      org: Meksikon Mérida Yucatán kaupunginhallituksen puheenjohtaja.
      quote: '"Decide Mérida -alusta avasi ennennäkemättömän mahdollisuuden kansalaisosallistumiselle kunnallisen kehityssuunnitelman laatimiselle Méridassa 2018-2020. Alustalla oli yli 3 000 vuorovaikutusta, joiden avulla keräsimme ehdotuksia, kommentteja, esityksiä ja tukea saavuttaaksemme suurimman mahdollisen yhteisymmärryksen siitä, mikä on parasta kaupungillemme. Epäilemättä Decide Mérida -alusta tulee jatkossakin olemaan tärkeässä roolissa Méridan kehittämisessä yhä osallistuvamman yhteisön suuntaan."'
    n4:
      org: Helsingin kaupunki
      quote: '"Arvostamme erityisesti alustan demokraattisuutta ja demokraattisen ajattelun roolia sen kehityksessä. Demokraattiset periaatteet, kuten vastuullisuus, tasa-arvo ja läpinäkyvyys, ovat järjestelmän suunnittelun ytimessä."'
    n5:
      org: Méxicon kaupungin avoin hallinto
      quote: '"Olemme ratkaisseet lähes kaikki toteuttamamme osallistumisprosessit Decidimin toiminnallisuuden avulla. Työkaluna se on erittäin vahva, mutta sen vahvimmat ja meille tärkeimmät osa-alueet tuntuvat olevan sen ympärille kehittyvä yhteisö, niin alustan kehittäjien kuin sen käyttäjien osalta. Olemalla osana tätä yhteisöä, olemme oppineet arvostamaan yhteisöä ja sen kykyä ratkaista niitä haasteita, jotka liittyvät osallistuvan demokratian toteuttamiseen oikeassa maailmassa."'
    n6:
      org: Mozilla Foundation
      quote: '"Kärsimme julkisen tilan puutteesta. On erityisen tärkeää, että saamme takaisin nämä julkiset tilat ihmisille. Avoimet alustat, kuten Decidim, mahdollistavat juuri tämän. Avoimen lähdekoodin ansiosta kuka tahansa voi käyttää alustaa hyödykseen, muokata sitä ja rakentaa sillä prosesseja. Tämän lisäksi hanke edustaa niitä arvoja, joita haluamme yhteiskuntamme edustavan ja joita varten yhteiskuntamme on rakennettu."'
    n7:
      org: OpenForum Europe tutkimusjohtaja, Euroopan unioni
      quote: '"Prosessi alkoi lokakuussa 2019 Euroopan komission viestintä- ja eDemokratia-yksikössä yhteisessä tutkimuskeskuksessa, Euroopan komission tiede- ja osaamispalvelussa. Konferenssin tarpeiden analysointi ja erilaisten työkalujen vertaaminen johtivat avoimen lähdekoodin Decidim-työkalun valitsemiseen sen teknisen kypsyyden, laajan yhteisön ja soveltamiskyvyn takia."'
    n8:
      org: Pipeline to Power, New Yorkin kaupungin osallistava valtuusto
      quote: '"Yksi Decidimin tehokkuuden peruspilareista on sen kyky erottaa prosessien vaiheet ja niihin liittyvät toimenpiteet. Tämä on osa järjestelmän informaatioarkkitehtuuria, joka mahdollistaa tiedon jakamisen lisäksi prosessien vaiheiden erilaiset toiminnot. Tämä mahdollistaa työkalun muovautuvan prosessien mukaiseksi, jotta työn ei tarvitse mukautua työkalujen mukaiseksi."'
    title: Suositukset
  thanks:
    message: Kiitos yhteydenotostasi. Palaamme asiaan pian.
    title: Kiitos yhteydenotostasi
  trademark:
    examples-1:
      l1: Decidim-logon käyttäminen tuotesivuilla mainitaksesi "työskentelemme Decidimin kanssa" (esim. ylläpito, konsultointipalvelut ja Decidimiin pohjautuvat kehitystyöt).
      l2: '"Decidim" -tavaramerkin käyttö kirjojen kansissa tai tutkimusjulkaisuissa.'
      l3: Decidim-logon käyttäminen alustan alatunnisteessa ("Voimanlähteenä Decidim").
      title: Esimerkkejä käyttötarkoituksista, jotka eivät tarvitse lupaa
    examples-2:
      l1: Tuotteiden myynti (tarrat, t-paidat, mukit, jne.).
      l2: Kirjan kannessa olevan Decidim-logon käyttö.
      l3: Decidim-logon käyttö verkkosivustolla esittääksesi olevasi Decidim-organisaatio.
      title: Esimerkkejä käyttötarkoituksista, jotka tarvitsevat luvan
    examples-3:
      l1: Yrityksen tai tuotteen nimeäminen Decidimin mukaan, kuten "Decidim-konsultit".
      title: Esimerkkejä käyttötarkoituksista, joille ei myönnetä lupaa
    goals:
      l1: Haluamme tehdä Decidim-nimen tai -logon käytön helpoksi sellaisille käyttötarkoituksille, joiden tavoitteena on auttaa levittämään alustaa tai parantaa sitä.
      l2: Haluamme selventää, kuinka Decidimiin liittyvät yritykset ja hankkeet voivat (tai eivät voi) käyttää Decidimin nimeä ja logoa.
      l3: Haluamme vaikeuttaa Decidim-nimen ja -logon käyttöä epäoikeudenmukaisen voiton tavoitteluun sekä ihmisten harhauttamiseen tai hämmentämiseen, mikäli he etsivät virallista tietoa Decidimistä.
    p1: '"Decidim" ja Decidim-logo ovat Decidim-yhdistyksen ("Associació de Software Lliure Decidim") virallisia tavaramerkkejä. Et voi käyttää näitä tavaramerkkejä ilman lupaa kaupalliseen tarkoitukseen osoittaaksesi, että Decidim tukee tai on liitoksissa tarjoamiisi tuotteisiin tai palveluihin. Voit käyttää näitä tavaramerkkejä tavalla, jossa selkeästi osoitat viittaavasi Decidim-hankkeeseen, mutta virallisen tuen tai liitoksen väittäminen on kiellettyä.'
    p2: 'Jos käytät Decidim-logoa missään tarkoituksessa, sinun tulee lisätä seuraava teksti materiaalin yhteyteen: <i>"Decidim-nimi ja -logo ovat Decidim-yhdistyksen (''Associació de Software Lliure Decidim'') virallisia tavaramerkkejä."</i>'
    p3: 'Tämä tavaramerkkikäytäntö on laadittu seuraavien tavoitteiden mukaisesti:'
    p4: Voit pyytää lupaa lähettämällä sähköpostia osoitteeseen associacio@decidim.org.
    p5: Tämä tavaramerkkikäytäntö perustuu <a href="%{rails_url}">Ruby on Rails</a> ja <a href="%{wordpress_url}">Wordpress-säätiön</a> vastaaviin käytäntöihin.
    title: Tavaramerkkiehdot
