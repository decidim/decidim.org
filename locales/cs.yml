      subtitle: Můžeme vám pomoci s každým krokem používání produktu Decidim, od participativního designu až po naučení instalovat Decidim. Máte nápad na spolupráci? Rádi bychom se o tom dozvěděli.
      title: Potřebujete pomoc?
    history:
      timeline:
        - 
          year: 2011
          above: All started with the 15M movement and the convergence of earlier hacktivists, autonomous and democratic activism in Spain and the rise of the technopolitical cycle.
        - 
          year: 2016
          below: In Barcelona, in early 2016, a fork of Consul, the participatory platform of the Madrid City Council, was used to power up the site <a href="https://decidim.barcelona" class="underline decoration-1">decidim.barcelona</a>, the new digital venue for participatory processes in the city council.
        - 
          year: 2017
          above: Technopolitical differences in vision and practice between the city council democratic innovation teams brought about a split between the two cities; as a result, Decidim was launched in early 2017 as a brand-new software with a more modular and co-developable architecture.
        - 
          year: 2019
          below: In 2019 the Decidim Free Software Association was constituted and an agreement with the Barcelona City Council was signed, ceding to the Association the maintenance of the code base. This makes Decidim a public-common project.
        - 
          year: 2025
          above: Until now, over 450 cities and organisations globally have embraced Decidim. And the Decidim Association has been growing as an international leader in democratic technologies and open source software.
      title: Naše historie stručně
    intro: Chceme přispět k demokratizaci společnosti prostřednictvím budování technologií, metodik, praktik, standardů, činností, interpretací a hodnot svobodně, otevřeným, spolupracujícím a přemýšlivým způsobem.
    mission:
      subtitle: Our mission is to <span class="underline decoration-2">contribute to the democratization of society</span> through the construction of technology, methodologies, practices, standards, and values, in a free, open, collaborative and reflective way.
