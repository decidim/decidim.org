      intro: Tarvitset teknologiayrityksen asentaaksesi, konfiguroidaksesi ja ylläpitääksesi Decidimin. Suosittelemme työskentelemään paikallisen palveluntarjoajan kanssa tai valitsemaan sen virallisilta yhteistyökumppaneiltamme.
      link: Löydä kumppani
      title: 'Organisaatiolla ei ole kehittäjiä:'
