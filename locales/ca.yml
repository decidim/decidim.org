    coordination_committee:
      intro: El Comitè de Coordinació és l'òrgan de govern i de representació de l'Associació Decidim. A la pràctica, funciona com l'òrgan executiu que garanteix que l'associació funcioni sense entrebancs i es mantingui alineada amb la seva missió democràtica i participativa.
      title: Comitè de Coordinació
    intro: L'Oficina Tècnica i el Comitè de Coordinació són els agents clau que gestionen i representen l'Associació.
    members:
      alejandra_gonzalez:
        bio: L'Alejandra és filòsofa i desenvolupadora. Ha passat 9 anys implementant projectes de tecnologia cívica amb governs mexicans i organitzant comunitats ciutadanes de civic hacking. El 2019 va ser directora de Govern Obert al govern de la Ciutat de Mèxic, on va implementar Decidim per primera vegada, i des d'aleshores forma part de la comunitat. Actualment és directora d'estratègia a Codeando México i membre del Comitè de Coordinació de Decidim.
        role: Vocal
      andres_lucena:
        bio: L'Andrés és desenvolupador de programari i administrador de sistemes especialitzat en programari de codi obert i tecnologies per a la participació ciutadana. Durant l'última dècada, ha treballat en la implementació d'infraestructures digitals participatives amb governs locals i regionals i organitzacions polítiques a Espanya.
        role: Director Tecnològic
      antonio_calleja_lopez:
        bio: L'Antonio és doctor en Sociologia per la Universitat d'Exeter, té un DEA en Filosofia per la Universitat de Sevilla i un màster en Ciència Política per la Universitat Estatal d'Arizona. És el coordinador de Tecnopolítica.net a l'IN3 de la UOC i cofundador de Heuristica.barcelona. Estudia les múltiples connexions entre tecnologia, política i societat, des de la plataformització dels moviments socials, l'esfera pública, els partits polítics i l'Estat, fins a la construcció sociotècnica i la governança de les dades i les infraestructures digitals.
        role: Vocal
      ben_gansky:
        bio: En Ben és artista, investigador i dissenyador de participació ciutadana, establert a Minneapolis. Fa col·lidir artefactes tecnològics + processos, històries i humor en actuacions intermedia. La seva recerca aborda com les persones i les organitzacions arriben a reconèixer i negociar la política de les eines digitals que fan servir. Els seus projectes de participació ciutadana combinen aquests interessos per crear experiències i programes que donen vida a la intersecció entre la política digital i la democràcia participativa.
        role: Vocal
      carla_rocha:
        bio: La Carla és professora i investigadora en Informàtica, especialitzada en Enginyeria del Programari. Actualment és membre del Departament d'Enginyeria del Programari de la Universitat de Brasília (UnB). Compta amb una recerca prolífica en enginyeria del programari, que va des del programari lliure i les metodologies àgils fins a les estratègies docents basades en projectes. Coordina el projecte de col·laboració Brasil Participativo amb el Govern Federal del Brasil.
        role: Vocal
      carolina_romero:
        bio: La Carol és tecnòloga amb més de 20 anys d'experiència en innovació digital, govern obert i participació ciutadana. Cofundadora de Decidim, actualment és la directora de Producte del projecte.
        role: Co-Director
      david_igon:
        bio: En David és desenvolupador de programari lliure a PokeCode. És membre de la comunitat de Decidim des que va començar a treballar-hi. Sempre ha estat implicat en la participació, el cooperativisme i el programari lliure.
        role: Tresorer
      elsa_boloix:
        bio: L'Elsa és l'encarregada de coordinar la comunicació i la comunitat de Decidim. Se centra a dissenyar i implementar campanyes de comunicació, crear continguts atractius, connectar la comunitat i difondre-ho tot sobre l'ecosistema Decidim, els casos d'ús i Metadecidim. Amb experiència en comunicació interna i externa i en el treball creatiu transmedia, també coordina la producció i l'organització del Decidim Fest.
        role: Comunicació i Comunitat
      julieta_pasetti:
        bio: La Julieta és dissenyadora de comunicació visual i UX/UI, encarregada de proposar dissenys, aportar creativitat i transformar idees en interfícies dinàmiques i participatives, combinant estètica i usabilitat perquè cada interacció millori la participació ciutadana.
        role: Dissenyadora UX/UI
      maite_orellana:
        bio: La Maite és responsable de les tasques relacionades amb l'administració, les finances, els recursos humans i la gestió de projectes i subvencions, en estreta col·laboració amb la Direcció Executiva. Té experiència prèvia en màrqueting, gestió i control financers i recursos humans, tant en organitzacions amb ànim de lucre com sense.
        role: Administració i Recursos Humans
      marta_anducas:
        bio: La Marta va aprendre enginyeria informàtica a la UPF de Barcelona, participació a les comunitats andines i amazòniques del Perú, creativitat en la cerca pròpia i feminisme en l'opressió de l'abús psicològic. El 2019, els seus camins van confluir a Platoniq, una organització on la Creativitat i la Democràcia coincideixen.
        role: Presidenta
      nil_homedes_busquets:
        bio: Nil is a political scientist specializing in public policy, democratic participation, and technological sovereignty. He is currently Co-director of the Technical Office at the Decidim Association and a member of Decidim's Product Team.
        role: Co-Director
      pauline_bessoles:
        bio: La Pauline és membre activa de l'Associació Decidim, on contribueix a la governança democràtica del projecte i a la sostenibilitat de la plataforma com a bé comú digital. Amb una trajectòria en el desplegament de Decidim a institucions públiques, aporta tant experiència pràctica com un fort compromís amb la democràcia participativa. Actualment treballa a XWiki SAS, una empresa de programari lliure de llarga trajectòria, editora de XWiki i Cryptpad, on continua donant suport a infraestructures digitals obertes i col·laboratives.
        role: Vocal
      tom_greenwood:
        bio: En Tom és desenvolupador de programari, originari de Londres, i treballa a l'Oficina Tècnica. Amb una trajectòria en l'àmbit comercial dins del sector de la intel·ligència artificial, el 2022 va canviar de professió per entendre millor com es construeix el programari. Després de graduar-se en un programa de Desenvolupament Web centrat en Ruby on Rails a Le Wagon, ara participa en el manteniment de la base de codi de l'aplicació Decidim i en l'organització de trobades mensuals globals de la comunitat de desenvolupadors.
        role: Desenvolupador Junior
      txema_laullon:
        bio: En Txema és membre del Comitè de Coordinació de l'Associació Decidim.
        role: Secretari
      xabier_barandiaran:
        bio: En Xabier és filòsof, implicat en la intersecció entre les pràctiques socials, les ciències biològiques i cognitives i la tecnopolítica. Està desenvolupant un enfocament interdisciplinari que combina perspectives de la filosofia de la ment, la vida artificial, la neurociència i les ciències socials, alhora que participa activament en l'hacktivisme, la reproducció dels béns comuns de coneixement i la democràcia participativa.
        role: Vocal
