    intro: Decidim softwarea erakunde publiko edo pribatu batean erabil dezakezu, ehunka edo milaka parte-hartzaile potentzialekin, hala nola udal batean, erakunde publiko batean, elkarteetan, GKEetan, unibertsitateetan, sindikatuetan, kooperatibetan edo auzo-komunitateetan. Decidim-ekin, parte-hartze digitalerako guneak konfiguratu eta ekarpenak eta eztabaidak antolatu ahal izango dituzu eskuragarri dauden osagai anitzen bidez.
