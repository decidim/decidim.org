  partnership-policy:
    back_to_partners: Zpět k partnerům
    explanation: Sustaining Decidim takes time and resources. Several tasks need to be handled, such as reviewing contributions, triaging issues, fixing bugs, writing documentation, and answering general doubts shared by the community. Any organization (enterprise, association, or collective) willing to become a Decidim Partner is committed to contribute to the Decidim Association with a reduced fee of 3% of the yearly income generated by Decidim activities. In the case of nonprofit organizations, this fee is 1.5%. Every Decidim Partner will be made publicly visible in the <a href="%{main_website_url}">Decidim main website</a> and the <a href="%{readme_url}">GitHub project README page</a>. In addition, the Decidim Association will recommend Decidim Partners in our talks and email conversations about providing services with Decidim. To support recently incorporated organizations, Decidim Partners will be exempted from contributing economically during their first year to first develop their business plan with Decidim. In the meantime, we recommend that Decidim Partners find other ways to contribute to the project (such as with bug reporting, documentation, participation and support in community activities, etc.).
    how_to:
      steps:
        step1: Pošlete e-mail asociacio [at] decidim [dot] org s vašimi kontaktními údaji a označte v předmětu chci se stát partnerem Decidim.
        step2: Budeme vás kontaktovat na videokonferenci, abychom následně posoudili kandidaturu.
        step3: V případě schválení kandidatury vám koordinační výbor každoročně zašle čestné prohlášení, které je třeba vyplnit a zaslat zpět spolu s potvrzením o přijetí příslušného bankovního převodu.
      title: Jak se stát partnerem Decidim?
    requirements:
      l1: Správa instancí. Správa jedné nebo více aktivních instancí Decidim v době podání žádosti, pro vlastní potřebu subjektu nebo třetích stran.
      l2: Přispívání k projektu. Přispívají nebo významně přispěli k projektu Decidim.
      p1: 'Musíte souhlasit se splněním a podepsáním <a href="%{social_contract_url}">Sociální smlouvy</a> a také splnit některou z následujících podmínek:'
      p2: Podrobnosti si můžete přečíst v <a href="%{metadecidim_partners_url}">Metadecidim assembly</a>.
      title: Jaké požadavky naše organizace musí splnit, aby se stala partnerem?
    subtitle: Pokud vaše organizace chce podpořit Decidim, můžete se stát partnerem Decidim.
    title: Partnerský program
