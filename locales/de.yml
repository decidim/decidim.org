  feature_cards:
    meetings:
      f3: Organisiere <strong>Veranstaltungen</strong> vor Ort oder online, verwalte Anmeldungen und veröffentliche die Traktandenliste.<br> Und vieles mehr!
    proposals:
      f1: Sammle <strong>Vorschläge</strong> von Teilnehmenden, angereichert mit Geolokalisierung und Anhängen, führe ähnliche zusammen und lege einen Workflow für die offizielle Genehmigung oder Ablehnung fest.
    voting:
      f2: Priorisiere Vorschläge mit verschiedenen <strong>Abstimmungsmethoden</strong>, zum Beispiel durch das Festlegen von Mindest- und Höchstschwellen, gewichtete Abstimmungen oder partizipative Budgetierung.
  features:
    component_groups:
      group_1:
        title: Beiträge erhalten
      group_2:
        title: Diskutieren und beraten
      group_3:
        title: Entscheidungen treffen
      group_4:
        title: Ergebnisse mit deinem Publikum teilen
    intro: Du kannst die Decidim-Software in einer öffentlichen oder privaten Organisation einsetzen – mit Hunderten oder Tausenden potenziellen Teilnehmenden, etwa einem Stadtrat, einer öffentlichen Institution, Vereinen, NGOs, Universitäten, Gewerkschaften, Genossenschaften oder Quartiergemeinschaften. Mit Decidim kannst du Räume für digitale Beteiligung einrichten und Beiträge sowie Diskussionen über die zahlreichen verfügbaren Komponenten organisieren.
    modules:
      button: Los geht's
      intro: Wachse über die Standardkomponenten hinaus.
      subtitle: Die Decidim-Community hat Hunderte von Modulen entwickelt, um die Plattform über die Grundfunktionen hinaus zu erweitern und noch besser auf deine Bedürfnisse einzugehen.
      title: Module
    need_help:
      button: Partner
      subtitle: Wirf einen Blick auf die Partner-Community – offizielle Decidim-Dienstleister, die dich bei der Installation sowie beim Hosting und der Wartung deiner Plattform unterstützen.
      title: Brauchst du Hilfe bei der Installation?
    page:
      feature1:
        label: Beteiligungsprozesse
        subtitle: Häufige Probleme schrittweise demokratisieren
        text: 'Prozesse sind ein Raum, der das Erstellen, Aktivieren/Deaktivieren und Verwalten verschiedener partizipatorischer Prozesse ermöglicht. Diese unterscheiden sich von anderen Räumen, indem sie in verschiedenen Phasen strukturiert werden, in denen alle Komponenten integriert werden können. Beispiele für partizipatorische Prozesse sind: ein Wahlprozess für Mitglieder eines Ausschusses, partizipative Budgetierung, ein strategischer Planungsprozess. das gemeinsame Schreiben einer Regulierung oder Norm, die Gestaltung eines städtischen Raumes oder die Erstellung eines öffentlichen Politikplans.'
        title: Beteiligungsprozesse
      feature10:
        subtitle: Analysieren, synthetisieren und gemeinsam aufbauen
        text: Kann verwendet werden, um lange Textdokumente in mehrere Vorschläge oder Ergebnisse zu konvertieren, und umgekehrt, um einen einheitlichen Text auf der Grundlage einer Sammlung von Vorschlägen oder Ergebnissen zu erstellen und anzuzeigen.
        title: Kollaborative Texte
      feature11:
        label: Konferenzen
        subtitle: Wo große Events uraufgeführt werden
        text: Erstelle eine Website für ein großes Event. Vereinheitliche das Programm, indem du eine Reihe von vordefinierten Veranstaltungen (Chats, Workshops, etc.) zusammenstellst und die Teilnehmer verwaltest.
        title: Konferenzen
      feature12:
        subtitle: Weil die Meinung deiner Gemeinschaft wichtig ist
        text: Designe und veröffentliche Umfragen. Zeige die Ergebnisse an und downloade sie.
        title: Umfragen
      feature13:
        subtitle: Gleichheit und Gerechtigkeit der Zufälligkeit
        text: Erlaubt eine Anzahl an Vorschlägen (z.B. Kandidaten für eine Jury) mit zufälligen, aber reproduzierbaren Verfahren, die eine unvoreingenommene und einheitliche Verteilung gewährleisten.
        title: Sortierung
      feature14:
        subtitle: Aufbau einer kollektiven Intelligenz
        text: Ermöglicht es den Nutzern, Kommentare hinzuzufügen, sie mit 'dafür', 'dagegen' oder 'neutral zu bewerten, für sie zu stimmen, sie zu beantworten und Benachrichtigungen über Antworten zu erhalten.
        title: Kommentare
      feature15:
        subtitle: Deine Community, informiert und aktuell
        text: "Erstelle informative Seiten mit Rich-Text-Formatierung, eingebetteten Bildern und Videos. Die Blog-Component ermöglicht es neue Beiträge oder Neuigkeiten zu erstellen und durch diese chronologisch zu durchsuchen.\n"
        title: Seiten und Blogs
      feature16:
        subtitle: Personalisierte Informationen zu interessanten Inhalten
        text: Decidim ermöglicht es, jeden Bereich oder jede Komponente zu folgen, so dass du auf dem Laufenden bleibst.
        title: Benachrichtigungen
      feature17:
        subtitle: Einfach, aber leistungsstark
        text: Sende E-Mails an alle, die sich auf der Plattform registriert haben, oder an diejenigen, die an einem bestimmten Bereich mitarbeiten
        title: Newsletter
      feature18:
        subtitle: Um die Beratung in der Community zu fördern
        text: Stelle eine Frage zu einem beliebigen Thema im Zusammenhang mit einem Prozess, erhalte Kommentare, beteilige dich an Diskussionssträngen und schliesse die Debatte mit einem Fazit ab.
        title: Debatten
      feature19:
        subtitle: Demokratische und transparente Entscheidungsfindung
        text: Reiche deinen Projektvorschlag für dein Quartier ein, stimme ab und unterstütze die Vorschläge, die dich überzeugen, entwickle gemeinsam Ideen und teile jeder davon einen bestimmten Geldbetrag zu.
        title: Partizipative Budgets
      feature2:
        label: Versammlungen
        subtitle: Die Macht der kollektiven Selbstorganisation
        text: Ermöglicht die Einrichtung von Entscheidungsgremien oder -gruppen (Räte, Arbeitsgruppen, Kommissionen ect.), die regelmäßig zusammentreten, deren Zusammensetzung, Liste und geografische Lage der Sitzungen. Es ermöglicht die Teilnahme an diesen Sitzungen, zum Beispiel durch persönliche oder Online-Teilnahme, dem Hinzufügen von Themen zur Tagesordnung oder durch Kommentare zu Vorschlägen und Beschlüssen des Gremiums.
        title: Versammlungen
      feature20:
        subtitle: Einfache und benutzerfreundliche Abstimmungsprozesse
        text: Richte Wahlen ein, um Entscheidungsprozesse zu unterstützen. Lade deine Zählung hoch oder aktiviere ein Token-System für die Abstimmung. Teilnehmende geben ihre Stimme über eine sichere Wahlkabine ab, und sobald die Abstimmung geschlossen ist, kannst du die Ergebnisse veröffentlichen.
        title: Wahlen
      feature3:
        subtitle: Entscheide über deine Wahl
        text: 'Biete Organisationen die Möglichkeit, verschiedene Abstimmungssysteme rund um Vorschläge zu aktivieren: unbegrenzt, begrenzt auf einen bestimmten Schwellenwert, kostenbasiert usw.'
        title: Konferenzen
      feature4:
        label: Initiativen
        subtitle: Gemeinsam die Agenda setzen – für alle zugänglich.
        text: Teilnehmende können Kooperationsinitiativen erstellen, deren Ziele und Entwicklungsweg festlegen, Unterstützung sammeln, Initiativen diskutieren und verbreiten sowie Treffpunkte einrichten, um Unterschriften zu sammeln oder Debatten durchzuführen, die anderen Mitgliedern der Organisation offenstehen.
        title: Initiativen
      feature5:
        subtitle: Deine Ideen im Detail
        text: Erstelle mit dem Assistenten Schritt für Schritt einen Vorschlag, vergleiche ihn mit bestehenden Ideen und veröffentliche ihn direkt auf der Plattform. Du kannst zusätzliche Infos wie Geolokalisierung, Dokumente oder Bilder hinzufügen. Die Komponente erlaubt dir außerdem, Vorschläge zu durchsuchen, zu filtern und mit ihnen zu interagieren. Mit dem Vorschlags-Inkubator könnt ihr Ideen sogar gemeinsam weiterentwickeln.
        title: Vorschläge
      feature6:
        subtitle: Entscheide über deine Wahl
        text: 'Ermöglicht Organisationen, rund um Vorschläge unterschiedliche Abstimmungs- oder Unterstützungssysteme zu aktivieren: unbegrenzt, bis zu einem festgelegten Schwellenwert, gewichtet, kostenbasiert usw. Grundlage dafür ist eine sichere und verschlüsselte E-Voting-Technologie.'
        title: Abstimmungen
      feature7:
        subtitle: Kein Vorschlag ohne Antwort
        text: Verwandle Vorschläge in konkrete Ergebnisse und gib offizielle Antworten zu ihrer Annahme oder Ablehnung. Dabei können auch mehrere Vorschläge zu einem gemeinsamen Ergebnis zusammengeführt werden.
        title: Ergebnisse
      feature8:
        subtitle: Ende-zu-Ende Transparenz
        text: Halte Teilnehmende über den Umsetzungsstatus auf dem Laufenden. Definiere anhand der Vorschläge Ergebnisse, erstelle Fortschrittsberichte zu deren Umsetzung und zeige auf, in welchem Masse die Ergebnisse erreicht wurden.
        title: Rechenschaftspflicht
      feature9:
        subtitle: Sich treffen und nichts verpassen
        text: Die Veranstaltungskomponente bietet Organisationen und Teilnehmenden die Möglichkeit, Veranstaltungen einzuberufen, deren Ort und Zeit festzulegen, Teilnehmende zu registrieren und deren Zahl zu begrenzen, Struktur und Inhalt der Veranstaltung festzulegen sowie die Protokolle und die daraus resultierenden Vorschläge zu veröffentlichen.
        title: Veranstaltungen
    section3:
      text: Dank seiner modularen Architektur und skalierbaren Logik kannst du ein leistungsstarkes System für demokratische Beteiligung in Organisationen jeder Art konfigurieren. Wähle die Funktionen, die am besten zu deinen Bedürfnissen passen, und gestalte deinen Beteiligungsprozess nach deinen Wünschen.
      title: Ein <span class="text-red-500">anpassbares System</span> für <br/>Beteiligung
    section4:
      link: Teste unsere Online-Demo
      title: Möchtest du selbst ausprobieren, wie es in der Praxis funktioniert?
