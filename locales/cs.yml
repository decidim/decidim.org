    intro: Flexibilní funkce Decidim jsou navrženy tak, aby sloužily malým a velkým kolektivům, veřejným i soukromým, přičemž komunity se pohybují od stovek tisíc účastníků. Včetně městských rad, sdružení, univerzit, nevládních organizací a družstev. Níže můžete prozkoumat celou databázi všech Decidim instalací.
