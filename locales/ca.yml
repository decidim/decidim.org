  partnership-policy:
    back_to_partners: Tornar a Col·laboradores
    explanation: Sostenir Decidim requereix temps i recursos. Cal assumir diverses tasques, com ara revisar les contribucions, classificar les incidències, corregir errors, escriure documentació i resoldre dubtes generals que comparteix la comunitat. Qualsevol organització (empresa, associació o col·lectiu) que vulgui esdevenir una entitat col·laboradora de Decidim es compromet a contribuir a l'Associació de Software Lliure Decidim amb una quota reduïda del 3% dels ingressos anuals generats per les activitats amb Decidim. En el cas de les organitzacions sense ànim de lucre, aquesta quota és de l'1,5%. Totes les entitats col·laboradores de Decidim tindran visibilitat pública al <a href="%{main_website_url}">lloc web principal de Decidim</a> i a <a href="%{readme_url}">la pàgina README del projecte a GitHub</a>. A més, l'Associació recomanarà les entitats col·laboradores de Decidim en les nostres xerrades i converses per correu electrònic sobre la prestació de serveis amb Decidim. Per donar suport les organitzacions d'incorporació recent, les entitats col·laboradores de Decidim estaran exemptes de contribuir econòmicament durant el primer any, per tal que primer puguin desenvolupar el seu pla de negoci amb Decidim. Mentrestant, recomanem que les entitats col·laboradores de Decidim trobin altres maneres de contribuir al projecte (com ara la informació d'errors, la documentació, la participació i el suport en activitats de la comunitat, etc.).
    how_to:
      steps:
        step1: Envieu un correu electrònic a associacio [at] decidim [dot] org amb les vostres dades de contacte i indiqueu a l'assumpte que voleu esdevenir una entitat col·laboradora de Decidim.
        step2: Ens posarem en contacte amb vosaltres per fer una videoconferència i, a continuació, avaluar la candidatura.
        step3: Si la candidatura és aprovada, la Comissió de Coordinació us enviarà cada any una declaració responsable perquè l'emplenu i la retorniu juntament amb el justificant de la transferència bancària corresponent.
      title: Com esdevenir una entitat col·laboradora de Decidim?
    requirements:
      l1: Gestió d'instàncies. Gestionar una o més instàncies actives de Decidim en el moment de la sol·licitud, per a l'ús propi de l'entitat o de tercers.
      l2: Contribucions al projecte. Contribuir o haver contribuït de manera significativa al projecte Decidim.
