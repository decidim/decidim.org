    coordination_committee:
      intro: Koordinazio Batzordea Decidim Elkartearen gobernu- eta ordezkaritza-organoa da. Praktikan, elkartea arazorik gabe funtzionatzen duela eta bere misio demokratiko eta parte-hartzailearekin lerrokatuta geratzen dela ziurtatzen duen organo betearazle gisa funtzionatzen du.
      title: Koordinazio Batzordea
    intro: Bulego Teknikoa eta Koordinazio Batzordea dira Elkartea kudeatzen eta ordezkatzen duten funtsezko eragileak.
    members:
      alejandra_gonzalez:
        bio: Alejandra filosofo-garatzailea da. 9 urte eman ditu Mexikoko gobernuekin teknologia zibikoko proiektuak ezartzen eta herritarren hacking zibikoko komunitateak antolatzen. 2019an Gobernu Irekiaren zuzendari izan zen Mexiko Hiriko gobernuan, non Decidim ezarri zuen lehen aldiz, eta ordutik komunitatearen parte izan da. Gaur egun, Codeando Mexikoko estrategia-zuzendaria da, eta Decidimeko koordinazio-batzordeko kidea.
        role: Batzordekidea
      andres_lucena:
        bio: Andrés software garatzailea eta sistemen administratzailea da, eta herritarrek parte hartzeko software eta teknologia irekietan espezializatuta dago. Azken hamarkadan, azpiegitura digital parte-hartzaileak ezartzen lan egin du Espainiako tokiko eta eskualdeko gobernuekin eta erakunde politikoekin.
        role: Teknologiako zuzendari nagusia
      antonio_calleja_lopez:
        bio: Antonio Soziologian doktorea da Exeterreko Unibertsitatean, Filosofiako DEA Sevillako Unibertsitatean eta Zientzia Politikoetako masterra du Arizonako Estatu Unibertsitatean. Tecnopolítica.net-ren koordinatzailea da UOCen IN3an, eta Heuristica.barcelona-en sortzaileetako bat. Teknologiaren, politikaren eta gizartearen arteko lotura anitzak aztertzen ditu, gizarte mugimenduen, esparru publikoaren, alderdi politikoen eta estatuaren platformizaziotik hasi eta datuen eta azpiegitura digitalen eraikuntza eta gobernantza sozioteknikoraino.
        role: Batzordekidea
      ben_gansky:
        bio: Ben Minneapolisen bizi den artista, ikertzaile eta konpromiso zibikoen diseinatzailea da. Artefaktu teknologikoak + prozesuak, istorioak eta umorea erkatzen ditu intermedia emanaldietan. Bere ikerketak pertsonak eta erakundeak erabiltzen dituzten tresna digitalen politika aitortzera eta negoziatzera nola iristen diren aztertzen du. Bere konpromiso zibikoko proiektuek interes horiek konbinatzen dituzte, politika digitalaren eta demokrazia parte-hartzailearen arteko elkargunea aberasteko esperientziak eta programak sortzeko.
        role: Batzordekidea
      carla_rocha:
        bio: Carla Informatikako irakasle eta ikertzailea da, Software Ingeniaritzan espezializatua. Gaur egun, Brasiliako Unibertsitateko (UnB) Software Ingeniaritza Saileko kidea da. Software ingeniaritzan ikerketa oparoa egiten du, software libre eta metodologia arinetatik hasi eta proiektuetan oinarritutako irakaskuntza estrategietaraino. Brasilgo Gobernu Federalarekin Brasil Participativo lankidetza-proiektua koordinatzen du.
        role: Batzordekidea
      carolina_romero:
        bio: Carol 20 urte baino gehiagoko esperientzia duen teknologoa da berrikuntza digitalean, gobernu irekian eta herritarren parte-hartzean. Decidim-en sortzaileetako bat, gaur egun proiektuaren Produktu Zuzendaria da.
        role: Produktuaren jabea
      david_igon:
        bio: David software libreko garatzailea da PokeCoden. Decidim komunitateko kidea da bertan lanean hasi zenetik. Parte hartzean, kooperatibismoan eta software librean aritu da beti.
        role: Diruzaina
      elsa_boloix:
        bio: Komunikazioa eta Decidim komunitatea koordinatzeaz arduratzen da Elsa. Komunikazio-kanpainak diseinatzen eta ezartzen ditu, eduki erakargarriak sortzen ditu, komunitatea konektatzen du eta Decidim ekosistemari, erabilera-kasuei eta Metadecidimi buruzko guztia zabaltzen du. Barne- eta kanpo-komunikazioan eta transmedia sortzaileen lanean eskarmentua du, eta Decidim Fest jaialdiaren ekoizpena eta antolaketa ere koordinatzen ditu.
        role: Komunikazioa eta komunitatea
      julieta_pasetti:
        bio: Julieta komunikazio bisualaren eta UX/UIren diseinatzailea da, eta diseinuak proposatzeaz, sormena ekartzeaz eta ideiak interfaze dinamiko eta parte-hartzaile bihurtzeaz arduratzen da, estetika eta erabilgarritasuna uztartuz, elkarrekintza bakoitzak herritarren parte-hartzea hobetu dezan.
        role: UX/UI diseinatzailea
      maite_orellana:
        bio: Maite administrazioarekin, finantzekin, giza baliabideekin, eta proiektuen eta diru-laguntzen kudeaketarekin lotutako lanez arduratzen da, Zuzendaritza Exekutiboarekin lankidetza estuan arituz. Aurretik esperientzia du marketinean, finantza-kudeaketan eta -kontrolean, eta giza baliabideetan, bai irabazi-asmoko erakundeetan, bai irabazi-asmorik gabekoetan.
        role: Administrazioa eta Giza Baliabideak
      marta_anducas:
        bio: Martak ingeniaritza informatikoa ikasi zuen Bartzelonako UPFn, Peruko Andeetako eta Amazoniako komunitateetan parte hartzen, sormena bere bilaketan, eta feminismoa tratu txar psikologikoen zapalkuntzan. 2019an, bere ibilbideek bat egin zuten Platoniq-en, Sormena eta Demokrazia bat datozen erakundean.
        role: Presidentea
      nil_homedes_busquets:
        bio: Politika publikoetan, parte-hartze demokratikoan eta burujabetza teknologikoan espezializatutako politologoa da Nil. Gaur egun, Decidim Elkarteko Bulego Teknikoko zuzendaria eta Decidim's Product Team-eko kidea da.
        role: Zuzendari exekutiboa
      pauline_bessoles:
        bio: Pauline Decidim Elkarteko kide aktiboa da, eta proiektuaren gobernantza demokratikoan eta plataformaren jasangarritasunean laguntzen du, komun digital gisa. Decidim erakunde publikoetan hedatzeko prestakuntza du, eta esperientzia eta demokrazia parte-hartzailearen aldeko apustu sendoa eskaintzen ditu. Gaur egun, XWiki SASen lan egiten du, software libreko enpresa luzean, XWiki eta Cryptpad-en editorean, non azpiegitura digital ireki eta kolaboratiboak babesten jarraitzen duen.
        role: Batzordekidea
      tom_greenwood:
        bio: Pauline Decidim Elkarteko kide aktiboa da, eta proiektuaren gobernantza demokratikoan eta plataformaren jasangarritasunean laguntzen du, komun digital gisa. Decidim erakunde publikoetan hedatzeko prestakuntza du, eta esperientzia eta demokrazia parte-hartzailearen aldeko apustu sendoa eskaintzen ditu. Egun, XWiki SASen lan egiten du, software libreko enpresa luzean, XWiki eta Cryptpad-en editorean, non azpiegitura digital ireki eta kolaboratiboak babesten jarraitzen duen.
        role: Garatzaile juniorra
      txema_laullon:
        bio: Txema Decidim Elkarteko Koordinazio Batzordeko kidea da.
        role: Idazkaria
      xabier_barandiaran:
        bio: Xabier filosofoa da, praktika sozialen, zientzia biologiko eta kognitiboen eta teknopolitikaren arteko gurutzaketan aritzen da. Diziplinarteko ikuspegi bat garatzen ari da, adimenaren filosofiaren, bizitza artifizialaren, neurozientziaren eta gizarte-zientziaren ikuspegiak bilduz, hacktibismoan, ezagutzaren komunen erreprodukzioan eta demokrazia parte-hartzailean aktiboki parte hartzen duen bitartean.
        role: Batzordekidea
    subtitle: Modu irekian eta herritarrek sortutako teknologiak gizarteek parte hartzeko eta erabakiak elkarrekin hartzeko modua eraldatu dezakeela sinesten duen pertsona talde bat gara.
