  testimonials:
    n1:
      org: Ajuntament de Barcelona (2015-2019)
      quote: '"Gràcies a Decidim, hem aconseguit a Barcelona co-produir un pla estratègic de ciutat conjuntament amb la ciutadania. En el 2016 inaugurem el Pla d''Acció Municipal en forma de procés participatiu a través de Decidim Barcelona. Actualment aquest pla recull gairebé 7 mil propostes ciutadanes. Una dels avantatges d''utilitzar aquesta plataforma és que pots seguir en tot moment l''estat d''implementació de les propostes acceptades."'
    n2:
      org: Som Energia
      quote: '"Amb la implementació de Decidim a Som Energia hem generat un espai més amable per a la participació. Vam posar en marxa l''eina el 2018, amb l''acollida de l''Assemblea General de la Cooperativa, i mesos més tard hi vam debatre el Redisseny de la Imatge i el desenvolupament col·laboratiu de l''Escola de Som Energia, entre altres processos participatius. En pocs mesos, s''hi han registrat més de 3.500 persones participants, amb 5 processos participatius, 3 assemblees en funcionament i més de 1.300 vots en l''última votació de l''Assemblea General."'
    n3:
      org: Presidenta del Consell Municipal de Mérida, Yucatán (Mèxic).
      quote: '"La plataforma digital Decide Mérida va ser una oportunitat que va obrir com mai abans els mecanismes de participació ciutadana per a l''elaboració del Pla de Desenvolupament Municipal de Mérida 2018-2021. Vam registrar més de 3.000 interaccions ciutadanes, que incloïen propostes, comentaris, suggeriments i suports, i que van permetre assolir el màxim consens possible sobre què és el millor per a la nostra ciutat. Sense dubte, la plataforma Decide Mérida continuarà sent la nostra aliada per fer de Mérida una societat cada cop més participativa."'
    n4:
      org: Ajuntament d’Helsinki
      quote: '"El que apreciem és que està construïda pensant en la democràcia i, per tant, la democràcia és un focus fonamental. Principis democràtics com la rendició de comptes, la igualtat i la transparència són al nucli del disseny."'
    n5:
      org: Govern Obert de Ciutat de Méxic
      quote: '"Gairebé tots els processos participatius que han arribat a la nostra taula els hem pogut resoldre utilitzant les regles de negoci de Decidim. Com a eina, és molt sòlida. No obstant això, l''aspecte que ens sembla més fort i més important és la seva comunitat, tant els desenvolupadors com les persones que la fan servir per als processos participatius. La convivència amb elles ens ha fet apreciar els reptes que implica implementar la democràcia participativa al món real."'
    n6:
      org: Mozilla Foundation
      quote: '"Patim una mancança d''espai públic. És especialment important que reclamem aquests espais públics per a nosaltres. Les plataformes obertes com Decidim fan exactament això. No només són de codi obert, de manera que altres persones les poden bifurcar, reutilitzar i construir-hi un procés; també tenen codificats en la manera com estan dissenyats els valors que volem reflectir en la nostra societat."'
    n7:
      org: Director de Recerca d'OpenForum Europe, Unió Europea
      quote: '"El procés va començar l''octubre de 2019 a la unitat de Comunicació i eDemocràcia de la Direcció General de Comunicació de la Comissió Europea, al Centre Comú de Recerca, el servei de ciència i coneixement de la Comissió Europea. Una anàlisi de les necessitats de la Conferència i de quines eines hi encaixaven va portar a triar l''eina de codi obert Decidim per la seva maduresa tècnica, la seva àmplia comunitat i la seva adaptabilitat."'
    n8:
      org: Pipeline to Power, que treballa per a la Comissió de Participació Ciutadana de la Ciutat de Nova York
      quote: '"En part, el que fa que Decidim sigui tan potent és que afegeix un nivell d''abstracció a la feina i separa les etapes d''un procés de les activitats associades al procés. Això forma part de l''arquitectura de la informació, de manera que no només es diu què passa a cada etapa, sinó que diferents parts de Decidim es comporten de manera diferent segons quan fas cada cosa o segons l''etapa del procés en què ets. El fet que sigui personalitzable permet realment que Decidim s''emmotlli a la manera com fem la nostra feina, i no que la nostra feina s''hagi d''emmotllar."'
    title: Testimonis
  thanks:
    message: Gràcies pel teu correu electrònic, et respondrem en breu.
    title: Gràcies per contactar-nos
  trademark:
    examples-1:
      l1: Incloure el logotip de Decidim en pàgines de producte per dir "treballem amb Decidim" (p. ex., allotjament, serveis de consultoria, desenvolupaments basats en Decidim).
      l2: Ús de la marca "Decidim" en títols de llibres i articles de recerca.
      l3: Ús del logotip de Decidim al peu de pàgina d’una instància (“Powered by Decidim”).
      title: Exemples d'ús que no necessiten permís
    examples-2:
      l1: Venda de marxandatge (adhesius, samarretes, tasses, etc.).
      l2: Ús del logotip de Decidim en la coberta d'un llibre.
      l3: Ús del logotip de Decidim en la capçalera d'un lloc web, donant a entendre que sou l'organització Decidim.
      title: Exemples d'ús que sí que necessiten permís
    examples-3:
      l1: Anomenar la vostra empresa o producte a partir de Decidim, com ara "The Decidim Consultants".
      title: Exemples d'ús que no obtindran permís
    goals:
      l1: Volem que qualsevol persona pugui fer servir fàcilment el nom o el logotip de Decidim en iniciatives orientades a la comunitat que ajudin a difondre i millorar Decidim.
      l2: Volem que quedi clar com poden (i com no poden) fer servir el nom i el logotip de Decidim les empreses i els projectes relacionats amb Decidim.
      l3: Volem que sigui difícil que algú faci servir el nom i el logotip de Decidim per treure'n un benefici injust, enganyar o confondre les persones que busquen recursos oficials de Decidim.
    p1: '"Decidim" i el logotip de Decidim són marques registrades de l''Associació de Software Lliure Decidim. Sense permís, no podeu fer servir aquestes marques en un entorn comercial per fer entendre que el vostre producte o servei està avalat o associat amb Decidim. Podeu fer servir aquestes marques per referir-vos a Decidim de manera que quedi clar que només feu referència al projecte, i no pas que en reclameu el suport o l''associació.'
    p2: 'Si feu servir el logotip de Decidim de qualsevol manera, cal que afegiu el text següent: <i>"El nom i el logotip de Decidim són una marca registrada de l''Associació de Software Lliure Decidim."</i>'
    p3: 'Hem elaborat aquesta política d''ús de la marca amb els objectius següents:'
    p4: Podeu sol·licitar permís escrivint a associacio@decidim.org.
    p5: Aquesta pàgina de la política de marca es basa en les del <a href="%{rails_url}">Ruby on Rails</a> i de la <a href="%{wordpress_url}">Wordpress Foundation</a>.
    title: Política de la marca
