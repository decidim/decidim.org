    intro: Se on vapaa avoimen lähdekoodin verkkopohjainen ohjemisto, jota ylläpitää laaja ja aktiivinen yhteisö. Alusta on suunniteltu auttamaan hallintoelimiä, organisaatioita ja yhteisöjä osallistamaan ihmisiä läpinäkyvissä ja strukturoiduissa päätöksentekoprosesseissa.
    section2:
      link: Lue lisää käyttötarinoita
      subtitle: Tutustu, kuinka kaupungit, hallinnot ja organisaatiot käyttävät jo Decidimiä erilaisin tarkoituksin ja erilaisin tavoin. Tutustu inspiroiviin käyttötarinoihin!
      title: Decidimiä käyttävät organisaatiot
    section3:
      link: Lue käyttötarinoita
      title: Teknologian, demokratian ja kokemuksen tukema
    section4:
      button1: Tietoa meistä
      intro: Decidim-yhdistys ("Decidim Free Software Association") on Decidim-yhteisön hallinnointiin ja ohjelmiston lähdekoodin ylläpitoon keskittynyt demokraattinen yhdistys.
      subtitle: Metadecidim on yhteisö, joka suunnittelee alustan tulevaisuutta ja kehittää hanketta eteenpäin. Suunnittelemme ja luomme yhdessä uusia ominaisuuksia ja ilmoitamme löytämistämme ongelmista, jotta voimme parantaa alustaa jatkuvasti.
      title: Kuka on alustan takana?
    section5:
      intro: 'Decidim avulla voit:'
      link: Tutustu ominaisuuksiin
      subtitle: Decidimin joustavat ominaisuudet on suunniteltu palvelemaan pieniä ja suuria joukkoja, julkisia ja yksityisiä organisaatioita, joissa on satoja tai tuhansia potentiaalisia käyttäjiä. Esimerkiksi kaupunginhallinnot, yhdistykset, yliopistot, kansalaisjärjestöt ja osuuskunnat.
      title: Onko Decidim oikea työkalu minulle?
    section6:
      intro: Aloittaaksesi Decidimin käytön, ohjelmisto on asennettava palvelimelle. Koska Decidim on rakennettu Ruby on Rails -teknologialla, asennusta varten tarvitaan kehittäjä, jolla on kokemusta tästä ohjelmistokehyksestä.
      intro2: 'Voit aloittaa kahdella tavalla:'
      title: Kuinka voin aloittaa Decidimin käytön
    section7:
      intro: Voit asentaa Decidimin seuraamalla virallisen dokumentaatiosivuston ohjeita.
      link: Lue asennusohje
      title: 'Organisaatiolla on kehittäjiä:'
