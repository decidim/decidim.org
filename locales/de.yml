      title: Verantwortung
    section-6:
      paragraph: <p>Decidim behält sich das Recht vor, diesen rechtlichen Hinweis, die <a href="%{privacy_policy_url}">Datenschutzerklärung</a> und/oder sonstige vertraglich relevante Texte, die für diese Website gelten, jederzeit und ohne vorherige Ankündigung zu ändern. Solche Änderungen treten mit ihrer Veröffentlichung auf der Website in Kraft.</p> <p>Decidim kann die Dienste der Website jederzeit ganz oder teilweise einstellen oder aussetzen. Soweit möglich, wird Decidim eine solche Einstellung oder Aussetzung vorab über diese Website ankündigen.</p>
      title: Änderungen
    section-7:
      paragraph: <p>Ihre auf unserer Website erhobenen personenbezogenen Daten oder jene, die Sie uns über das Kontaktformular oder per E-Mail übermitteln, werden streng gemäss unserer <a href="%{privacy_policy_url}">Datenschutzerklärung</a> verarbeitet.</p>
