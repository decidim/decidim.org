    how_to_support:
      back_to_supporters: Zurück zu den Unterstützer:innen
      intro: Die Hauptverantwortung der Association liegt in der Pflege des Quellcodes, weshalb alle Organisationen, die Decidim nutzen, auf diese Arbeit angewiesen sind. Der Code braucht Pflege, genau wie jede andere Art von physischer Infrastruktur. Würde sich niemand um diese Aufgabe kümmern, würde die Technologie von Decidim veralten und unbrauchbar werden. Deshalb liegt die Arbeit der Association im öffentlichen Interesse, da zahlreiche Verwaltungen und öffentliche Institutionen direkt davon profitieren. Es gibt verschiedene Möglichkeiten, mit der Association zusammenzuarbeiten. Wir definieren dazu eine Stufenleiter der Zusammenarbeit, die von weniger zu mehr reicht. Ziel ist es, einen schrittweisen Weg der Zusammenarbeit zwischen öffentlichen Organisationen und der Decidim Association vorzuschlagen.
      step1:
        body: Die öffentliche Verwaltung kann an Community-Events wie dem Decidim Fest teilnehmen und dort von ihren Erfahrungen mit Decidim berichten. Diese Form der Zusammenarbeit ist der einfachste Einstieg auf der Stufenleiter.
        title: 'An Community-Events teilnehmen:'
      step2:
        body: Die öffentliche Verwaltung kann die Entwicklung einer bestimmten Funktion finanzieren, die auf der Roadmap von Decidim steht und auch für die Verwaltung eine Priorität darstellt. Die Regierung könnte die Entwicklung dieser Verbesserung oder neuen Funktion bezahlen, die anschliessend in den Kern von Decidim integriert würde. In diesem Fall müssten der Association auch die aufgewendeten Stunden für Koordination, Produktdefinition und Code-Review vergütet werden.
        title: 'Eine Roadmap-Funktion finanzieren:'
      step3:
        body: Die Regierung und die Association können eine Absichtserklärung (MoU) abschliessen, mit dem Hauptziel, bei der Nutzung und Weiterentwicklung von Decidim zusammenzuarbeiten, insbesondere bei dessen Pflege und Nachhaltigkeit. Die Unterzeichnung eines MoU gibt der Regierung das Recht, Mitglied des Decidim Public Institutions Committee zu werden. Das mit Brasilien unterzeichnete MoU kannst du dir hier ansehen.
        title: 'Ein MoU mit der Association unterzeichnen:'
      step4:
        body: 'Zum Beispiel überweisen der Stadtrat von Barcelona und die Regierung von Katalonien jährlich finanzielle Mittel an die Association, um deren Kernaktivitäten zu finanzieren. Dazu zählen etwa die Pflege des Quellcodes, die Veröffentlichung neuer Decidim-Versionen, Community-Events oder andere Kernaktivitäten im Rahmen der Hauptmission der Association.'
        title: 'Kernaktivitäten der Association finanzieren:'
      title: Wie Regierungen mit uns zusammenarbeiten können
