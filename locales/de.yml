    intro: Es handelt sich um eine freie und quelloffene, webbasierte Software, die von einer grossen und aktiven Community gepflegt wird. Sie wurde entwickelt, um Regierungen, Organisationen und Gemeinschaften dabei zu helfen, Menschen in transparente, strukturierte Entscheidungsprozesse einzubinden.
    section2:
      link: Weitere Fallstudien lesen
      subtitle: Erfahre, wie Städte, Regierungen und Organisationen Decidim bereits auf unterschiedliche Weise und in verschiedenen Szenarien einsetzen – mit vielfältigen Zielen und Geschichten. Entdecke einige inspirierende Erfolgsgeschichten!
      title: Decidim in Verwendung
    section3:
      link: Fallstudie lesen
      title: Gebaut durch Technologie, Demokratie und Erfahrung
    section4:
      button1: Über uns
      intro: Die Decidim Free Software Association ist eine demokratische Vereinigung für die Verwaltung der Decidim-Community und zuständig für die Pflege des Quellcodes.
      subtitle: Metadecidim ist die Community, die an der Gestaltung der Plattform und der Entwicklung des Projekts mitwirkt. Gemeinsam entwerfen und entwickeln wir neue Funktionen und melden Fehler für die kontinuierliche Verbesserung der Plattform.
      title: Wer steht hinter der Plattform?
    section5:
      intro: 'Mit Decidim kannst du:'
      link: Funktionen entdecken
      subtitle: Die flexiblen Funktionen von Decidim sind darauf ausgelegt, sowohl kleine als auch grosse Kollektive sowie öffentliche und private Organisationen zu unterstützen – mit Hunderten oder Tausenden potenziellen Nutzenden, etwa Stadträten, Vereinen, Universitäten, NGOs oder Genossenschaften.
      title: Ist Decidim das richtige Werkzeug für dich?
    section6:
      intro: Um Decidim zu nutzen, musst du die Anwendung auf einem Server installieren. Da Decidim mit Ruby on Rails entwickelt wurde, braucht es für die Installation eine Person mit Erfahrung in diesem Framework.
      intro2: 'Du kannst auf zwei Arten starten:'
      title: So beginnst du mit Decidim
    section7:
