  testimonials:
    n1:
      org: Bartzelonako Udala (2015-2019)
      quote: '"Decidim-i esker, Bartzelonan lortu dugu herritarrekin batera hiri plan estrategiko bat koproduzitzea. 2016an Udaleko Ekintza Plana inauguratu genuen, Decidim Barcelonaren bidez prozesu parte-hartzaile moduan. Gaur egun, herritarren ia 7 mila proposamen jasotzen ditu plan horrek. Plataforma hori erabiltzearen abantailetako bat da uneoro monitorizatu ahal izango dela onartutako proposamenen gauzatze-egoera".'
    n2:
      org: Som Energia
      quote: '«Decidim Som Energian ezartzeari esker, partaidetza-espazio atseginagoa sortu dugu. 2018an jarri genuen tresna martxan, Kooperatibaren Batzar Orokorra bertan eginez, eta, hilabete batzuk geroago, irudiaren birdiseinuari eta Som Energiaren Eskola elkarlanean garatzeari buruz eztabaidatu genuen, beste partaidetza-prozesu batzuen artean. Hilabete gutxian, 3.500 parte-hartzaile baino gehiago erregistratu dira, 5 partaidetza-prozesu jarri dira martxan, 3 batzar daude aktibo eta 1.300 babes baino gehiago jaso dira azken Batzar Orokorreko bozketan.»'
    n3:
      org: Meridako (Yucatan, Mexiko) Udaleko Presidentea.
      quote: '«Decide Mérida plataforma digitalak inoiz ez bezala zabaldu zituen herritarren partaidetzarako mekanismoak, Méridako 2018-2021 Udal Garapen Plana prestatzeko. Herritarren 3.000 interakzio baino gehiago jaso genituen, proposamenak, iruzkinak, iradokizunak eta babesak barne, gure hiriarentzat onena denaren inguruan ahalik eta adostasun handiena lortzeko. Zalantzarik gabe, Decide Mérida plataformak gure aliatua izaten jarraituko du Mérida gero eta gizarte parte-hartzaileagoa izan dadin.»'
    n4:
      org: Helsinkiko hiria
      quote: '«Gehien baloratzen duguna da demokrazia ardatz hartuta garatu dela eta, beraz, demokraziak funtsezko lekua duela. Jarraipena, berdintasuna eta gardentasuna bezalako printzipio demokratikoak diseinuaren oinarrian daude.»'
    n5:
      org: Mexiko Hiriko gobernu irekia
      quote: '«Gure mahaira iritsi diren ia partaidetza-prozesu guztiak Decidim-en funtzionamendu-arauak erabiliz bideratu ahal izan ditugu. Tresna gisa, oso sendoa da. Hala ere, gure ustez, haren alderdirik sendoena eta garrantzitsuena komunitatea da, bai garatzaileek bai partaidetza-prozesuetan erabiltzen dutenek osatzen dutena. Haiekin harremanetan eta elkarlanean aritzeak aukera eman digu demokrazia parte-hartzailea praktikan ezartzeak dakartzan erronkak hobeto ulertzeko eta balioesteko.»'
    n6:
      org: Mozilla Fundazioa
      quote: '"Espazio publiko faltaren azpian sufritzen dugu. Oso garrantzitsua da guretzat espazio publiko horiek berreskuratzea. Decidim bezalako plataforma irekiek horixe egiten dute. Hori ez da bakarrik kode irekia, beraz, beste pertsona batzuek forjatu, berrerabili eta prozesu bat eraiki dezakete. Gure gizartean islatu nahi ditugun balio horiek ere baditu, diseinatuta dagoen moduan bertan kodetuta."'
    n7:
      org: OpenForum Europe Research Director, Europar Batasuna
      quote: '"Prozesua 2019ko urrian hasi zen Europako Batzordearen DG Communication and eDemocracy unitatean, Joint Research Centerren, Europako Batzordearen zientzia eta ezagutza zerbitzuan. Biltzarraren beharrak eta horiei dagozkien tresnak aztertuta, Decidim kode irekiko tresna aukeratu da, heldutasun teknikorako, komunitate zabalerako eta moldagarritasunerako."'
    n8:
      org: Pipeline to Power, NYCeko Konpromiso Zibikoen Batzordearentzat lanean
      quote: '«Decidim hain tresna indartsua izatea ahalbidetzen duen alderdietako bat da abstrakzio-maila bat gehitzen diola lanari, prozesu baten urratsak eta prozesuari lotutako jarduerak bereiziz. Hori informazio-arkitekturaren parte da, eta, horri esker, urrats bakoitzean zer gertatzen ari den adierazteaz gain, Decidim-en atalek modu desberdinean jokatzen dute egiten ari zarenaren arabera edo prozesuaren zein urratsetan zauden arabera. Hori pertsonalizatu ahal izateak benetan ahalbidetzen du Decidim gure lan egiteko modura moldatzea eta ez gure lana Decidim-era moldatu behar izatea.»'
    title: Testigantzak
  thanks:
    message: Eskerrik asko guregana jotzeagatik. Laster itzuliko gara.
    title: Eskerrik asko zure mezuagatik
  trademark:
    examples-1:
      l1: Decidim-en logotipoa barne produktu orrietan "Decidim-ekin lan egiten dugu" esateko (adibidez, hosting, aholkularitza zerbitzuak, Decidim oinarritutako garapenak).
      l2: '"Decidim" marka erabiltzea liburuen izenburuetan eta ikerketa-artikuluetan.'
      l3: Decidim logotipoaren erabilera instantzia baten oinetakoan ("Decidim bidez elikatua").
      title: Baimenik behar ez duten erabilera ereduak
    examples-2:
      l1: Salgaiak saltzen (pegatinak, kamisetak, kakoak, etab.).
      l2: Bilatu.
      l3: Web orri bateko goiburu batean Decidim logotipoa erabiltzea, Decidim erakundea zarela aditzera emanez.
      title: Baimena behar duten erabilera adibideak
    examples-3:
      l1: Zure enpresa edo produktua Decidim izenaz izendatzen, "Decidim aholkulariak" bezala.
      title: Baimenik lortuko ez duten erabilera adibideak
    goals:
      l1: Norbaitek Decidim izena edo logotipoa erabiltzea erraztu nahi dugu komunitateari zuzendutako ahaleginetarako, Decidim zabaltzen eta hobetzen laguntzeko.
      l2: Argi utzi nahi dugu Decidim-ekin zerikusia duten negozioek eta proiektuek Decidim izena eta logotipoa erabil ditzaketela (eta ezin dutela).
      l3: Decidim izena eta logotipoa erabiltzea nahi genuke... Decidim baliabide ofizialen bila dabilen jendea engainatu edo nahasteko.
    p1: '"Decidim" eta Decidim logoa Decidim Software Librearen Elkartearen marka komertzialak dira. Ezin dituzu marka horiek erabili merkataritza-gune batean zure produktua edo zerbitzua Decidim-ekin lotuta dagoela ondorioztatzeko baimenik gabe. Marka horiek erabil ditzakezu Decidim aipatzeko argi dagoen modu batean... proiektuaz ari zarela... eta ez duzula abalik edo elkarterik eskatzen.'
    p2: 'Decidim logotipoa erabiltzen ari bazara, testu hau gehitu behar duzu: <i>"Decidim izena eta logotipoa Associació de Software Lliure Decidim marka erregistratua da. "</i>'
    p3: 'Marken erabilera-politika hau garatu dugu helburu hauekin:'
    p4: Baimena eska dezakezu associacio@decidim.org helbide elektronikoaren bidez.
    p5: Marken politika orri hau <a href="%{rails_url}">Ruby on Rails</a> and <a href="%{wordpress_url}">Wordpress Fundazioan</a>oinarritu da.
    title: Marka erregistratuaren gidalerroa
