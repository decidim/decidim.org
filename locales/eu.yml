  legal-notice:
    section-1:
      paragraph: '<p>Associació de Software Lliure Decidim ("Decidim", "Gu" edo "Guk") elkartearen webgunera sartzen ari zara. Webgunea <a href="https://decidim.org">https://decidim.org/</a> web-domeinuaren bidez dago eskuragarri (aurrerantzean, "Webgunea"). Elkartearen egoitza helbide honetan dago: Carrer Concepción Arenal 165, 165. zenbakia, Canòdrom - Ateneu d''Innovació Digital i Democràtica, Bartzelona, 08027 posta-kodea, Espainia; eta identifikazio-zenbakia G67401174 da.</p><p><b>Gurekin harremanetan jar zaitezke helbide honetan: <a href="mailto:hola@decidim.org">hola@decidim.org</a></b></p> '
      title: Nor gara
    section-2:
      paragraph: "<p>Webgune honen helburua herritarrei Decidim, bere jarduerak eta teknologiaz buruzko informazio orokorra ematea da. Decidim hirientzako eta erakundeentzako parte-hartze demokratikorako plataforma librea eta kode irekikoa da, eta gure teknologia kolaboratiboaren bidez mundu osoan sortutako Decidim komunitatearen kudeaketa ahalbidetzen du, herritarren eta elkarteen proiektuak garatzeko partaidetza sozial handiagoarekin. Decidim plataforma doan probatu dezakezu gure lineako demoan.</p> \n\n<p>Lege Ohar honen erabilera-baldintzen helburua Webgune honen eta bertan ostatatutako zerbitzu eta/edo edukiaren erabilera baimendua arautzea da, Informazio Gizartearen Zerbitzuen eta Merkataritza Elektronikoaren 34/2002 Legearekin eta aplikagarriak diren beste lege-xedapenekin bat etorriz.</p>"
      title: Helburua
    section-3:
      paragraph: '<p>Webgune honetarako sarbidea doakoa da. Ez da eskaera-formulariorik bete behar, oro har, Webgune honetako informazioa eta/edo edukiak kontsultatzeko. Bestela, kontsultatu gure <a href="%{privacy_policy_url}">Pribatutasun-politika</a>.<p> <p>Webgunera sartzean eta hura erabiltzean, Lege Ohar honetako erabilera-baldintzak onartzen dituzu, eta Webgunea modu egokian, arduratsuan eta legez erabiltzeko konpromisoa hartzen duzu, eta, bereziki: (i) Webgunea aurreikusitako helburuetarako erabiltzea, hau da, gure zerbitzuei buruzko informazioa jasotzeko; Webgunea edo haren edukiak legez kanpoko helburuetarako edo ordena publikoaren, moralaren eta ohitura onen aurkako helburuetarako erabiltzeari uko egingo diozu; (ii) Webgunearen eta haren edukien jabetza intelektualeko eta industrialeko eskubideak errespetatzea, baita Decidim-i dagozkion eskubide guztiak ere; (iii) Webgunea edo haren edukietako edozein, edo horien edozein aldaketa, ez erreproduzitzea, kopiatzea, bihurtzea, aldatzea, banatzea, publikoki erakustea edo publikoaren eskura jartzea; (iv) Webgunea, "Lege Testuetako" xedapenak (hau da, Lege Ohar hau eta <a href="%{privacy_policy_url}">Pribatutasun-politika</a>) edo aplikatu beharreko legeria zuzenean edo zeharka gaizki erabiltzeagatik Decidim-ek jasaten duen edozein galera edo kalteren erantzule izango zara.<p>'
      title: Webgunearen erabilera
    section-4:
      paragraph: "<p>Web Gune honetako edukien gaineko jabetza intelektualaren eskubide guztiak, irudiak, markak, logotipoak, zeinu bereizgarriak, soinuak eta animazioak, testuak, soinu-, ikuspen- edo ikus-entzunezko grabazioak eta datu-baseak barne, Decidim-en edo haren lizentziadunen jabetzakoak dira, eta estatuko eta nazioarteko legeek babesten dituzte. Eskubide horiek Decidim eta/edo haren lizentziadunen alde erreserbatzen dira, eta ez dira sartzen, aldez aurretik, legez eta idatziz, eta ez dute baimenik ematen, ez eta baimenik ematen ere.</p>"
      title: Jabetza industriala eta intelektuala
    section-5:
      paragraph: "<p>Decidim-ek ez du erantzukizunik Webgunetik sar daitezkeen hirugarrenen web-orrien gainean, ezta Webgunean agertzen den eta berak sortu ez duen informazioaren zehaztasunaren, egiazkotasunaren eta indarraldiaren gainean ere. Hala ere, 34/2002 Legearen 17. artikuluaren arabera, Decidim-ek eduki edo esteka horien legezkotasunik ezaren berri izanez gero, horiek kentzeko edo desgaitzeko konpromisoa hartzen du, baita, hala badagokio, legez kanpokoa izan daitekeen edo hirugarrenen eskubideak urratu ditzakeen edozein eduki blokeatzeko ere, aipatutako Legearen 11. eta 16. artikuluekin bat etorriz.</p> <p>Era berean, Decidim-ek ez du erantzukizunik parte-hartzaileak bere ordenagailuan instalatutako nabigatzailean izandako akatsen edo konfigurazio desegokien ondorioz sor daitezkeen kalteen gainean. Decidim-ek ez du erantzukizunik parte-hartzaileak Internetera konektatzeak eragindako gorabehera edo akats teknikoen gainean.</p> <p>Decidim-ek ahalik eta ahalegin handiena egingo du, ahalik eta eperik laburrenean, akatsak eta gabeziak eguneratzeko eta zuzentzeko, Webgunerako eta/edo haren edukietarako sarbidean eta/edo konexioan gertatzen direnak barne; hala ere, ez du bermatzen etenik, konexioan eta/edo Webgunerako sarbidean akatsik edo haren edukien eguneraketan arazorik ez egotea.</p> <p>Webgunearen erabileraren eta sarbidearen erantzule zara. Decidim-ek ez du erantzukizunik birusen presentziaren, segurtasun-akatsen, zure gailuetan edo gailu horietan gordetako fitxategi edo dokumentuetan Webgunerako sarbidearen eta/edo konexioaren ondorioz sor daitezkeen kalteen, ezta Decidim-en kontroletik kanpoko legez kanpoko esku-sartzeen bidez hirugarrenei eragindako kalteen gainean ere.</p> <p>Decidim-ek ez du erantzukizunik izango Webgune honetara sartzean onartzen dituzun eta Lege Ohar honetan jasotzen diren betebeharrak ez betetzeagatik eta, bereziki, ez du erantzukizunik izango jabetza intelektualeko eskubideen, egile-eskubideen, publizitate- eta irudi-eskubideen edo hirugarrenen ondasun eta eskubideei lotutako bestelako eskubideen urraketengatik.</p>"
      title: Erantzukizuna
    section-6:
      paragraph: "<p>Decidim-ek Lege Ohar hau, <a href=\"%{privacy_policy_url}\">Pribatutasun Politika</a> eta Webgune honi aplikagarriak zaizkion beste edozein kontratu-testu alda ditzake aurrez jakinarazi gabe. Aldaketa horiek Webgunean argitaratzen diren unetik izango dira indarrean.</p> \n\n<p>Era berean, Decidim-ek Webguneko zerbitzuak amaitu edo eten ditzake edozein unetan. Ahal denean, Decidim-ek aurrez abisua emango du Webgune honen bidez amaiera edo etete horren berri emateko.</p>"
      title: Jakinarazpenak
    section-7:
      paragraph: <p>Gure Webgunean bildutako zure datu pertsonalak, edo gurekin harremanetan jartzean harremanetarako formularioaren bidez edo posta elektroniko bat bidaliz jasotakoak, zorrotz tratatuko dira gure <a href="%{privacy_policy_url}">Pribatutasun Politikaren</a> arabera.</p>
      title: Datu pertsonalak
    section-8:
      paragraph: <p>Gure Webgunean bildutako zure datu pertsonalak, edo gurekin harremanetan jartzen zarenean harremanetarako formularioaren bidez edo posta elektroniko bat bidaliz jasotakoak, zorrotz tratatuko dira gure <a href="%{privacy_policy_url}">Pribatutasun Politikaren</a> arabera.</p>
      title: Cookie-ak
    section-9:
      paragraph: "<p>Gure Testu Legalak, Lege Ohar hau eta gure <a href=\"%{privacy_policy_url}\">Pribatutasun Politika</a> barne, Espainiako legeriak arautzen ditu. Gure Webgunearen erabileratik sor daitekeen edozein auzi ebazteko, Bartzelonako hiriaren auzitegiak izango dira eskudunak.</p> \n\n<p><b>Azken eguneraketa</b>: 2022ko otsaila.</p>"
      title: Gobernu-zuzenbidea eta -jurisdikzioa
