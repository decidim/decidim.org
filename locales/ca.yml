  legal-notice:
    section-1:
      paragraph: "<p>Esteu accedint al lloc web de l'Associació de Software Lliure Decidim (\"Decidim\", \"Nosaltres\" o \"Ens\"), disponible a través del domini web <a href=\"https://decidim.org\">https://decidim.org/</a> (en endavant, el \"Lloc web\"), amb domicili social al Carrer Concepción Arenal 165, Nombre 165, Canòdrom - Ateneu d'Innovació Digital i Democràtica, Barcelona, codi postal 08027, Espanya, i amb número d'identificació fiscal G67401174.</p><p><b>Podeu contactar amb nosaltres a: <a href=\"mailto:hola@decidim.org\">hola@decidim.org</a></b></p>\n"
      title: Qui som
    section-2:
      paragraph: "<p>La finalitat d'aquest Lloc web és oferir informació general al públic sobre Decidim, les seves activitats i la seva tecnologia, que consisteix en una plataforma lliure i de codi obert de democràcia participativa per a ciutats i organitzacions, així com la gestió de la comunitat Decidim generada arreu del món a partir de la nostra tecnologia col·laborativa, que permet el desenvolupament de projectes ciutadans i associatius amb una major participació social. Podeu provar gratuïtament la plataforma Decidim amb la nostra demo en línia.</p> <p>La finalitat de les condicions d'ús d'aquest Avís legal és regular l'ús permès d'aquest Lloc web i dels serveis i/o continguts que allotja, d'acord amb la Llei 34/2002 de serveis de la societat de la informació i de comerç electrònic i altres disposicions legals aplicables.</p>"
      title: Finalitat
    section-3:
      paragraph: '<p>L''accés a aquest Lloc web és lliure. No cal emplenar cap formulari per navegar per la informació i/o els continguts d''aquest Lloc web en termes generals. En cas contrari, consulteu la nostra <a href="%{privacy_policy_url}">Política de Privacitat</a>.<p> <p>En accedir i fer servir el Lloc web, accepteu les condicions d''ús d''aquest Avís legal i us comprometiu a fer un ús adequat, diligent i licit del Lloc web i, en concret: (i) utilitzar el Lloc web per a les seves finalitats previstes, és a dir, informació sobre els nostres serveis, i us abstindreu de fer servir el Lloc web o els seus continguts amb finalitats il·lícites, o amb finalitats contràries a l''ordre públic, la moral i els bons costums; (ii) respectar els drets de propietat intel·lectual i industrial del Lloc web i dels seus continguts, així com tots els drets que corresponguin a Decidim; (iii) no reproduir, copiar, convertir, modificar, distribuir, exhibir públicament ni posar a disposició del públic el Lloc web o qualsevol dels seus continguts, ni cap modificació dels mateixos; (iv) sereu responsables de qualsevol pèrdua o dany que Decidim pateixi a conseqüència d''un ús indegut, directe o indirecte, per part vostra del Lloc web, de les disposicions dels "Textos legals" (denominació que engloba conjuntament aquest Avís legal i la <a href="%{privacy_policy_url}">Política de Privacitat</a>) i de la legislació aplicable.<p>'
      title: Ús del Lloc web
    section-4:
      paragraph: "<p>Tots els drets de propietat intel·lectual sobre els continguts d'aquest Lloc web, inclosos, entre d'altres, les imatges, les marques, els logotips, els signes distintius, els sons i les animacions, els textos, el so, els enregistraments sonors, visuals o audiovisuals i les bases de dades, són propietat de Decidim o dels seus llicenciants i estan protegits per les lleis nacionals i internacionals. Aquests drets es reserven a favor de Decidim i/o dels seus llicenciants. Queden expressament prohibits la reproducció, la còpia, la comunicació pública, la distribució, la modificació, la transformació, l'eliminació, la manipulació i qualsevol altre ús, inclosa l'extracció i la reutilització, amb ànim de lucre o sense, directa o indirecta, temporal o permanent, de la totalitat o d'una part d'aquest Lloc web o de qualsevol dels seus continguts, sense l'autorització expressa i prèvia per escrit de Decidim. Podem prendre qualsevol mesura legal i/o extrajudicial que considerem oportuna en cas de possible vulneració d'aquests drets.</p>"
      title: Propietat industrial i intel·lectual
    section-5:
      paragraph: "<p>Decidim no és responsable de les pàgines web de tercers a les quals es pot accedir des del Lloc web, ni de l'exactitud, la veracitat i la validesa de la informació del Lloc web que no sigui d'elaboració pròpia. No obstant això, d'acord amb l'article 17 de la Llei 34/2002, en el cas que Decidim tingui coneixement de la il·licitud d'aquest contingut o d'aquests enllaços, es compromet a eliminar-los o desactivar-los, així com, quan escaigui, a bloquejar qualsevol contingut que pugui ser il·lícit o vulnerar els drets de qualsevol tercer, d'acord amb els articles 11 i 16 de l'esmentada Llei.</p> <p>A més, Decidim no és responsable dels danys que puguin produir-se a causa de fallades o configuracions incorrectes del navegador instal·lat per l'usuari al seu ordinador. Decidim no és responsable de cap incidència ni fallada tècnica causada per la connexió de l'usuari a Internet.</p> <p>Decidim farà els màxims esforços per efectuar, en el menor temps possible, les actualitzacions i correccions dels errors i deficiències, inclosos els que es produeixin en l'accés i/o la connexió al Lloc web i/o als seus continguts, però no garanteix l'absència d'interrupcions, ni d'errors en la connexió i/o l'accés al Lloc web, ni l'actualització dels seus continguts.</p> <p>Sou responsables del vostre ús i accés al Lloc web. Decidim no serà responsable de la presència de virus, ni d'errors de seguretat, ni dels danys que puguin causar-se als vostres dispositius o als fitxers o documents emmagatzemats en aquests dispositius amb motiu de l'accés i/o la connexió al Lloc web, ni dels danys causats a tercers mitjançant intromissions il·legides fora del control de Decidim.</p> <p>Decidim no serà responsable de l'incompliment de les obligacions que accepteu en accedir a aquest Lloc web i que conté aquest Avís legal i, en particular, no serà responsable de cap infracció dels drets de propietat intel·lectual, dels drets d'autor, dels drets de publicitat i d'imatge, ni de cap altre dret respecte dels béns i drets de qualsevol tercer.</p>"
      title: Responsabilitat
    section-6:
      paragraph: <p>Decidim pot modificar aquest Avís legal, la <a href="%{privacy_policy_url}">Política de Privacitat</a> i/o qualsevol altre text de naturalesa contractual aplicable a aquest Lloc web sense avís previ. Aquestes modificacions seran efectives en el moment de la seva publicació al Lloc web.</p> <p>Decidim també pot finalitzar o suspendre els serveis del Lloc web en qualsevol moment. Sempre que sigui possible, Decidim avisarà/advertirà prèviament sobre aquesta finalització o suspensió a través d'aquest Lloc web.</p>
      title: Modificacions
    section-7:
      paragraph: <p>Les vostres dades personals recopilades al nostre Lloc web, o quan contacteu amb nosaltres a través del formulari de contacte o enviant un correu electrònic, es tractaran estrictament d'acord amb la nostra <a href="%{privacy_policy_url}">Política de Privacitat</a>.</p>
      title: Dades personals
    section-8:
      paragraph: <p>Aquest Lloc web no fa servir galetes. Més informació a la nostra <a href="%{privacy_policy_url}">Política de Privacitat</a>.</p>
      title: Galetes
    section-9:
      paragraph: '<p>Els nostres Textos legals, incloent-hi aquest Avís legal i la nostra <a href="%{privacy_policy_url}">Política de Privacitat</a>, es regeixen per la legislació espanyola. Els tribunals de la ciutat de Barcelona seran competents per resoldre qualsevol controvèrsia derivada de l''ús del nostre Lloc web.</p> <p><b>Darrera actualització</b>: febrer de 2022.</p>'
      title: Llei aplicable i jurisdicció
    title: Avís legal
