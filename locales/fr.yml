    bottom_section:
      button: Let's talk about your project
      subtitle: We can help you with every step of using Decidim's product, from participatory design to learning how to install Decidim. Have a collaboration idea? We'd love to hear about it.
      title: Need help?
    history:
      timeline:
        - 
          year: 2011
          above: All started with the 15M movement and the convergence of earlier hacktivists, autonomous and democratic activism in Spain and the rise of the technopolitical cycle.
        - 
          year: 2016
          below: In Barcelona, in early 2016, a fork of Consul, the participatory platform of the Madrid City Council, was used to power up the site <a href="https://decidim.barcelona" class="underline decoration-1">decidim.barcelona</a>, the new digital venue for participatory processes in the city council.
        - 
          year: 2017
          above: Technopolitical differences in vision and practice between the city council democratic innovation teams brought about a split between the two cities; as a result, Decidim was launched in early 2017 as a brand-new software with a more modular and co-developable architecture.
        - 
          year: 2019
          below: In 2019 the Decidim Free Software Association was constituted and an agreement with the Barcelona City Council was signed, ceding to the Association the maintenance of the code base. This makes Decidim a public-common project.
        - 
          year: 2025
          above: Until now, over 450 cities and organisations globally have embraced Decidim. And the Decidim Association has been growing as an international leader in democratic technologies and open source software.
      title: Our history in a nutshell
    intro: Nous voulons contribuer à la démocratisation de la société par la construction de technologies, méthodologies, pratiques, normes, actions, récits et valeurs, d'une manière libre, ouverte, collaborative et rélexive.
    mission:
      subtitle: Our mission is to <span class="underline decoration-2">contribute to the democratization of society</span> through the construction of technology, methodologies, practices, standards, and values, in a free, open, collaborative and reflective way.
      title: Mission
    partners:
      cta: You can also check our 2025 Activity Report
      subtitle: The Association works on different projects related to democratic innovation, research, governance of digital commons, and the development of FLOSS technologies. We work in collaboration with leading organisations in their field.
      title: Our recent work
    recognitions:
      digital_public_good: Digtal Public Good
      osor_award: Decidim became finalist of the OSOR prize in the EU Public Services Open Source Achievement Awards
      pizzigati_prize: Decidim was awarded with the Pizzigati Prize for Software in the Public Interest, promoted by NTEN
      public_good: Decidim is recognized as a Digital Public Good by the Digital Public Goods Alliance
      sharing_reuse: Decidim won the Sharing & Reuse Awards in the Most Innovative Open Source Projects category by the EU
      subtitle: The Decidim Association has been proudly awarded with a series of recognitions for its contributions to open-source, democracy and participation.
      title: Recognitions
    subtitle: La Decidim Free Software Association (ou association du logiciel libre Decidim) est une association démocratique pour la gouvernance de la communauté Decidim.
    title: À propos de Decidim
    values:
      v1: Consensus et responsabilité
      v2: Égalité des chances et indicateurs de qualité
      v3: Contenu ouvert pour partager et coopérer
      v4: Logiciel libre pour permettre l'autonomie
      v5: Confidentialité des données
      v6: Transparence, traçabilité et intégrité
      v7: Amélioration continue et collaboration entre les organisations
    values_cta: Lire le contrat social
    values_intro: <p>Depuis le début, Decidim a un contrat social qui inclut les valeurs du projet.</p><p>Tous les membres de la Decidim Free Software Association s'engagent à respecter ce contrat.</p>
    values_title: Nos valeurs
    vision:
      subtitle_1: The members of the Decidim Association share the vision of a radically democratic society in which <span class="underline decoration-2">every person takes part among equals in common life.</span>
      subtitle_2: The Association <span class="underline decoration-2">embodies its vision of society in its own governance:</span> it is the community that decides the direction of the Decidim project and makes Decidim a technology of, by and, for all.
      title: Vision
