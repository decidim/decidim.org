      f3: Organizujte osobní nebo online <strong>schůzky</strong>, spravujte registrace a zveřejňujte program. <br>A mnohem více!
    proposals:
      f1: Sbírejte <strong>návrhy</strong> od účastníků, obohacené geolokací a přílohami, sjednoťte podobné návrhy a nastavte pracovní postup pro oficiální schválení nebo odmítnutí.
    voting:
      f2: Upřednostňujte návrhy pomocí různých metod <strong>hlasování</strong>, jako je stanovení minimálních a maximálních prahových hodnot, vážené hlasování nebo participativní rozhodování o rozpočtu.
  features:
    component_groups:
      group_1:
        title: Přijímejte příspěvky
      group_2:
        title: Diskutujte a zvažujte
      group_3:
        title: Rozhodujte
      group_4:
        title: Komunikujte výsledky vašemu publiku
    intro: Program Decidim můžete používat ve veřejné nebo soukromé organizaci se stovkami nebo tisíci potenciálních účastníků, jako městská rada, veřejná instituce, sdružení, nevládní organizace, univerzity, odbory, družstva nebo společenství sousedství. S Decidim budete moci nakonfigurovat prostory pro digitální účast a organizovat příspěvky a diskuze prostřednictvím více dostupných komponent.
    modules:
      button: Začínáme
      intro: Rozvoj za hranice výchozích komponent.
      subtitle: Komunita Decidim vyvinula stovky modulů pro rozšíření platformy nad základy a uspokojuje vaše potřeby ještě lépe.
      title: Moduly
    need_help:
      button: Partneři
      subtitle: Podívejte se na partnerskou komunitu, oddělení oficiálních poskytovatelů služeb, kteří vám mohou pomoci při instalaci, hostování a údržbě vaší platformy.
      title: Potřebujete pomoc při instalaci?
    page:
      feature1:
        label: Participační procesy
        subtitle: Krok za krokem demokratizovat společné problémy
        text: 'Proces je prostor, který umožňuje vytvářet, aktivovat/deaktivovat a spravovat různé participativní procesy. Rozlišují se od ostatních prostor tím, že jsou strukturovány v různých fázích, do nichž mohou být začleněny všechny součásti. Příklady participačních procesů jsou: volební proces pro členy výboru, participativní sestavování rozpočtu, proces strategického plánování, společné vypracování nařízení nebo normy, návrh městského prostoru nebo vypracování plánu veřejné politiky.'
        title: Participační procesy
      feature10:
        subtitle: Analyzovat, syntetizovat a společně budovat
        text: Lze použít k převodu dlouhých textových dokumentů na několik návrhů nebo výsledků a naopak, vytvořit a zobrazit jednotný text založený na souboru návrhů nebo výsledků.
        title: Kolaborativní texty
      feature11:
        label: Konference
        subtitle: Kde jsou velké události poprvé představeny
        text: Vytvořte webové stránky pro velkou událost. Sjednotte program připojením se k předdefinovaným schůzkám (chaty, workshopy apod.) a řízením účastníků.
        title: Konference
      feature12:
        subtitle: Protože na názoru vaší komunity záleží
        text: Navrhněte a publikujte průzkumy. Zobrazte a stáhněte výsledky.
        title: Průzkumy
      feature13:
        subtitle: Rovnost a spravedlnost náhodnosti
        text: Umožňuje vybrat určitý počet návrhů (např. kandidátů do poroty) pomocí náhodných, ale reprodukovatelných postupů, které zaručují nezkreslené a rovnoměrné rozdělení.
        title: Losování
      feature14:
        subtitle: Budování kolektivní inteligence
        text: Umožňuje uživatelům přidávat komentáře, hodnotit je kladně, záporně nebo neutrálně, hlasovat o nich, odpovídat a dostávat oznámení o odpovědích.
        title: Komentáře
      feature15:
        subtitle: Vaše komunita, informovaná a aktuální
        text: Vytvářejte informativní stránky s bohatým formátováním textu, vloženými obrázky a videi. Komponenta blogu umožňuje tvorbu příspěvků nebo zpráv a jejich navigaci chronologicky.
        title: Stránky a blogy
      feature16:
        subtitle: Osobní informace o zajímavém obsahu
        text: Decidim vám umožňuje sledovat každý prostor nebo komponentu, abyste mohli dostávat aktualizace pokaždé, když se tak stane.
        title: Oznámení
      feature17:
        subtitle: Jednoduchý, ale výkonný
        text: Posílejte e-maily všem registrovaným na platformě nebo těm, kteří se účastní určitého prostoru.
        title: Zpravodaj
      feature18:
        subtitle: Podporujte komunitní diskusi
        text: Zeptejte se na jakékoli téma související s procesem, dostávejte připomínky, účastněte se diskusí a ukončete rozpravu se závěrem.
        title: Debaty
      feature19:
        subtitle: Demokratické a transparentní rozhodování
        text: Přidejte svůj návrh projektu o svém městském okresu, hlasujte a podpořte ty, kteří s vámi chtějí společně vytvářet kolektivní myšlenky a dávat na ně každému konkrétní částku peněz.
        title: Participativní rozpočty
      feature2:
        label: Shromáždění
        subtitle: Síla kolektivní sebeorganizace
        text: Umožňuje zřídit rozhodovací orgány nebo skupiny (rady, pracovní skupiny, komise atd.), které se pravidelně scházejí, a podrobně popisuje jejich složení, seznam a zeměpisnou polohu jejich schůzí. Umožňuje se jich účastnit, například se jich účastnit osobně nebo online, přidávat otázky na pořad jednání nebo se vyjadřovat k návrhům a rozhodnutím přijatým daným orgánem.
        title: Shromáždění
      feature20:
        subtitle: Jednoduché a uživatelsky přívětivé hlasovací procesy
        text: Nastavte volby, abyste podpořili rozhodování. Nahrajte svůj seznam občanů nebo aktivujte symbolický systém pro hlasování. Účastníci dali své hlasy zabezpečeným hlasováním obojím a po ukončení hlasování můžete zveřejnit výsledky.
        title: Volby
      feature3:
        subtitle: Rozhodněte o své volbě
        text: 'Nabídněte organizacím možnost aktivovat různé hlasovací systémy kolem návrhů: neomezené, omezené na danou prahovou hodnotu, založené na nákladech atd.'
        title: Konference
      feature4:
        label: Iniciativy
        subtitle: Nastavení agendy pro všechny, v dosahu všech
        text: Účastníci mohou vytvářet společné iniciativy, definovat jejich cestu a cíle, shromažďovat schválení, projednávat, projednávat a šířit iniciativy, stanovit místa zasedání, kde mohou být podpisy shromažďovány od účastníků nebo diskusí, které jsou přístupné ostatním členům organizace.
        title: Iniciativy
      feature5:
        subtitle: Vaše nápady podrobně
        text: Vytvořte návrh pomocí průvodce vytvořením, porovnejte jej s již existujícími návrhy, zveřejněte jej na platformě a připojte další informace, jako je zeměpisná poloha nebo přiložené dokumenty a obrázky. Tato komponenta také umožňuje procházet, filtrovat a interagovat se sadou návrhů. Kromě toho můžete pomocí návrhu-inkubátoru vytvářet kolaborativní návrhy.
        title: Návrhy
      feature6:
        subtitle: Rozhodněte o své volbě
        text: 'Nabízí organizacím možnost aktivovat různé systémy hlasování nebo podpory pro návrhy: neomezené, omezené na určitou hranici, vážené, založené na nákladech atd. Podporováno bezpečnou a šifrovanou technologií elektronického hlasování.'
        title: Hlasování
      feature7:
        subtitle: Žádný návrh nezůstane bez odpovědi
        text: Proměňte návrhy ve výsledky a poskytněte oficiální odpovědi týkající se jejich přijetí nebo odmítnutí, a sloučte různé návrhy do jediného výsledku.
        title: Výsledky
      feature8:
        subtitle: Transparentnost od začátku do konce
        text: Informujte účastníky o stavu implementace. Na základě návrhů definujte výsledky, vytvářejte a uplatňujte zprávy o pokroku při jejich provádění a ukazujte, do jaké míry bylo dosaženo výsledků.
        title: Odpovědnost
      feature9:
        subtitle: Potkat se a nenechat si nic ujít
        text: Komponenta Schůzky nabízí organizacím a účastníkům možnost svolat zasedání, určit jejich polohu a čas, zaregistrují a omezují účastníky, definují strukturu a obsah zasedání, jakož i zveřejňují zápisy a výsledné návrhy.
        title: Zasedání
    section3:
      text: Díky své modulární architektuře a škálovatelné logice můžete konfigurovat silný systém demokratické účasti ve všech typech organizací. Vyberte si funkce, které nejlépe odpovídají vašim potřebám a přizpůsobte si váš participační proces.
