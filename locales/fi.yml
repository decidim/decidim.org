        step2: Otamme sinuun yhteyttä sopiaksemme etätapaamisen arvioidaksemme kumppanuutesi perustaa.
        step3: Jos kumppanuutenne hyväksytään, koordinaatiokomitea pyytää vuosittain täyttämään kumppanuuslomakkeen sekä suorittamaan kumppanuuteen liittyvät maksut.
