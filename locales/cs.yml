  team:
    banner:
      link: Objevte komunitu
      subtitle: Zde se můžete setkat s institucionálními zastánci a partnery, kteří jsou součástí vesmíru Decidim.
      title: Decidim komunita je ještě větší
    coordination_committee:
      intro: Koordinační výbor je řídícím a zastupujícím orgánem rozhodčího sdružení. V praxi funguje jako výkonný orgán, který zajišťuje hladké fungování asociace a je v souladu s její demokratickou a participativní misí.
      title: Koordinační výbor
    intro: Technický úřad a koordinační výbor jsou klíčovými subjekty, které řídí a zastupují sdružení.
    members:
      alejandra_gonzalez:
        bio: Alejandra is a philosopher-developer. She has spent 9 years implementing civic technology projects with Mexican governments and organising citizen civic hacking communities. In 2019 she was director of Open Government in the Mexico City government where she first implemented Decidim, and has been part of the community ever since. She is currently director of strategy at Codeando México and part of the coordination committee at Decidim.
        role: Mluvčí
      andres_lucena:
        bio: Andrés is a software developer and systems administrator specialising in open-source software and technologies for citizen participation. Over the past decade, he has worked on implementing participatory digital infrastructures with local and regional governments and political organisations in Spain.
        role: Technický ředitel
      antonio_calleja_lopez:
        bio: Antonio is a PhD in Sociology from the University of Exeter, a DEA in Philosophy from the University of Seville and has a Master's Degree in Political Science from Arizona State University. He is the coordinator of Tecnopolítica.net at the UOC's IN3 and co-founder of Heuristica.barcelona. He studies the multiple connections between technology, politics and society, from the platformisation of social movements, the public sphere, political parties and the state to the socio-technical construction and governance of data and digital infrastructures.
        role: Mluvčí
      ben_gansky:
        bio: Ben is an artist, researcher, and civic engagement designer based in Minneapolis. He collides technological artifacts + processes, stories, and humor in intermedia performances. His research deals with how people and organizations come to recognize and negotiate the politics of the digital tools they use. His civic engagement projects combine these interests to create experiences and programs for enlivening the intersection of digital politics and participatory democracy.
        role: Mluvčí
      carla_rocha:
        bio: Carla is a professor and researcher in Computer Science, specializing in Software Engineering. She is currently a member of the Department of Software Engineering at the University of Brasília (UnB). She boasts prolific research in software engineering, ranging from free software and agile methodologies to project-based teaching strategies. She coordinates the Brasil Participativo collaboration project with the Brazilian Federal Government.
        role: Mluvčí
      carolina_romero:
        bio: Carol is a technologist with over 20 years of experience in digital innovation, open government, and citizen participation. Cofounder of Decidim, she is currently the project’s Product Director.
        role: Vlastník produktu
      david_igon:
        bio: David is a free software developer at PokeCode. He has been a member of the Decidim community since he began working there. He has always been involved in participation, co-operativism and free software.
        role: Pokladník
      elsa_boloix:
        bio: Elsa má na starosti koordinaci komunikace a komunity Decidim. Zaměřuje se na navrhování a realizaci komunikačních kampaní, tvorbu poutavého obsahu, propojování komunity a šíření informací o ekosystému Decidim, příkladech použití a Metadecidimu. Díky svým zkušenostem v oblasti interní i externí komunikace a kreativní transmediální práce také koordinuje produkci a organizaci akce Decidim Fest.
        role: Komunikace a komunita
      julieta_pasetti:
        bio: Julieta is a visual communication and UX/UI designer, responsible for proposing designs, contributing creativity, and transforming ideas into dynamic and participatory interfaces, combining aesthetics and usability so that each interaction improves citizen participation.
        role: UX/UI designer
      maite_orellana:
        bio: Maite má na starosti úkoly související s administrativou, financemi, lidskými zdroji a řízením projektů a grantů, přičemž úzce spolupracuje s výkonným vedením. Má zkušenosti z oblasti marketingu, finančního řízení a kontroly a lidských zdrojů, a to jak v komerčních, tak v neziskových organizacích.
        role: Administrativa a personální oddělení
      marta_anducas:
        bio: Marta vystudovala počítačové inženýrství na UPF v Barceloně, zapojila se do života andských a amazonských komunit v Peru, rozvíjela svou kreativitu při vlastním hledání a setkala se s feminismem v souvislosti s útlakem v podobě psychického násilí. V roce 2019 se její cesty spojily v organizaci Platoniq, kde se prolínají kreativita a demokracie.
        role: Předseda
      nil_homedes_busquets:
        bio: Nil is a political scientist specializing in public policy, democratic participation, and technological sovereignty. He is currently the Director of the Technical Office at the Decidim Association and a member of Decidim's Product Team.
        role: Výkonný ředitel
      pauline_bessoles:
        bio: Pauline is an active member of the Decidim Association, where she contributes to the democratic governance of the project and the sustainability of the platform as a digital common. With a background in deploying Decidim in public institutions, she brings both hands-on experience and a strong commitment to participatory democracy. She currently works at XWiki SAS, a long-standing free software company, editor of XWiki and Cryptpad, where she continues to support open and collaborative digital infrastructures.
        role: Mluvčí
      tom_greenwood:
        bio: Tom is a software developer originating from London, he works within the technical office. With a background in commercials in the artificial intelligence space, he switched careers in 2022 opting to better understand how to build software. After graduating from a Ruby on Rails focused Web Development program at Le Wagon, he’s now involved in maintaining the Decidim application codebase and organising monthly global Developers community meet ups.
        role: Junior vývojář
      txema_laullon:
        bio: Txema je členem Koordinačního výboru pro asociaci Decidim.
        role: Tajemník
      xabier_barandiaran:
        bio: Xabier is a philosopher, engaged in the intersection of social practices, biological and cognitive sciences and technopolitics. He is developing an interdisciplinary approach bringing together insights from philosophy of mind, artificial life, neuroscience and social science, while actively involved in hacktivism, the reproduction of the knowledge commons and participatory democracy.
        role: Mluvčí
    subtitle: Jsme skupina lidí, kteří věří, že technologie vyvíjená otevřeně a lidmi samotnými může změnit způsob, jakým se společnosti zapojují do společenského dění a společně přijímají rozhodnutí.
    technical_office:
      intro: Profesionální tým, který pracuje pro sdružení Decidim a zajišťuje každodenní chod projektu.
      title: Technická kancelář
    title: Tým
  testimonials:
    n1:
      org: Barcelonská radnice (2015–2019)
      quote: '"Díky Decidim se nám v Barceloně podařilo společně s občany vytvořit strategický plán města. V roce 2016 jsme prostřednictvím Decidim Barcelony zahájili akční plán ve formě participačního procesu. V současné době tento plán obsahuje téměř 7 tisíc občanských návrhů. Jednou z výhod používání této platformy je, že můžete kdykoli sledovat stav provádění schválených návrhů."'
    n2:
      org: Som Energia
      quote: 'S implementací Decidim v Som Energia jsme vytvořili příjemný prostor pro občanskou participaci. Tento nástroj jsme uvolnili v roce 2018, za hostování valného shromáždění družstva a po pár měsících později jsme diskutovali o projektu přepracování vizuálního stylu a spolupracujícímu rozvoji School of Som Energia, kromě jiných participačních procesů. Za několik měsíců se zaregistrovalo více než 3500 účastníků, 5 participačních procesů, 3 shromáždění pracujících a více než 1,300 hlasů při posledním hlasování Valného shromáždění.'
    n3:
      org: Předseda Městské rady Mérida Yucatán, Mexiko.
      quote: 'Digitální platforma Decide Mérida byla příležitostí, která se otevřela jako nikdy před mechanismy účasti občanů na vypracování plánu rozvoje měst Mérida 2018-2021. Měli jsme více než 3000 občanských interakcí včetně návrhů, připomínek, návrhy a podporu, aby bylo dosaženo co největšího konsenzu o tom, co je nejlepší pro naše město. Bezpochyby bude platforma „Decide Mérida“ i nadále naším spojencem při vytváření participativní společnosti města Mérida.'
    n4:
      org: Město Helsinki
      quote: '„Oceňujeme, že je vybudována s ohledem na demokracii, a proto je demokracie velkým cílem. Jádrem návrhu jsou demokratické principy, jako je zodpovědnost, rovnost a transparentnost."'
    n5:
      org: Otevřená vláda Mexico City
      quote: 'Téměř každý participativní proces, který se dostal k našemu stolu, jsme dokázali vyřešit pomocí pravidel pro podnikání Decidim. Jako nástroj je velmi silný. Avšak část, která se nám zdá nejsilnější a nejdůležitější, je její společenství, jak vývojářů, tak těch, kteří ji používají k participačním procesům. Díky spolupráci s nimi jsme si cenili výzev spojených s uplatňováním participativní demokracie v reálném světě.'
    n6:
      org: Mozilla nadace
      quote: '"Trpíme nedostatkem veřejného prostoru. Je obzvláště důležité, abychom tyto veřejné prostory získali zpět pro nás. Otevřené platformy, jako je Decidim, dělají přesně to. Je nejen to, že je open source, takže ostatní lidé ji mohou forknout, znovu použít a vybudovat proces. Má také ve způsobu, jakým je navržena, zakódovány tyto hodnoty, které chceme odrážet v naší společnosti."'
    n7:
      org: OpenForum Europe Research Director, Evropská unie
      quote: 'Proces byl zahájen v říjnu 2019 na oddělení Evropské komise pro komunikaci a elektronickou demokracii ve Společném výzkumném středisku, což je vědecká a znalostní služba Evropské komise. Analýza potřeb konference a toho, které nástroje jim odpovídají, vedla k výběru open source nástroje Decidim pro jeho technickou vyspělost, širokou komunitu a přizpůsobivost.'
    n8:
      org: Pipeline to Power, práce pro Komisi pro občanskou angažovanost v New Yorku
      quote: 'Decidim je tak výkonný mimo jiné proto, že přidává do práce úroveň abstrakce, která odděluje jednotlivé kroky procesu a činnosti s ním spojené. To je součástí informační architektury, takže nejenže říkáte, co se děje v každém kroku, ale různé části Decidimu se chovají různě v závislosti na tom, kdy děláte, nebo v závislosti na tom, v jakém kroku procesu se nacházíte. Skutečnost, že je to přizpůsobitelné, skutečně umožňuje, aby se Decidim formoval podle toho, jak děláme svou práci, a ne aby se formovala naše práce.'
    title: Reference
  thanks:
    message: Děkujeme, že jste nás kontaktovali, brzy se k vám vrátíme.
    title: Děkujeme za váš e-mail
  trademark:
    examples-1:
      l1: Uvádění loga Decidim na stránkách produktů s nápisem "spolupracujeme s Decidim" (např. hosting, poradenské služby, vývoj založený na Decidim).
      l2: Použití ochranné známky "Decidim" v názvech knih a výzkumných článcích.
      l3: Používání loga Decidim v zápatí instance (‚Běží na Decidim‘).
      title: Příklady použití, které nepotřebují povolení
    examples-2:
      l1: Prodej zboží (samolepky, trička, hrnky atd.).
      l2: Použití loga Decidim na obalu knihy.
      l3: Použití loga Decidim v záhlaví webových stránek, což znamená, že jste organizace Decidim.
      title: Příklady použití, které potřebují povolení
    examples-3:
      l1: Pojmenování společnosti nebo produktu po společnosti Decidim, například "The Decidim Consultants".
      title: Příklady použití, které nezískají oprávnění
    goals:
      l1: Rádi bychom komukoliv usnadnili používání názvu Decidim nebo loga pro komunitně orientované úsilí, které pomáhá šířit a zlepšovat Decidim.
      l2: Rádi bychom objasnili, jakým způsobem mohou (a nemohou) firmy a projekty spojené se společností Decidim používat název a logo společnosti Decidim.
      l3: Rádi bychom znemožnili, aby kdokoli používal jméno a logo Decidim k nekalému obohacování, klamání nebo matení lidí, kteří hledají oficiální zdroje Decidim.
    p1: '"Decidim" a logo Decidim jsou registrované ochranné známky společnosti Associació de Software Lliure Decidim. Tyto ochranné známky nesmíte používat v komerčním prostředí, abyste naznačili, že váš produkt nebo služba jsou podporovány nebo spojeny se společností Decidim, bez povolení. Tyto ochranné známky smíte používat k odkazu na společnost Decidim způsobem, ze kterého je zřejmé, že pouze odkazujete na projekt, aniž byste si činili nárok na podporu nebo přidružení.'
    p2: 'Pokud používáte logo Decidim jakýmkoli způsobem, musíte přidat následující text: <i>"Název a logo Decidim je registrovaná ochranná známka společnosti Associació de Software Lliure Decidim."</i>'
    p3: 'Tyto zásady používání ochranné známky jsme vypracovali s ohledem na následující cíle:'
    p4: O povolení můžete požádat e-mailem na associacio@decidim.org.
    p5: Tato stránka se zásadami ochranných známek byla založena v <a href="%{rails_url}">Ruby on Rails</a> a <a href="%{wordpress_url}">Wordpress Foundation</a>.
    title: Zásady používání ochranných známek
