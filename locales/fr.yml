  partnership-policy:
    back_to_partners: Back to partners
    explanation: Sustaining Decidim takes time and resources. Several tasks need to be handled, such as reviewing contributions, triaging issues, fixing bugs, writing documentation, and answering general doubts shared by the community. Any organization (enterprise, association, or collective) willing to become a Decidim Partner is committed to contribute to the Decidim Association with a reduced fee of 3% of the yearly income generated by Decidim activities. In the case of nonprofit organizations, this fee is 1.5%. Every Decidim Partner will be made publicly visible in the <a href="%{main_website_url}">Decidim main website</a> and the <a href="%{readme_url}">GitHub project README page</a>. In addition, the Decidim Association will recommend Decidim Partners in our talks and email conversations about providing services with Decidim. To support recently incorporated organizations, Decidim Partners will be exempted from contributing economically during their first year to first develop their business plan with Decidim. In the meantime, we recommend that Decidim Partners find other ways to contribute to the project (such as with bug reporting, documentation, participation and support in community activities, etc.).
    how_to:
      steps:
        step1: Envoyez un email à associacio [arobase] decidim [point] org avec vos coordonnées et indiquez dans le sujet que vous voulez devenir un partenaire Decidim.
        step2: Nous vous contacterons pour une vidéoconférence afin d'évaluer la candidature.
        step3: Si la candidature est approuvée, le Comité de Coordination vous enverra chaque année une déclaration assermentée à remplir et renvoyer avec la réception du virement bancaire correspondant.
      title: Comment devenir un partenaire Decidim ?
    requirements:
      l1: Gestion d'instances. Gérer une ou plusieurs installations actives de Decidim au moment de la candidature, pour sa propre utilisation ou pour des tierces parties.
      l2: Contributions au projet. Contribuer ou avoir contribué de façon significative au projet Decidim.
      p1: 'Vous devez accepter de remplir et de signer le <a href="%{social_contract_url}">Contrat Social</a> et remplir l''une des conditions suivantes pour être membre :'
      p2: Vous pouvez lire en détail dans l'assemblée <a href="%{metadecidim_partners_url}">Metadecidim</a>.
      title: Quelles sont les exigences auxquelles mon organisation doit satisfaire pour devenir partenaire?
    subtitle: Si votre organisation veut soutenir Decidim, vous pouvez devenir un partenaire Decidim.
    title: Politique de partenariat
